}

/* ============== WORKLOAD VIEW ============== */
let WORKLOAD_ZOOM = 'day';

function workloadDayWidth() {
  return { day: 36, week: 14, month: 5 }[WORKLOAD_ZOOM];
}

function renderWorkload() {
  const view = $('#workloadView');
  const dayWidth = workloadDayWidth();

  // Sync threshold input
  const thrInput = $('#workloadThresholdInput');
  if (thrInput) thrInput.value = STATE.workloadThreshold;

  // Determine date range
  const t = today();
  let min = addDays(t, -7);
  let max = addDays(t, 60);
  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      for (const tk of (m.tasks || [])) {
        if (tk.start) { const d = parseDate(tk.start); if (d < min) min = d; }
        if (tk.end)   { const d = parseDate(tk.end);   if (d > max) max = d; }
      }
    }
  }
  // Align min to Monday
  const dow = min.getDay();
  min = addDays(min, dow === 0 ? -6 : 1 - dow);
  const totalDays = daysBetween(min, max) + 1;
  const timelineWidth = totalDays * dayWidth;

  if (STATE.data.engineers.length === 0) {
    view.innerHTML = `<div class="empty-state">
      <h2>No team members yet</h2>
      <p>Add team members in Settings to see workload.</p>
      <button class="btn primary" onclick="openSettings()">⚙ Open Settings</button>
    </div>`;
    return;
  }

  // Build per-engineer per-day count
  const engineers = STATE.data.engineers;
  const counts = {}; // counts[engId][dayIdx] = count
  for (const e of engineers) counts[e.id] = new Array(totalDays).fill(0);

  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      for (const tk of (m.tasks || [])) {
        if (!tk.start || !tk.end || !tk.assigneeId) continue;
        if (!counts[tk.assigneeId]) continue;
        const ts = parseDate(tk.start);
        const te = parseDate(tk.end);
        const startIdx = Math.max(0, daysBetween(min, ts));
        const endIdx = Math.min(totalDays - 1, daysBetween(min, te));
        for (let i = startIdx; i <= endIdx; i++) {
          counts[tk.assigneeId][i] += 1;
        }
      }
    }
  }

  // Render header
  let majorHtml = '';
  let minorHtml = '';
  if (WORKLOAD_ZOOM === 'day') {
    let curMonth = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getMonth() !== curMonth) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
          majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
        }
        curMonth = d.getMonth();
        monthStart = i;
      }
      const isWknd = d.getDay() === 0 || d.getDay() === 6;
      const isToday = fmtDate(d) === todayStr();
      minorHtml += `<div class="minor-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width:${dayWidth}px;">
        <span class="label-1">${d.getDate()}</span>
        <span class="label-2">${['S','M','T','W','T','F','S'][d.getDay()]}</span>
      </div>`;
    }
    const w = (totalDays - monthStart) * dayWidth;
    const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
  } else if (WORKLOAD_ZOOM === 'week') {
    let curMonth = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getMonth() !== curMonth) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
          majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
        }
        curMonth = d.getMonth();
        monthStart = i;
      }
      const isWknd = d.getDay() === 0 || d.getDay() === 6;
      const isToday = fmtDate(d) === todayStr();
      const showLabel = d.getDay() === 1;
      minorHtml += `<div class="minor-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width:${dayWidth}px;">
        ${showLabel ? `<span class="label-1">${d.getDate()}</span>` : ''}
      </div>`;
    }
    const w = (totalDays - monthStart) * dayWidth;
    const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
  } else {
    // month
    let curYear = -1, yearStart = 0;
    let curMonth = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getFullYear() !== curYear) {
        if (curYear !== -1) {
          const w = (i - yearStart) * dayWidth;
          majorHtml += `<div class="major-cell" style="width:${w}px;">${curYear}</div>`;
        }
        curYear = d.getFullYear();
        yearStart = i;
      }
      if (d.getMonth() !== curMonth) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short' });
          minorHtml += `<div class="minor-cell" style="width:${w}px;"><span class="label-1">${name}</span></div>`;
        }
        curMonth = d.getMonth();
        monthStart = i;
      }
    }
    const wY = (totalDays - yearStart) * dayWidth;
    majorHtml += `<div class="major-cell" style="width:${wY}px;">${curYear}</div>`;
    const wM = (totalDays - monthStart) * dayWidth;
    const nameM = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short' });
    minorHtml += `<div class="minor-cell" style="width:${wM}px;"><span class="label-1">${nameM}</span></div>`;
  }

  // Render rows: one per engineer (only those who have any tasks)
  const engsToShow = engineers.filter(e => counts[e.id].some(c => c > 0));
  let sideBodyHtml = '';
  let gridBodyHtml = '';

  if (engsToShow.length === 0) {
    sideBodyHtml = '';
    gridBodyHtml = '';
  } else {
    for (const e of engsToShow) {
      const totalTasks = counts[e.id].reduce((a, b) => a + b, 0);
      sideBodyHtml += `
        <div class="workload-row-name" data-eng-id="${e.id}">
          <span class="eng-dot" style="background:${e.color}; width:10px; height:10px;"></span>
          <span style="color:${e.color}">${escapeHtml(e.name)}</span>
          <span style="color:var(--text-faint); font-size:10px; margin-left:auto;">${totalTasks}d</span>
        </div>
      `;

      let cellsHtml = '';
      if (WORKLOAD_ZOOM === 'day') {
        for (let i = 0; i < totalDays; i++) {
          const d = addDays(min, i);
          const isWknd = d.getDay() === 0 || d.getDay() === 6;
          const isToday = fmtDate(d) === todayStr();
          const c = counts[e.id][i];
          const lvl = c >= STATE.workloadThreshold ? 'heavy' : (c >= Math.max(1, STATE.workloadThreshold - 1) ? 'medium' : '');
          cellsHtml += `<div class="workload-day-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width:${dayWidth}px;">
            ${c > 0 ? `<span class="workload-load ${lvl}">${c}</span>` : ''}
          </div>`;
        }
      } else if (WORKLOAD_ZOOM === 'week') {
        // Aggregate per week (max count in week)
        let i = 0;
        while (i < totalDays) {
          const d = addDays(min, i);
          // Find length of this "week" starting at i (until next Monday or end)
          let len = 1;
          while (i + len < totalDays) {
            const dd = addDays(min, i + len);
            if (dd.getDay() === 1) break;
            len++;
          }
          let maxC = 0;
          for (let j = i; j < i + len; j++) maxC = Math.max(maxC, counts[e.id][j]);
          const isToday = fmtDate(d) <= todayStr() && todayStr() < fmtDate(addDays(d, len));
          const lvl = maxC >= STATE.workloadThreshold ? 'heavy' : (maxC >= Math.max(1, STATE.workloadThreshold - 1) ? 'medium' : '');
          cellsHtml += `<div class="workload-day-cell ${isToday?'today':''}" style="width:${len * dayWidth}px;">
            ${maxC > 0 ? `<span class="workload-load ${lvl}">${maxC}</span>` : ''}
          </div>`;
          i += len;
        }
      } else {
        // month: max per month
        let i = 0;
        while (i < totalDays) {
          const d = addDays(min, i);
          const monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0);
          const lenInMonth = Math.min(daysBetween(d, monthEnd) + 1, totalDays - i);
          let maxC = 0;
          for (let j = i; j < i + lenInMonth; j++) maxC = Math.max(maxC, counts[e.id][j]);
          const tStr = todayStr();
          const isThisMonth = (d.getFullYear() === today().getFullYear() && d.getMonth() === today().getMonth());
          const lvl = maxC >= STATE.workloadThreshold ? 'heavy' : (maxC >= Math.max(1, STATE.workloadThreshold - 1) ? 'medium' : '');
          cellsHtml += `<div class="workload-day-cell ${isThisMonth?'today':''}" style="width:${lenInMonth * dayWidth}px;">
            ${maxC > 0 ? `<span class="workload-load ${lvl}">${maxC}</span>` : ''}
          </div>`;
          i += lenInMonth;
        }
      }
      gridBodyHtml += `<div class="workload-row" style="width:${timelineWidth}px;">${cellsHtml}</div>`;
    }
  }

  const todayOffset = daysBetween(min, today()) * dayWidth + dayWidth / 2;

  view.innerHTML = `
    <div class="workload-header">
      <div class="workload-side-header">Team Member</div>
      <div class="workload-timeline-header" id="workloadHeaderScroll">
        <div style="width:${timelineWidth}px;">
          <div class="timeline-row-major">${majorHtml}</div>
          <div class="timeline-row-minor">${minorHtml}</div>
        </div>
      </div>
    </div>
    <div class="workload-body">
      <div class="workload-side-body" id="workloadSideScroll">${sideBodyHtml || '<div class="empty-state" style="padding:20px;"><p style="font-size:11px;">No tasks scheduled.<br/>Assign tasks to team members in the Gantt view.</p></div>'}</div>
      <div class="workload-grid-wrap" id="workloadGridScroll">
        <div style="width:${timelineWidth}px; position:relative;">
          ${gridBodyHtml}
          <div class="today-line" style="left:${todayOffset}px; top:0; bottom:0;"></div>
        </div>
      </div>
    </div>
  `;

  // Sync scrolls
  const headerScroll = $('#workloadHeaderScroll');
  const sideScroll = $('#workloadSideScroll');
  const gridScroll = $('#workloadGridScroll');
  let syncing = false;
  if (gridScroll) {
    gridScroll.addEventListener('scroll', () => {
      if (syncing) return;
      syncing = true;
      if (headerScroll) headerScroll.scrollLeft = gridScroll.scrollLeft;
      if (sideScroll) sideScroll.scrollTop = gridScroll.scrollTop;
      syncing = false;
    });
  }
  if (sideScroll) {
    sideScroll.addEventListener('scroll', () => {
      if (syncing) return;
      syncing = true;
      if (gridScroll) gridScroll.scrollTop = sideScroll.scrollTop;
      syncing = false;
    });
  }

  // Click engineer name to filter Gantt by them (jump to gantt)
  view.querySelectorAll('.workload-row-name').forEach(el => {
    el.addEventListener('click', () => {
      const engId = el.dataset.engId;
      // Add an engineer filter and switch to gantt
      STATE.filters = STATE.filters.filter(f => f.type !== 'engineer');
      STATE.filters.push({ type: 'engineer', value: engId });
      setView('gantt');
    });
  });
}

function scrollWorkloadToToday() {
  const grid = $('#workloadGridScroll');
  if (!grid) return;
  const t = today();
  let min = addDays(t, -7);
  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      for (const tk of (m.tasks || [])) {
        if (tk.start) { const d = parseDate(tk.start); if (d < min) min = d; }
      }
    }
  }
  const dow = min.getDay();
  min = addDays(min, dow === 0 ? -6 : 1 - dow);
  const offset = daysBetween(min, t) * workloadDayWidth();
  grid.scrollLeft = Math.max(0, offset - 40);
}

function runPrint(paper, orient, scope) {
  // Inject a temporary @page rule with the chosen size + orientation.
  // Browsers honor the @page rule for the page size; users still confirm in
  // the print dialog (and may need to enable "Background graphics" for colors).
  const sizeMap = {
    letter: '8.5in 11in',
    tabloid: '11in 17in',
  };
  const dim = sizeMap[paper] || sizeMap.letter;
  const styleEl = document.createElement('style');
  styleEl.id = 'dynamicPrintStyle';
  styleEl.textContent = `
    @page { size: ${dim} ${orient}; margin: 0.5in; }
    body.printing .topbar, body.printing .filter-bar, body.printing .toolbar,
    body.printing .detail-panel, body.printing #modalRoot, body.printing #toastRoot,
    body.printing #tooltipRoot, body.printing .row-add-btn, body.printing .row-delete-btn,
    body.printing .rename-edit-icon, body.printing .col-resize-handle,
    body.printing .side-resize-handle, body.printing .deadline-jumper,
    body.printing .scroll-month-indicator { display: none !important; }
    body.printing { background: white !important; color: black !important; }
    body.printing .gantt-side-header,
    body.printing .gantt-side-body,
    body.printing .gantt-grid-wrap,
    body.printing .gantt-timeline-header-wrap,
    body.printing .gantt-body { overflow: visible !important; }
    body.printing .row-side, body.printing .row-grid { background: white !important; color: black !important; }
    body.printing .name-text, body.printing .due-text, body.printing .status-text,
    body.printing .cat-text { color: black !important; }
    body.printing .major-cell, body.printing .minor-cell {
      background: white !important; color: black !important;
      border-color: #999 !important;
    }
    body.printing .major-cell.current-month { background: #fff7e0 !important; }
    body.printing .minor-cell.today { background: #fff7e0 !important; }
    body.printing .bar { border: 1px solid #333 !important; }
    body.printing .main, body.printing .gantt-body, body.printing #ganttView,
    body.printing .gantt-side-body, body.printing .gantt-grid-wrap {
      height: auto !important; max-height: none !important;
    }
    /* Make sure project end labels print readable */
    body.printing .project-end-label { color: black !important; text-shadow: none !important; }
    body.printing .proj-tag-num { background: #d4a574 !important; color: black !important; }
    /* Print color adjustment */

function saveSettings() {
  $$('#engsList input, #engsList select').forEach(el => {
    const id = el.dataset.engId;
    const field = el.dataset.field;
    if (!id || !field) return;
    const e = getEngineer(id);
    if (e) e[field] = el.value;
  });
  $$('#statusesList input').forEach(el => {
    const id = el.dataset.statusId;
    const field = el.dataset.field;
    if (!id || !field) return;
    const s = STATE.data.statuses.find(x => x.id === id);
    if (s) {
      if (el.type === 'checkbox') s[field] = el.checked;
      else s[field] = el.value;
    }
  });
  $$('#catsList input').forEach(el => {
    const id = el.dataset.catId;
    const field = el.dataset.field;
    if (!id || !field) return;
    const c = STATE.data.categories.find(x => x.id === id);
    if (c) c[field] = el.value;
  });

  // Column visibility & widths
  $$('#columnSettingsList input').forEach(el => {
    const key = el.dataset.colKey;
    const field = el.dataset.colField;
    if (!key || !field) return;
    const col = STATE.columnSettings[key];
    if (!col) return;
    if (field === 'visible') {
      if (col.required && !el.checked) { el.checked = true; return; }
      col.visible = el.checked;
    } else if (field === 'width') {
      const v = Math.max(60, Math.min(500, parseInt(el.value) || 100));
      col.width = v;
    }
  });

  // Workload threshold
  const thrEl = $('#settingsThreshold');
  if (thrEl) {
    STATE.workloadThreshold = Math.max(1, Math.min(20, parseInt(thrEl.value) || 3));
  }

  STATE.data.currentUserId = $('#currentUserSelect').value || null;
  saveData();
  closeModal();
  renderAll();
  toast('Settings saved', 'success');
}

function removeEngineer(id) {
  if (!confirm('Remove this team member? They will be removed from all assignments.')) return;
  STATE.data.engineers = STATE.data.engineers.filter(e => e.id !== id);
  for (const p of STATE.data.projects) {
    if (p.managerId === id) p.managerId = '';
    for (const m of (p.milestones || [])) {
      m.assigneeIds = (m.assigneeIds || []).filter(i => i !== id);
      for (const t of (m.tasks || [])) {
        if (t.assigneeId === id) t.assigneeId = '';
      }
    }
  }
  if (STATE.data.currentUserId === id) STATE.data.currentUserId = null;
  saveData();
  openSettings();
  renderAll();
}

function removeStatus(id) {
  if (STATE.data.statuses.length <= 1) { toast('Need at least one status', 'error'); return; }
  if (!confirm('Remove this status? Items using it will fall back to the first status.')) return;
  STATE.data.statuses = STATE.data.statuses.filter(s => s.id !== id);
  const fallback = STATE.data.statuses[0].id;
  for (const p of STATE.data.projects) {
    if (p.statusId === id) p.statusId = fallback;
    for (const m of (p.milestones || [])) {
      if (m.statusId === id) m.statusId = fallback;
    }
  }
  saveData();
  openSettings();
  renderAll();
}

function parseCsvLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else cur += c;
    } else {
      if (c === ',') { result.push(cur); cur = ''; }
      else if (c === '"') inQuotes = true;
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

function processCsvImport() {
  const text = $('#csvInput').value.trim();
  if (!text) { toast('Empty CSV', 'error'); return; }
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) { toast('Need at least header + 1 row', 'error'); return; }
  const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const idxNum = header.indexOf('projectnumber');
  const idxProj = header.indexOf('project');
  const idxMile = header.indexOf('milestone');
  const idxCat = header.indexOf('category');
  const idxDue = header.indexOf('duedate');
  const idxAssign = header.indexOf('assignees');
  const idxStatus = header.indexOf('status');
  const idxMgr = header.indexOf('manager');
  if (idxProj < 0 || idxMile < 0) {
    toast('Header must include Project, Milestone', 'error');
    return;
  }
  let added = 0;
  let warnings = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = parseCsvLine(lines[i]);
    const projNum = idxNum >= 0 ? (cells[idxNum] || '').trim() : '';
    const projName = (cells[idxProj] || '').trim();
    const mileName = (cells[idxMile] || '').trim();
    const catName = idxCat >= 0 ? (cells[idxCat] || '').trim() : '';
    const dueDate = idxDue >= 0 ? (cells[idxDue] || '').trim() : '';
    const assigneeNames = idxAssign >= 0 ? (cells[idxAssign] || '').split(';').map(s => s.trim()).filter(Boolean) : [];
    const statusName = idxStatus >= 0 ? (cells[idxStatus] || '').trim() : '';
    const mgrName = idxMgr >= 0 ? (cells[idxMgr] || '').trim() : '';
    if (!projName || !mileName) continue;

    let p = STATE.data.projects.find(x => x.name === projName || (projNum && x.number === projNum));
    if (!p) {
      const mgr = mgrName ? STATE.data.engineers.find(e => e.name.toLowerCase() === mgrName.toLowerCase()) : null;
      p = {
        id: uid('p'), number: projNum, name: projName, client: '',
        managerId: mgr ? mgr.id : '',
        statusId: 'st_inprogress', expanded: true, milestones: [],
        createdAt: new Date().toISOString(),
        createdBy: STATE.data.currentUserId || null,
        history: [{ id: uid('h'), timestamp: new Date().toISOString(), action: 'Project created via CSV import', by: null }],
      };
      STATE.data.projects.push(p);
      if (mgrName && !mgr) warnings.push(`Unknown manager: "${mgrName}"`);
    } else if (projNum && !p.number) {
      p.number = projNum;
    }
    let categoryId = '';
    if (catName) {
      const cat = STATE.data.categories.find(c => c.name.toLowerCase() === catName.toLowerCase());
      if (cat) categoryId = cat.id;
      else warnings.push(`Unknown category: "${catName}"`);
    }
    const assigneeIds = [];
    for (const an of assigneeNames) {
      const eng = STATE.data.engineers.find(e => e.name.toLowerCase() === an.toLowerCase());
      if (eng) assigneeIds.push(eng.id);
      else warnings.push(`Unknown engineer: "${an}"`);
    }
    let statusId = 'st_notstarted';
    if (statusName) {
      const st = STATE.data.statuses.find(s => s.name.toLowerCase() === statusName.toLowerCase());
      if (st) statusId = st.id;
    }
    p.milestones.push({
      id: uid('m'), name: mileName, categoryId, statusId, dueDate, assigneeIds, tasks: [], notes: '', visibility: 'shared', createdBy: STATE.data.currentUserId || '',
    });
    added++;
  }

  saveData();
  closeModal();
  renderAll();
  toast(`Imported ${added} milestones${warnings.length ? `. ${warnings.length} warning(s)` : ''}`, 'success');
  if (warnings.length) console.warn('CSV warnings:', warnings);
}

function escapeIcs(s) {
  return String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
}
function icsDate(s) { return String(s).replace(/-/g, ''); }
function icsDateNext(s) {
  const d = parseDate(s);
  return fmtDate(addDays(d, 1)).replace(/-/g, '');
}
function icsTimestamp(d) {
  const pad = n => String(n).padStart(2, '0');
  return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate())
    + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}

function generateIcs() {
  const engId = $('#icsEng').value;
  const incMs = $('#icsIncMilestones').checked;
  const incT = $('#icsIncTasks').checked;
  const eng = engId ? getEngineer(engId) : null;

  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//VCA Schedule//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    `X-WR-CALNAME:${eng ? eng.name + ' — VCA Schedule' : 'VCA Schedule — All Milestones'}`,
  ];
  const now = icsTimestamp(new Date());

  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      // PRIVACY: only milestones marked 'shared' (or with no visibility set)
      // are exported to calendar / Outlook. Engineers-only and private
      // milestones stay inside the app.
      if ((m.visibility || 'shared') !== 'shared') continue;

      const cat = getCategory(m.categoryId);
      const catLabel = cat ? `[${cat.name}] ` : '';
      if (incMs && m.dueDate) {
        const include = !engId || (m.assigneeIds || []).includes(engId);
        if (include) {
          const assignNames = (m.assigneeIds || []).map(id => { const e = getEngineer(id); return e ? e.name : ''; }).filter(Boolean).join(', ');
          const desc = `Project: ${p.name}\n${cat ? 'Category: ' + cat.name + '\n' : ''}Status: ${getStatus(m.statusId).name}${assignNames ? '\nAssignees: '+assignNames : ''}${m.notes ? '\n\nNotes: '+m.notes : ''}`;
          lines.push('BEGIN:VEVENT');
          lines.push(`UID:milestone-${m.id}@studio-schedule`);
          lines.push(`DTSTAMP:${now}`);
          lines.push(`DTSTART;VALUE=DATE:${icsDate(m.dueDate)}`);
          lines.push(`DTEND;VALUE=DATE:${icsDateNext(m.dueDate)}`);
          lines.push(`SUMMARY:${escapeIcs(`◆ ${p.name} — ${catLabel}${m.name}`)}`);
          lines.push(`DESCRIPTION:${escapeIcs(desc)}`);
          lines.push(`CATEGORIES:Milestone,${escapeIcs(p.name)}`);
          lines.push('END:VEVENT');
        }
      }
      if (incT) {
        for (const t of (m.tasks || [])) {
          if (!t.start || !t.end) continue;
          if (engId && t.assigneeId !== engId) continue;
          const tEng = getEngineer(t.assigneeId);
          const taskLabel = t.name || (tEng ? tEng.name : 'Task');
          const desc = `Project: ${p.name}\n${cat ? 'Category: ' + cat.name + '\n' : ''}Milestone: ${m.name}\nTask: ${taskLabel}${tEng ? '\nWork by: '+tEng.name : ''}`;
          lines.push('BEGIN:VEVENT');
          lines.push(`UID:task-${t.id}@studio-schedule`);
          lines.push(`DTSTAMP:${now}`);
          lines.push(`DTSTART;VALUE=DATE:${icsDate(t.start)}`);
          lines.push(`DTEND;VALUE=DATE:${icsDateNext(t.end)}`);
          lines.push(`SUMMARY:${escapeIcs(`${p.name} — ${catLabel}${m.name} · ${taskLabel}`)}`);
          lines.push(`DESCRIPTION:${escapeIcs(desc)}`);
          lines.push(`CATEGORIES:Task,${escapeIcs(p.name)}`);
          lines.push('END:VEVENT');
        }
      }
    }
  }

  lines.push('END:VCALENDAR');
  const ics = lines.join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${eng ? eng.name.replace(/\s+/g,'_') : 'studio'}-schedule-${todayStr()}.ics`;
  a.click();
  URL.revokeObjectURL(url);
  closeModal();
  toast('Calendar file downloaded', 'success');
}

function fitToScreen() {
  const { min, max } = getOverallDateRange();
  const days = daysBetween(min, max) + 1;
  const grid = $('#ganttGridScroll');
  const availWidth = grid ? grid.clientWidth : 1000;
  const candidates = [['day', 40], ['week', 20], ['month', 8], ['quarter', 3]];
  let chosen = 'quarter';
  for (const [name, ppd] of candidates) {
    if (days * ppd <= availWidth) { chosen = name; break; }
  }
  STATE.zoomLevel = chosen;
  $$('#zoomToggle .zoom-btn').forEach(b => b.classList.toggle('active', b.dataset.zoom === chosen));
  renderGantt();
}

// Default initial scroll: today at ~1/3 from the left of the visible area.
function scrollTodayDefault() {
  const grid = $('#ganttGridScroll');
  if (!grid) return;
  const { min } = getOverallDateRange();
  const offset = daysBetween(min, today()) * pixelsPerDay();
  const visW = grid.clientWidth || 800;
  grid.scrollLeft = Math.max(0, offset - visW / 3);
}

// "Today" button: pin today to the very left edge.
function scrollTodayToLeft() {
  const grid = $('#ganttGridScroll');
  if (!grid) return;
  const { min } = getOverallDateRange();
  const offset = daysBetween(min, today()) * pixelsPerDay();
  grid.scrollLeft = Math.max(0, offset - 8);
}

async function init() {
  loadLocal();
  await initFirebase();

  $$('.tab').forEach(t => t.addEventListener('click', () => setView(t.dataset.view)));

  $('#colorMode').addEventListener('change', (e) => { STATE.colorMode = e.target.value; renderAll(); });

  $$('#zoomToggle .zoom-btn').forEach(b => {
    b.addEventListener('click', () => {
      $$('#zoomToggle .zoom-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      STATE.zoomLevel = b.dataset.zoom;
      renderGantt();
      setTimeout(scrollTodayDefault, 30);
    });
  });

  $('#fitBtn').addEventListener('click', fitToScreen);
  $('#columnsBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    openColumnsPopup(e.currentTarget);
  });
  $('#showMilestones').addEventListener('change', (e) => { STATE.showMilestones = e.target.checked; renderCalendar(); });
  $('#showTasks').addEventListener('change', (e) => { STATE.showTasks = e.target.checked; renderCalendar(); });

  $('#newProjectBtn').addEventListener('click', () => {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    openNewProjectModal();
  });
  $('#settingsBtn').addEventListener('click', openSettings);
  $('#printBtn').addEventListener('click', openPrintDialog);
  $('#currentUserBadge').addEventListener('click', promptForUserIdentity);
  $('#importCsvBtn').addEventListener('click', openCsvImport);
  $('#exportIcsBtn').addEventListener('click', openIcsExport);
  $('#exportIcsBtn2').addEventListener('click', openIcsExport);
  $('#todayBtn').addEventListener('click', scrollTodayToLeft);

  $('#calToday').addEventListener('click', scrollCalendarToToday);

  // My Work toolbar
  $('#myworkUser').addEventListener('change', () => renderMyWork());
  $('#myworkExportBtn').addEventListener('click', () => {
    const userId = $('#myworkUser').value;
    if (!userId) { toast('Pick a user first', 'error'); return; }
    openIcsExport();
    setTimeout(() => {
      const sel = $('#icsEng');
      if (sel) sel.value = userId;
    }, 50);
  });

  // Workload toolbar
  $$('#workloadZoomToggle .zoom-btn').forEach(b => {
    b.addEventListener('click', () => {
      $$('#workloadZoomToggle .zoom-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      WORKLOAD_ZOOM = b.dataset.zoom;
      renderWorkload();
      setTimeout(scrollWorkloadToToday, 30);
    });
  });
  $('#workloadThresholdInput').addEventListener('change', (e) => {
    const v = Math.max(1, Math.min(20, parseInt(e.target.value) || 3));
    STATE.workloadThreshold = v;
    saveData();
    renderWorkload();
  });
  $('#workloadToday').addEventListener('click', scrollWorkloadToToday);

  $('#addFilterBtn').addEventListener('click', openAddFilterMenu);
  $('#clearFiltersBtn').addEventListener('click', () => { STATE.filters = []; renderAll(); });
  $('#sortBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    openSortPopup(e.currentTarget);
  });

  // Quick filter buttons
  $('#qfMine').addEventListener('click', () => toggleQuickFilter('manager_self'));
  $('#qfMyWork').addEventListener('click', () => toggleQuickFilter('engineer_self'));
  $('#qfActive').addEventListener('click', () => toggleQuickFilter('active_only'));
  $('#qfCategory').addEventListener('click', (e) => openQuickFilterPicker(e.currentTarget, 'category'));
  $('#qfClient').addEventListener('click', (e) => openQuickFilterPicker(e.currentTarget, 'client'));
  $('#qfManager').addEventListener('click', (e) => openQuickFilterPicker(e.currentTarget, 'manager'));
  $('#qfVisibility').addEventListener('click', (e) => openQuickFilterPicker(e.currentTarget, 'visibility'));

  // Filter separator: click to collapse Quick group, drag to swap group order.
  const sep = $('#filterSeparator');
  if (sep) {
    let dragStartX = null;
    let dragMoved = false;
    sep.addEventListener('mousedown', (e) => {
      dragStartX = e.clientX;
      dragMoved = false;
      const onMove = (ev) => {
        if (Math.abs(ev.clientX - dragStartX) > 12) dragMoved = true;
      };
      const onUp = (ev) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (dragMoved) {
          // Swap group order
          STATE.filterBarLayout.quickFirst = !STATE.filterBarLayout.quickFirst;
          saveData();
          applyFilterBarLayout();
        } else {
          // Click: toggle collapse of quick group
          STATE.filterBarLayout.quickCollapsed = !STATE.filterBarLayout.quickCollapsed;
          saveData();
          applyFilterBarLayout();
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  // Search
  let searchTimeout;
  $('#searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => performSearch(e.target.value), 200);
  });
  $('#searchInput').addEventListener('focus', (e) => {
    if (e.target.value) performSearch(e.target.value);
  });
  // Close search on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) {
      $('#searchResults').classList.remove('show');
    }
  });
  // Keyboard: Cmd/Ctrl + K to focus search; Cmd/Ctrl + N for Quick Add
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      $('#searchInput').focus();
      $('#searchInput').select();
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'n' || e.key === 'N')) {
      // Don't override when user is typing in an input
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      openQuickAddMilestone();
    }
    // F2: rename the currently selected row in the Gantt side panel.
    if (e.key === 'F2') {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const sel = STATE.selectedItem;
      if (!sel) return;
      // Find the corresponding rename anchor
      let selector = '';
      if (sel.type === 'project') selector = `.row-side[data-type="project"][data-project-id="${sel.projectId}"] [data-rename="project"]`;
      else if (sel.type === 'milestone') selector = `[data-rename="milestone"][data-project-id="${sel.projectId}"][data-milestone-id="${sel.milestoneId}"]`;
      else if (sel.type === 'task') selector = `[data-rename="task"][data-project-id="${sel.projectId}"][data-milestone-id="${sel.milestoneId}"][data-task-id="${sel.taskId}"]`;
      const anchor = selector && document.querySelector(selector);
      if (anchor) {
        e.preventDefault();
        openRenameInline(anchor, anchor.dataset.projectId, anchor.dataset.milestoneId, anchor.dataset.taskId);
      }
    }
    if (e.key === 'Escape') {
      // Close popup if open
      if ($('#activePopup')) { closePopup(); return; }
      // Close modal if any
      if ($('#modalRoot').children.length > 0) { closeModal(); return; }
      $('#searchResults').classList.remove('show');
      if (document.activeElement === $('#searchInput')) {
        $('#searchInput').blur();
        $('#searchInput').value = '';
        STATE.searchQuery = '';
        renderAll();
      }
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  renderAll();
  // Initial: today at left
  setTimeout(scrollTodayDefault, 100);

  // If we don't know who's using this browser yet, ask. Once they pick, the
  // choice is stored in localStorage and persists for that browser/profile.
  if (!STATE.data.currentUserId) {
    setTimeout(promptForUserIdentity, 400);
  }
}

// Modal asking "Who are you?" — shown the first time someone opens the app on
// a given browser (or after they explicitly clear it in Settings). The pick
// is saved to localStorage under CURRENT_USER_KEY so the same Chrome / Edge
// profile remembers it indefinitely.
function promptForUserIdentity() {
  // Don't prompt if a modal is already open
  if ($('#modalRoot').children.length > 0) return;
  const engineers = STATE.data.engineers || [];
  if (engineers.length === 0) return;

  const cards = engineers.map(e => `
    <button type="button" class="user-pick-card" data-uid="${e.id}">
      <span class="eng-dot" style="background:${e.color}; width:14px; height:14px;"></span>
      <span style="flex:1; text-align:left;">
        <div style="font-weight:600;">${escapeHtml(e.name)}</div>
        <div style="font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.3px;">${escapeHtml(e.role)}</div>
      </span>
    </button>
  `).join('');

  const html = `
    <div class="modal-content" style="max-width: 480px;">
      <h2 style="margin-bottom: 6px;">Who are you?</h2>
      <p style="color: var(--text-dim); font-size: 12px; margin-bottom: 16px;">
        This identifies you for created-by, "My Work", and ownership of private milestones.
        Your choice is remembered on this browser. You can change it anytime in <strong>⚙ Settings</strong>.
      </p>
      <div class="user-pick-grid">
        ${cards}
      </div>
      <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--text-faint);">Not in the list? Add yourself in Settings.</span>
        <button class="btn small" id="userPickSkip">Skip for now</button>
      </div>
    </div>
  `;
  showModal(html);

  document.querySelectorAll('.user-pick-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const uid = btn.dataset.uid;
      STATE.data.currentUserId = uid;
      saveData();
      closeModal();
      const eng = getEngineer(uid);
      toast(`Signed in as ${eng?.name || 'unknown'}`, 'success');
      renderAll();
    });
  });
  $('#userPickSkip').addEventListener('click', closeModal);
}
