      const PRINT_DPI   = 96;
      // Effective preview DPI scales with the user's zoom slider
      const PREVIEW_DPI = 56 * userPreviewZoom;
      const previewRatio = PREVIEW_DPI / PRINT_DPI;
      const previewW = Math.round(w * PREVIEW_DPI);
      const previewH = Math.round(h * PREVIEW_DPI);

      const iframe = $('#printPreviewIframe');
      if (!iframe) return;
      iframe.style.width = previewW + 'px';
      iframe.style.height = previewH + 'px';
      iframe.style.transform = '';

      const wrap = $('#printPreviewSlot');
      if (wrap) {
        wrap.style.width = previewW + 'px';
        wrap.style.height = previewH + 'px';
      }

      // Build the actual document and write it into the iframe.
      const doc = buildPrintDocumentHtml(opts, { previewZoom: previewRatio });
      try {
        const idoc = iframe.contentDocument || iframe.contentWindow.document;
        idoc.open();
        idoc.write(doc);
        idoc.close();
      } catch (e) {
        console.error('[print preview] iframe write failed', e);
      }
      // Update meta labels
      $('#previewMeta').textContent = `(${opts.paper === 'letter' ? 'Letter' : 'Tabloid'} · ${opts.orient === 'landscape' ? 'Landscape' : 'Portrait'} · ${Math.round(opts.scale * 100)}%)`;
      $('#printScaleLabel').textContent = `(${Math.round(opts.scale * 100)}%)`;
      $('#printBarLabel').textContent = `(${Math.round(opts.barWidth * 100)}%)`;
      // Project count
      const visible = (opts.scope === 'current')
        ? STATE.data.projects.filter(p => projectPassesFilters(p))
        : STATE.data.projects;
      $('#previewPageCount').textContent = `${visible.length} projects`;
    });
  };

  setTimeout(updatePreview, 80);
  document.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('change', updatePreview);
    el.addEventListener('input', updatePreview);
  });

  // Preview zoom controls. The slider sets userPreviewZoom (a multiplier on
  // the base preview DPI), then re-renders. +/− buttons step by 10%.
  // "Fit" computes the zoom that makes the page fit the preview pane.
  const setPreviewZoom = (pct) => {
    pct = Math.max(20, Math.min(200, pct));
    userPreviewZoom = pct / 100;
    const slider = $('#previewZoomSlider');
    if (slider) slider.value = pct;
    const label = $('#previewZoomLabel');
    if (label) label.textContent = pct + '%';
    updatePreview();
  };
  $('#previewZoomSlider')?.addEventListener('input', (e) => {
    setPreviewZoom(parseInt(e.target.value, 10));
  });
  $('#previewZoomIn')?.addEventListener('click', () => {
    setPreviewZoom(Math.round(userPreviewZoom * 100) + 10);
  });
  $('#previewZoomOut')?.addEventListener('click', () => {
    setPreviewZoom(Math.round(userPreviewZoom * 100) - 10);
  });
  $('#previewZoomFit')?.addEventListener('click', () => {
    // Compute the zoom that fits the current paper into the preview pane.
    const opts = readOptions();
    const dims = { letter: [8.5, 11], tabloid: [11, 17] }[opts.paper];
    let w = dims[0], h = dims[1];
    if (opts.orient === 'landscape') [w, h] = [h, w];
    const frame = $('#printPreviewFrame');
    if (!frame) return;
    const availW = frame.clientWidth - 40;   // padding
    const availH = frame.clientHeight - 40;
    // Required PREVIEW_DPI to fit
    const dpiByW = availW / w;
    const dpiByH = availH / h;
    const fitDpi = Math.min(dpiByW, dpiByH);
    // Convert that DPI back to a percentage relative to the 56-DPI base
    const pct = Math.round((fitDpi / 56) * 100);
    setPreviewZoom(pct);
  });

  $('#printCancel').addEventListener('click', closeModal);
  $('#printGo').addEventListener('click', () => {
    const opts = readOptions();
    closeModal();
    doPrintViaIframe(opts);
  });
}

// Build a print-ready HTML document and print it via a hidden iframe on
// this page. This avoids both:
//   1. Teams iframe blocking window.print() on the main document
//   2. Pop-up blockers preventing window.open()
// The iframe is appended, populated with our HTML, focused, and we call
// .contentWindow.print() — which opens the browser's native print dialog
// scoped to that iframe.
function doPrintViaIframe(opts) {
  console.log('[print] start', opts);
  let docHtml;
  try {
    docHtml = buildPrintDocumentHtml(opts);
  } catch (e) {
    console.error('[print] failed to build doc', e);
    toast('Could not build print document: ' + e.message, 'error');
    return;
  }
  const old = document.getElementById('printIframe');
  if (old) old.remove();

  // Compute the page dimensions in CSS pixels (96 DPI). Sizing the iframe
  // to match the printed page width means the document lays out the same
  // way the printer will render it — no surprises like an iframe rendered
  // at 1024px wide and then squeezed onto an 8.5" sheet, which causes
  // bars to stretch and percentage offsets to land in unexpected places.
  const dims = { letter: [8.5, 11], tabloid: [11, 17] }[opts.paper] || [8.5, 11];
  let pageW = dims[0], pageH = dims[1];
  if (opts.orient === 'landscape') [pageW, pageH] = [pageH, pageW];
  const cssW = Math.round(pageW * 96);
  const cssH = Math.round(pageH * 96);

  const iframe = document.createElement('iframe');
  iframe.id = 'printIframe';
  // Position off-screen but at correct logical size — visibility:hidden
  // keeps it from being seen, but layout still happens normally.
  iframe.style.cssText = `position:fixed; left:-${cssW + 100}px; top:0; width:${cssW}px; height:${cssH}px; border:0; visibility:hidden;`;
  document.body.appendChild(iframe);
  setTimeout(() => {
    try {
      const idoc = iframe.contentDocument || iframe.contentWindow.document;
      idoc.open();
      idoc.write(docHtml);
      idoc.close();
      setTimeout(() => {
        try {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
          console.log('[print] iframe.contentWindow.print() called');
        } catch (e) {
          console.error('[print] iframe print failed', e);
          toast('Print failed: ' + e.message, 'error');
        }
        setTimeout(() => { iframe.remove(); }, 60000);
      }, 400);
    } catch (e) {
      console.error('[print] iframe write failed', e);
      toast('Print failed to render: ' + e.message, 'error');
      iframe.remove();
    }
  }, 50);
}

// Build a complete, self-contained printable HTML document. Returns a
// string. Layout: a header, a single table where the timeline column has
// month markers across the top and a vertical "today" line that spans every
// row. Page breaks happen naturally between rows.
function buildPrintDocumentHtml(opts, previewOpts) {
  // Backward-compat: if called with positional args, normalize
  if (typeof opts === 'string') {
    opts = { paper: arguments[0], orient: arguments[1], scope: arguments[2] };
  }
  // previewOpts.previewZoom: when set, the body uses CSS `zoom` so the
  // preview iframe can render the page smaller while keeping all text and
  // shapes vector-crisp (unlike transform:scale which rasterizes).
  const previewZoom = (previewOpts && previewOpts.previewZoom) || null;
  const paper  = opts.paper  || 'letter';
  const orient = opts.orient || 'landscape';
  const scope  = opts.scope  || 'current';
  const scale  = opts.scale  || 0.85;
  const barWidth = opts.barWidth || 0.6;
  const cols   = opts.cols   || ['num', 'name', 'client', 'mgr'];
  const incMilestoneRows = opts.incMilestoneRows !== false;
  const incToday = opts.incToday !== false;

  const dims = { letter: [8.5, 11], tabloid: [11, 17] }[paper] || [8.5, 11];
  let pageW = dims[0], pageH = dims[1];
  if (orient === 'landscape') [pageW, pageH] = [pageH, pageW];

  const visibleProjects = (scope === 'current')
    ? STATE.data.projects.filter(p => projectPassesFilters(p))
    : STATE.data.projects.slice();

  // Compute timeline range. By default we span all milestones with a small
  // pad on each side (= "auto"). The user can override this via todayPos:
  //   left:   today at 5% from left  (mostly future)
  //   center: today in the middle    (balanced)
  //   right:  today at 95%           (mostly past)
  // For these modes we keep the same total span as auto but shift the window
  // so today lands in the requested spot.
  const todayPos = opts.todayPos || 'auto';
  let minDate = null, maxDate = null;
  for (const p of visibleProjects) {
    for (const m of (p.milestones || [])) {
      if (m.dueDate) {
        const d = parseDate(m.dueDate);
        if (d) {
          if (!minDate || d < minDate) minDate = d;
          if (!maxDate || d > maxDate) maxDate = d;
        }
      }
    }
  }
  if (!minDate) minDate = today();
  if (!maxDate) maxDate = addDays(today(), 90);
  minDate = addDays(minDate, -7);
  maxDate = addDays(maxDate, 14);
  if (todayPos !== 'auto') {
    const span = daysBetween(minDate, maxDate);
    const tDay = today();
    const pos = { left: 0.05, center: 0.5, right: 0.95 }[todayPos] || 0.5;
    // Place today at the requested fractional position
    const offsetFromMin = Math.round(span * pos);
    minDate = addDays(tDay, -offsetFromMin);
    maxDate = addDays(minDate, span);
  }
  const totalDays = Math.max(1, daysBetween(minDate, maxDate));

  const viewLabel = STATE.view === 'gantt' ? 'Gantt Chart'
    : STATE.view === 'calendar' ? 'Calendar'
    : STATE.view === 'mywork' ? 'My Work'
    : STATE.view === 'workload' ? 'Workload'
    : 'Schedule';

  // Column weights for layout
  const weights = {
    num:       0.10,
    name:      0.40,
    client:    0.16,
    phase:     0.12,
    mgr:       0.10,
    assignees: 0.16,
    status:    0.10,
    due:       0.10,
  };
  const headers = {
    num:       '#',
    name:      'Project / Milestone',
    client:    'Client',
    phase:     'Phase',
    mgr:       'Mgr',
    assignees: 'Assignees',
    status:    'Status',
    due:       'Due',
  };
  const infoCols = cols.filter(c => c !== 'bar');
  const infoFrac = 1 - barWidth;
  let totalWeight = 0;
  for (const c of infoCols) totalWeight += (weights[c] || 0.12);
  const colWidthMap = {};
  for (const c of infoCols) {
    colWidthMap[c] = ((weights[c] || 0.12) / totalWeight) * infoFrac * 100;
  }
  const barWidthPct = barWidth * 100;

  // Project + milestone row helpers
  const renderProjectRow = (p, milestones) => {
    const mgr = getEngineer(p.managerId);
    const projBarHtml = milestones.map(m => {
      if (!m.dueDate) return '';
      const d = parseDate(m.dueDate);
      if (!d) return '';
      const left = (daysBetween(minDate, d) / totalDays) * 100;
      return `<div class="ms-dot" style="left:${left}%;" title="${escapeHtml(m.name)}"></div>`;
    }).join('');
    const cellFor = (col) => {
      if (!cols.includes(col)) return '';
      let v = '';
      switch (col) {
        case 'num':       v = p.number || ''; break;
        case 'name':      v = p.name; break;
        case 'client':    v = p.client || ''; break;
        case 'phase':     v = ''; break;
        case 'mgr':       v = mgr ? abbreviateName(mgr.name) : ''; break;
        case 'assignees': v = ''; break;
        case 'status':    {
          const st = STATE.data.statuses.find(s => s.id === p.statusId);
          v = st ? st.name : ''; break;
        }
        case 'due':       v = ''; break;
      }
      return `<td class="c-${col}">${escapeHtml(v)}</td>`;
    };
    return `<tr class="proj-row">
      ${cols.map(c => cellFor(c)).join('')}
      <td class="c-bar"><div class="bar-track">${gridLinesHtml}${projBarHtml}</div></td>
    </tr>`;
  };

  const renderMilestoneRow = (p, m) => {
    const cat = STATE.data.categories.find(c => c.id === m.categoryId);
    const status = STATE.data.statuses.find(s => s.id === m.statusId);
    const mgr = getEngineer(p.managerId);
    const assigneeNames = (m.assigneeIds || []).map(id => {
      const e = getEngineer(id); return e ? abbreviateName(e.name) : '';
    }).filter(Boolean).join(', ');
    const d = m.dueDate ? parseDate(m.dueDate) : null;
    const left = d ? (daysBetween(minDate, d) / totalDays) * 100 : 0;
    const cellFor = (col) => {
      if (!cols.includes(col)) return '';
      let v = '';
      switch (col) {
        case 'num':       v = ''; break;
        case 'name':      return `<td class="c-name ms-cell">  ◆ ${escapeHtml(m.name)}</td>`;
        case 'client':    v = ''; break;
        case 'phase':     v = cat ? cat.name : ''; break;
        case 'mgr':       v = ''; break;
        case 'assignees': v = assigneeNames; break;
        case 'status':    v = status ? status.name : ''; break;
        case 'due':       v = m.dueDate || ''; break;
      }
      return `<td class="c-${col}">${escapeHtml(v)}</td>`;
    };
    return `<tr class="ms-row">
      ${cols.map(c => cellFor(c)).join('')}
      <td class="c-bar"><div class="bar-track">${gridLinesHtml}${
        d ? `<div class="ms-mark" style="left:${left}%;"><span class="d"></span><span class="t">${escapeHtml(m.dueDate)}${status ? ' · ' + escapeHtml(status.name) : ''}</span></div>` : ''
      }</div></td>
    </tr>`;
  };

  // (rowsHtml is built below, after gridLinesHtml is computed —
  // renderProjectRow / renderMilestoneRow reference it.)

  // Month markers + day-tick grid for the timeline header. Density of day
  // labels adapts to total span so the labels don't overlap:
  //   span ≤ 90 days  → label every 7 days (week markers: 1, 8, 15, 22…)
  //   span ≤ 180 days → every 14 days
  //   span ≤ 365 days → every month start only (no day labels)
  //   else            → only month labels
  let cur = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  const monthMarkers = [];
  while (cur <= maxDate) {
    const offset = daysBetween(minDate, cur);
    if (offset >= 0) {
      const left = (offset / totalDays) * 100;
      monthMarkers.push(`<div class="month-marker" style="left:${left}%;">${cur.toLocaleString('default', { month: 'short' })} ${String(cur.getFullYear()).slice(2)}</div>`);
    }
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }

  // Day-tick step (in days) — denser when the span is short
  const dayStep = totalDays <= 90 ? 7 : totalDays <= 180 ? 14 : totalDays <= 365 ? 0 : 0;
  const dayTicks = [];
  if (dayStep > 0) {
    // Anchor on the 1st of each month, then step within
    let walker = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    while (walker <= maxDate) {
      // Mark every dayStep within this month
      for (let dom = 1; dom <= 31; dom += dayStep) {
        const d = new Date(walker.getFullYear(), walker.getMonth(), dom);
        if (d.getMonth() !== walker.getMonth()) break; // overflowed to next month
        if (d < minDate || d > maxDate) continue;
        const left = (daysBetween(minDate, d) / totalDays) * 100;
        const isMonthStart = dom === 1;
        dayTicks.push(`<div class="day-tick ${isMonthStart ? 'first' : ''}" style="left:${left}%;">${dom}</div>`);
      }
      walker = new Date(walker.getFullYear(), walker.getMonth() + 1, 1);
    }
  }
  // Vertical grid lines at every week (or step) inside the bar tracks
  const gridLines = [];
  if (dayStep > 0) {
    let walker = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    while (walker <= maxDate) {
      for (let dom = 1; dom <= 31; dom += dayStep) {
        const d = new Date(walker.getFullYear(), walker.getMonth(), dom);
        if (d.getMonth() !== walker.getMonth()) break;
        if (d < minDate || d > maxDate) continue;
        const left = (daysBetween(minDate, d) / totalDays) * 100;
        const isMonthStart = dom === 1;
        gridLines.push(`<div class="grid-line ${isMonthStart ? 'major' : ''}" style="left:${left}%;"></div>`);
      }
      walker = new Date(walker.getFullYear(), walker.getMonth() + 1, 1);
    }
  } else {
    // Fall back to month grid lines only
    let walker = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
    while (walker <= maxDate) {
      const offset = daysBetween(minDate, walker);
      if (offset >= 0) {
        const left = (offset / totalDays) * 100;
        gridLines.push(`<div class="grid-line major" style="left:${left}%;"></div>`);
      }
      walker = new Date(walker.getFullYear(), walker.getMonth() + 1, 1);
    }
  }
  const gridLinesHtml = gridLines.join('');

  // Now that gridLinesHtml is defined, render the actual rows.
  const rowsHtml = visibleProjects.map(p => {
    const milestones = (p.milestones || []).filter(m => milestonePassesFilters(m));
    let r = renderProjectRow(p, milestones);
    if (incMilestoneRows) {
      r += milestones.map(m => renderMilestoneRow(p, m)).join('');
    }
    return r;
  }).join('');

  // Today's left position WITHIN the entire table (in %).
  const t = today();
  // The timeline column starts at (1 - barWidth) of the full table width
  // and spans barWidth of it. So:
  //   table-relative-left = (1 - barWidth)*100  +  todayPctInBar * barWidth
  // We compute this in pure CSS so the iframe doesn't need to be visible
  // (or even painted) for the position to be correct — fixes the print
  // case where the print iframe was sized 0×0 and JS measurements all
  // returned 0, snapping the line to left:0.
  const todayPctInBar = (incToday && t >= minDate && t <= maxDate)
    ? (daysBetween(minDate, t) / totalDays) * 100
    : null;
  const todayPctInTable = (todayPctInBar !== null)
    ? ((1 - barWidth) * 100) + (todayPctInBar / 100) * barWidth * 100
    : null;

  // Compute font sizes from scale. With scale = 0.85 these are around
  // 6.5pt body / 5.5pt small — small enough to fit a busy schedule on
  // one Letter sheet but still legible.
  const baseFont   = (8.5 * scale).toFixed(2);
  const headerFont = (7.0 * scale).toFixed(2);
  const projFont   = (8.5 * scale).toFixed(2);
  const msFont     = (7.5 * scale).toFixed(2);
  const tinyFont   = (6.0 * scale).toFixed(2);
  const rowPad     = (2.2 * scale).toFixed(2);
  const rowHeight  = (16.0 * scale).toFixed(2);

  return `<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>VCA Schedule — Print</title>
<style>
  @page { size: ${paper} ${orient}; margin: 0.35in; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  html, body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #1a1410; background: white; }
  body { padding: 0; ${previewZoom ? `zoom: ${previewZoom};` : ''} }
  /* When actually printing, undo any preview zoom so output is full-size. */
  @media print {
    body { zoom: 1 !important; }
  }
  .header {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1.5px solid #1a1410; padding-bottom: ${(3*scale).toFixed(2)}pt;
    margin-bottom: ${(5*scale).toFixed(2)}pt;
  }
  .header h1 { font-size: ${(13*scale).toFixed(2)}pt; font-weight: 700; }
  .header .meta { font-size: ${(8*scale).toFixed(2)}pt; color: #666; }

  .table-wrap { position: relative; }

  /* Today line — pure CSS positioning. Sits absolutely inside .table-wrap
     (which is the table's container), spanning from top of the header all
     the way down to the bottom of the last row. Its left is computed as
     a percentage of the table-wrap's width — independent of any DOM
     measurement, so it works correctly inside hidden print iframes. */
  .today-line {
    position: absolute; top: 0; bottom: 0; width: 1pt;
    background: #c44; z-index: 10; pointer-events: none;
  }
  .today-line::before {
    content: 'Today'; position: absolute; top: 0; left: ${(2*scale).toFixed(2)}pt;
    font-size: ${tinyFont}pt; color: #c44; background: white;
    padding: 0 ${(1.2*scale).toFixed(2)}pt; font-weight: 600;
    white-space: nowrap;
  }

  table { width: 100%; border-collapse: collapse; font-size: ${baseFont}pt; table-layout: fixed; }
  thead th {
    background: #f0e8dc; padding: ${rowPad}pt ${(parseFloat(rowPad)+1).toFixed(2)}pt;
    text-align: left; border-bottom: 1px solid #999;
    font-weight: 600; font-size: ${headerFont}pt;
    text-transform: uppercase; letter-spacing: 0.3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  td { padding: ${rowPad}pt ${(parseFloat(rowPad)+1).toFixed(2)}pt;
       border-bottom: 1px solid #e8dfcc; vertical-align: middle;
       overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-row td { font-weight: 600; background: #faf6ef; font-size: ${projFont}pt; }
  .ms-row td { font-size: ${msFont}pt; color: #444; }
  .ms-row .ms-cell { padding-left: ${(8*scale).toFixed(2)}pt; }
  .c-num { color: #888; font-variant-numeric: tabular-nums; }
  .c-client, .c-phase, .c-mgr, .c-assignees, .c-status { color: #555; }
  .c-due { color: #555; font-variant-numeric: tabular-nums; font-size: ${tinyFont}pt; }
  .c-bar { padding: 0 !important; position: relative; }
  .bar-track { position: relative; height: ${rowHeight}pt; background: #faf6ef; }
  .proj-row .bar-track { background: #ede3d2; }
  .ms-dot {
    position: absolute; top: ${(parseFloat(rowHeight)*0.27).toFixed(2)}pt;
    width: ${(parseFloat(rowHeight)*0.4).toFixed(2)}pt;
    height: ${(parseFloat(rowHeight)*0.4).toFixed(2)}pt;
    background: #a8554a; transform: translateX(-50%) rotate(45deg);
  }
  /* Milestone marker on a milestone row: the diamond sits exactly at the
     due date (left:X%), and the date/status label sits immediately to the
     right of the diamond. We use two separately-positioned elements so the
     diamond's center stays anchored to the actual date — the label simply
     starts at the diamond's right edge and reads outward. */
  .ms-mark {
    position: absolute; top: 0; bottom: 0; pointer-events: none;
  }
  .ms-mark .d {
    position: absolute; top: ${(parseFloat(rowHeight)*0.27).toFixed(2)}pt;
    width: ${(parseFloat(rowHeight)*0.42).toFixed(2)}pt;
    height: ${(parseFloat(rowHeight)*0.42).toFixed(2)}pt;
    background: #a8554a; transform: translateX(-50%) rotate(45deg);
  }
  .ms-mark .t {
    position: absolute;
    left: ${(parseFloat(rowHeight)*0.32).toFixed(2)}pt;  /* sit just right of the diamond */
    top: ${(parseFloat(rowHeight)*0.18).toFixed(2)}pt;
    background: rgba(255,255,255,0.92);
    padding: 0 ${(1.2*scale).toFixed(2)}pt;
    font-size: ${msFont}pt; color: #444;
    white-space: nowrap;
  }

  /* Month bar — sits in the timeline column header. Two-row: month names
     on top, day numbers (every 7 or 14 days depending on span) on bottom. */
  .month-bar {
    position: relative;
    height: ${(parseFloat(rowHeight)*1.2).toFixed(2)}pt;
    background: #ede3d2; font-size: ${tinyFont}pt;
    margin: -${rowPad}pt -${(parseFloat(rowPad)+1).toFixed(2)}pt;
  }
  .month-row {
    position: absolute; top: 0; left: 0; right: 0;
    height: ${(parseFloat(rowHeight)*0.55).toFixed(2)}pt;
    border-bottom: 0.5px solid #c8b89a;
  }
  .day-row {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: ${(parseFloat(rowHeight)*0.55).toFixed(2)}pt;
    background: #f5ebd8;
  }
  .month-marker {
    position: absolute; top: 0; bottom: 0; border-left: 1px solid #999;
    padding: ${(1.2*scale).toFixed(2)}pt ${(1.5*scale).toFixed(2)}pt 0 ${(1.5*scale).toFixed(2)}pt;
    color: #222; white-space: nowrap; font-weight: 600;
  }
  .day-tick {
    position: absolute; top: 0; bottom: 0; border-left: 0.5px solid #c8b89a;
    padding: ${(1*scale).toFixed(2)}pt ${(1*scale).toFixed(2)}pt 0 ${(1.2*scale).toFixed(2)}pt;

// Old runPrint / applyPrintStyling — kept for the auto-print mode
// (init() picks up ?print=1 query). The main Print button now uses
// doPrintViaIframe instead.
function runPrint(paper, orient, scope) {
  applyPrintStyling(paper, orient, scope);
  setTimeout(() => {
    try { window.print(); } catch (e) { console.error(e); }
    setTimeout(() => {
      document.body.classList.remove('printing');
      const s = document.getElementById('dynamicPrintStyle');
      if (s) s.remove();
    }, 800);
  }, 100);
}

// Apply print-mode CSS overrides. Extracted from runPrint() so the new
// pop-up print window can call it on its own load too.
function applyPrintStyling(paper, orient, scope) {
  const sizeMap = {
    letter: '8.5in 11in',
    tabloid: '11in 17in',
  };
  const dim = sizeMap[paper] || sizeMap.letter;
  const styleEl = document.createElement('style');
  styleEl.id = 'dynamicPrintStyle';
  styleEl.textContent = `
    @page { size: ${dim} ${orient}; margin: 0.5in; }
    body.printing .topbar, body.printing .filter-bar, body.printing .toolbar,
    body.printing .detail-panel, body.printing #modalRoot, body.printing #toastRoot,
    body.printing #tooltipRoot, body.printing .row-add-btn, body.printing .row-delete-btn,
    body.printing .rename-edit-icon, body.printing .col-resize-handle,
    body.printing .side-resize-handle, body.printing .deadline-jumper,
    body.printing .scroll-month-indicator { display: none !important; }
    body.printing { background: white !important; color: black !important; }
    body.printing .gantt-side-header,
    body.printing .gantt-side-body,
    body.printing .gantt-grid-wrap,
    body.printing .gantt-timeline-header-wrap,
    body.printing .gantt-body { overflow: visible !important; }
    body.printing .row-side, body.printing .row-grid { background: white !important; color: black !important; }
    body.printing .name-text, body.printing .due-text, body.printing .status-text,
    body.printing .cat-text { color: black !important; }
    body.printing .major-cell, body.printing .minor-cell {
      background: white !important; color: black !important;
      border-color: #999 !important;
    }
    body.printing .major-cell.current-month { background: #fff7e0 !important; }
    body.printing .minor-cell.today { background: #fff7e0 !important; }
    body.printing .bar { border: 1px solid #333 !important; }
    body.printing .main, body.printing .gantt-body, body.printing #ganttView,
    body.printing .gantt-side-body, body.printing .gantt-grid-wrap {
      height: auto !important; max-height: none !important;
    }
    body.printing .project-end-label { color: black !important; text-shadow: none !important; }
    body.printing .proj-tag-num { background: #d4a574 !important; color: black !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  `;
  document.head.appendChild(styleEl);
  document.body.classList.add('printing');
}

    });

        const swatch = input.closest('.engineer-row')?.querySelector('.color-swatch');

          swatch.style.boxShadow = '0 0 0 2px var(--accent)';

        const reset = input.closest('.engineer-row')?.querySelector('[data-color-override-reset]');
        if (reset) reset.disabled = false;
      });
      // 'change' fires when the picker is closed — at that point also re-render
      // the rest of the app so dots/badges/charts update with the new color.
      input.addEventListener('change', () => {
        renderAll();
      });
    });
    $$('button[data-color-override-reset]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const engId = btn.dataset.colorOverrideReset;
        clearEngineerColorOverride(engId);
        const eng = getEngineer(engId);
        const row = btn.closest('.engineer-row');
        const swatch = row?.querySelector('.color-swatch');
        const picker = row?.querySelector('input[type="color"]');
        if (swatch && eng) { swatch.style.background = eng.color; swatch.style.boxShadow = 'none'; }
        if (picker && eng) { picker.value = eng.color; }
        btn.disabled = true;
        renderAll();
      });
    });

    // Deadline color pickers + preset buttons
    const deadlineBg = $('#deadlineBgInput');
    const deadlineFg = $('#deadlineFgInput');
    const previewSwatch = $('#deadlinePreviewSwatch');
    const updatePreview = () => {
      if (previewSwatch) {
        previewSwatch.style.background = deadlineBg.value;
        previewSwatch.style.color = deadlineFg.value;
      }
    };
    if (deadlineBg && deadlineFg) {
      deadlineBg.addEventListener('input', () => {
        saveDeadlineColor(deadlineBg.value, null);
        updatePreview();
      });
      deadlineFg.addEventListener('input', () => {
        saveDeadlineColor(null, deadlineFg.value);
        updatePreview();
      });
      // change fires when picker closes — re-render calendar at that point
      deadlineBg.addEventListener('change', () => renderAll());
      deadlineFg.addEventListener('change', () => renderAll());
    }
    $$('.deadline-preset').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const bg = btn.dataset.bg;
        const fg = btn.dataset.fg;
        saveDeadlineColor(bg, fg);
        if (deadlineBg) deadlineBg.value = bg;
        if (deadlineFg) deadlineFg.value = fg;
        updatePreview();
        renderAll();
      });
    });
  }, 0);
}

  clearAllColorOverrides();

  toast('Reset to shared colors', 'success');

function saveSettings() {
  $$('#engsList input, #engsList select').forEach(el => {
    const id = el.dataset.engId;
    const field = el.dataset.field;
    if (!id || !field) return;
    const e = getEngineer(id);
    if (e) e[field] = el.value;
  });
  $$('#statusesList input').forEach(el => {
    const id = el.dataset.statusId;
    const field = el.dataset.field;
    if (!id || !field) return;
    const s = STATE.data.statuses.find(x => x.id === id);
    if (s) {
      if (el.type === 'checkbox') s[field] = el.checked;
      else s[field] = el.value;
    }
  });
  $$('#catsList input').forEach(el => {
    const id = el.dataset.catId;
    const field = el.dataset.field;
    if (!id || !field) return;
    const c = STATE.data.categories.find(x => x.id === id);
    if (c) c[field] = el.value;
  });

  // Column visibility & widths
  $$('#columnSettingsList input').forEach(el => {
    const key = el.dataset.colKey;
    const field = el.dataset.colField;
    if (!key || !field) return;
    const col = STATE.columnSettings[key];
    if (!col) return;
    if (field === 'visible') {
      if (col.required && !el.checked) { el.checked = true; return; }
      col.visible = el.checked;
    } else if (field === 'width') {
      const v = Math.max(60, Math.min(500, parseInt(el.value) || 100));
      col.width = v;
    }
  });

  // Workload threshold
  const thrEl = $('#settingsThreshold');
  if (thrEl) {
    STATE.workloadThreshold = Math.max(1, Math.min(20, parseInt(thrEl.value) || 3));
  }

  // Auto-complete behavior toggle (per-user preference)
  const autoCompEl = $('#autoCompleteProjectToggle');
  if (autoCompEl) {
    const wasOn = STATE.autoCompleteProject;
    STATE.autoCompleteProject = !!autoCompEl.checked;
    // If the user just turned the setting ON, sweep every existing
    // project right now — projects whose milestones are already all
    // complete should reflect that immediately rather than waiting for
    // someone to make a future edit.
    if (!wasOn && STATE.autoCompleteProject) {
      sweepAutoCompleteAll();
    }
  }

  STATE.data.currentUserId = $('#currentUserSelect').value || null;
  saveData();
  saveLocal();
  scheduleUserPrefsSync();
  closeModal();
  renderAll();
  toast('Settings saved', 'success');
}

function parseCsvLine(line) {
  const result = [];
  let cur = '';
  let inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQuotes) {
      if (c === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else cur += c;
    } else {
      if (c === ',') { result.push(cur); cur = ''; }
      else if (c === '"') inQuotes = true;
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}

function processCsvImport() {
  const text = $('#csvInput').value.trim();
  if (!text) { toast('Empty CSV', 'error'); return; }
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) { toast('Need at least header + 1 row', 'error'); return; }
  const header = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const idxNum = header.indexOf('projectnumber');
  const idxProj = header.indexOf('project');
  const idxMile = header.indexOf('milestone');
  const idxCat = header.indexOf('category');
  const idxDue = header.indexOf('duedate');
  const idxAssign = header.indexOf('assignees');
  const idxStatus = header.indexOf('status');
  const idxMgr = header.indexOf('manager');
  if (idxProj < 0 || idxMile < 0) {
    toast('Header must include Project, Milestone', 'error');
    return;
  }
  let added = 0;
  let warnings = [];
  for (let i = 1; i < lines.length; i++) {
    const cells = parseCsvLine(lines[i]);
    const projNum = idxNum >= 0 ? (cells[idxNum] || '').trim() : '';
    const projName = (cells[idxProj] || '').trim();
    const mileName = (cells[idxMile] || '').trim();
    const catName = idxCat >= 0 ? (cells[idxCat] || '').trim() : '';
    const dueDate = idxDue >= 0 ? (cells[idxDue] || '').trim() : '';
    const assigneeNames = idxAssign >= 0 ? (cells[idxAssign] || '').split(';').map(s => s.trim()).filter(Boolean) : [];
    const statusName = idxStatus >= 0 ? (cells[idxStatus] || '').trim() : '';
    const mgrName = idxMgr >= 0 ? (cells[idxMgr] || '').trim() : '';
    if (!projName || !mileName) continue;

    let p = STATE.data.projects.find(x => x.name === projName || (projNum && x.number === projNum));
    if (!p) {
      const mgr = mgrName ? STATE.data.engineers.find(e => e.name.toLowerCase() === mgrName.toLowerCase()) : null;
      p = {
        id: uid('p'), number: projNum, name: projName, client: '',
        managerId: mgr ? mgr.id : '',
        statusId: 'st_inprogress', expanded: true, milestones: [],
        createdAt: new Date().toISOString(),
        createdBy: STATE.data.currentUserId || null,
        history: [{ id: uid('h'), timestamp: new Date().toISOString(), action: 'Project created via CSV import', by: null }],
      };
      STATE.data.projects.push(p);
      if (mgrName && !mgr) warnings.push(`Unknown manager: "${mgrName}"`);
    } else if (projNum && !p.number) {
      p.number = projNum;
    }
    let categoryId = '';
    if (catName) {
      const cat = STATE.data.categories.find(c => c.name.toLowerCase() === catName.toLowerCase());
      if (cat) categoryId = cat.id;
      else warnings.push(`Unknown category: "${catName}"`);
    }
    const assigneeIds = [];
    for (const an of assigneeNames) {
      const eng = STATE.data.engineers.find(e => e.name.toLowerCase() === an.toLowerCase());
      if (eng) assigneeIds.push(eng.id);
      else warnings.push(`Unknown engineer: "${an}"`);
    }
    let statusId = 'st_notstarted';
    if (statusName) {
      const st = STATE.data.statuses.find(s => s.name.toLowerCase() === statusName.toLowerCase());
      if (st) statusId = st.id;
    }
    p.milestones.push({
      id: uid('m'), name: mileName, categoryId, statusId, dueDate, assigneeIds, tasks: [], notes: '', visibility: 'shared', createdBy: STATE.data.currentUserId || '',
    });
    added++;
  }

  saveData();
  closeModal();
  renderAll();
  toast(`Imported ${added} milestones${warnings.length ? `. ${warnings.length} warning(s)` : ''}`, 'success');
  if (warnings.length) console.warn('CSV warnings:', warnings);
}

function escapeIcs(s) {
  return String(s ?? '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
}
function icsDate(s) { return String(s).replace(/-/g, ''); }
function icsDateNext(s) {
  const d = parseDate(s);
  return fmtDate(addDays(d, 1)).replace(/-/g, '');
}
function icsTimestamp(d) {
  const pad = n => String(n).padStart(2, '0');
  return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate())
    + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
}

}

// Build a filtered .ics file using the SAME logic the Cloud Function uses
// (shared visibility, non-CA category, dueDate present). Lets a user
// preview locally exactly what the conference inbox will receive — useful
// before the cloud function is deployed, or for spot-checking.
function downloadFilteredIcs() {
  const icsTimestamp = (d) => {
    const pad = n => String(n).padStart(2, '0');
    return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate())
      + 'T' + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  };
  const icsDate = (s) => String(s).replace(/-/g, '');
  const icsDateNext = (s) => {
    const d = new Date(s + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + 1);
    return icsDate(d.toISOString().slice(0, 10));
  };
  const isCa = (cat) => !!(cat && cat.name && /^\s*CA\b/i.test(cat.name));

  const now = icsTimestamp(new Date());
  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//VCA Schedule//Shared Deadlines//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'X-WR-CALNAME:VCA Shared Milestones',
    'X-WR-CALDESC:Shared milestone deadlines from VCA Schedule (CA milestones excluded)',
    'REFRESH-INTERVAL;VALUE=DURATION:PT1H',
  ];
  let n = 0;
  for (const p of STATE.data.projects) {
    const mgr = getEngineer(p.managerId);
    for (const m of (p.milestones || [])) {
      if (!m.dueDate) continue;
      if ((m.visibility || 'shared') !== 'shared') continue;
      const cat = getCategory(m.categoryId);
      if (isCa(cat)) continue;
      const status = getStatus(m.statusId);
      const assigneeNames = (m.assigneeIds || [])
        .map(id => getEngineer(id))
        .filter(Boolean).map(e => e.name).join(', ');
      const projNum = p.number ? `[${p.number}] ` : '';
      const summary = `${projNum}${p.name} — ${m.name}`;
      const desc = [
        `Project: ${p.name}`,
        p.number ? `Project Number: ${p.number}` : null,
        p.client ? `Client: ${p.client}` : null,
        mgr ? `Project Manager: ${mgr.name}` : null,
        cat ? `Category: ${cat.name}` : null,
        status ? `Status: ${status.name}` : null,
        assigneeNames ? `Assignees: ${assigneeNames}` : null,
        m.notes ? `\nNotes: ${m.notes}` : null,
      ].filter(Boolean).join('\n');
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:milestone-${m.id}@vca-schedule`);
      lines.push(`DTSTAMP:${now}`);
      lines.push(`DTSTART;VALUE=DATE:${icsDate(m.dueDate)}`);
      lines.push(`DTEND;VALUE=DATE:${icsDateNext(m.dueDate)}`);
      lines.push(`SUMMARY:${escapeIcs(summary)}`);
      lines.push(`DESCRIPTION:${escapeIcs(desc)}`);
      lines.push(`CATEGORIES:Milestone,${escapeIcs(p.name)}`);
      lines.push('TRANSP:TRANSPARENT');
      lines.push('END:VEVENT');
      n++;
    }
  }
  lines.push('END:VCALENDAR');
  const ics = lines.join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vca-shared-milestones-${todayStr()}.ics`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`Generated ${n} events. Same filter as the cloud feed.`, 'success');
}

function generateIcs() {
  const engId = $('#icsEng').value;
  const incMs = $('#icsIncMilestones').checked;
  const incT = $('#icsIncTasks').checked;
  const eng = engId ? getEngineer(engId) : null;

  const lines = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//VCA Schedule//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    `X-WR-CALNAME:${eng ? eng.name + ' — VCA Schedule' : 'VCA Schedule — All Milestones'}`,
  ];
  const now = icsTimestamp(new Date());

  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      // PRIVACY: only milestones marked 'shared' (or with no visibility set)
      // are exported to calendar / Outlook. Engineers-only and private
      // milestones stay inside the app.
      if ((m.visibility || 'shared') !== 'shared') continue;

      const cat = getCategory(m.categoryId);
      const catLabel = cat ? `[${cat.name}] ` : '';
      if (incMs && m.dueDate) {
        const include = !engId || (m.assigneeIds || []).includes(engId);
        if (include) {
          const assignNames = (m.assigneeIds || []).map(id => { const e = getEngineer(id); return e ? e.name : ''; }).filter(Boolean).join(', ');
          const desc = `Project: ${p.name}\n${cat ? 'Category: ' + cat.name + '\n' : ''}Status: ${getStatus(m.statusId).name}${assignNames ? '\nAssignees: '+assignNames : ''}${m.notes ? '\n\nNotes: '+m.notes : ''}`;
          lines.push('BEGIN:VEVENT');
          lines.push(`UID:milestone-${m.id}@studio-schedule`);
          lines.push(`DTSTAMP:${now}`);
          lines.push(`DTSTART;VALUE=DATE:${icsDate(m.dueDate)}`);
          lines.push(`DTEND;VALUE=DATE:${icsDateNext(m.dueDate)}`);
          lines.push(`SUMMARY:${escapeIcs(`◆ ${p.name} — ${catLabel}${m.name}`)}`);
          lines.push(`DESCRIPTION:${escapeIcs(desc)}`);
          lines.push(`CATEGORIES:Milestone,${escapeIcs(p.name)}`);
          lines.push('END:VEVENT');
        }
      }
      if (incT) {
        for (const t of (m.tasks || [])) {
          if (!t.start || !t.end) continue;
          if (engId && t.assigneeId !== engId) continue;
          const tEng = getEngineer(t.assigneeId);
          const taskLabel = t.name || (tEng ? tEng.name : 'Task');
          const desc = `Project: ${p.name}\n${cat ? 'Category: ' + cat.name + '\n' : ''}Milestone: ${m.name}\nTask: ${taskLabel}${tEng ? '\nWork by: '+tEng.name : ''}`;
          lines.push('BEGIN:VEVENT');
          lines.push(`UID:task-${t.id}@studio-schedule`);
          lines.push(`DTSTAMP:${now}`);
          lines.push(`DTSTART;VALUE=DATE:${icsDate(t.start)}`);
          lines.push(`DTEND;VALUE=DATE:${icsDateNext(t.end)}`);
          lines.push(`SUMMARY:${escapeIcs(`${p.name} — ${catLabel}${m.name} · ${taskLabel}`)}`);
          lines.push(`DESCRIPTION:${escapeIcs(desc)}`);
          lines.push(`CATEGORIES:Task,${escapeIcs(p.name)}`);
          lines.push('END:VEVENT');
        }
      }
    }
  }

  lines.push('END:VCALENDAR');
  const ics = lines.join('\r\n');
  const blob = new Blob([ics], { type: 'text/calendar' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${eng ? eng.name.replace(/\s+/g,'_') : 'studio'}-schedule-${todayStr()}.ics`;
  a.click();
  URL.revokeObjectURL(url);
  closeModal();
  toast('Calendar file downloaded', 'success');
}

function fitToScreen() {
  const { min, max } = getOverallDateRange();
  const days = daysBetween(min, max) + 1;
  const grid = $('#ganttGridScroll');
  const availWidth = grid ? grid.clientWidth : 1000;
  const candidates = [['day', 40], ['week', 20], ['month', 8], ['quarter', 3]];
  let chosen = 'quarter';
  for (const [name, ppd] of candidates) {
    if (days * ppd <= availWidth) { chosen = name; break; }
  }
  STATE.zoomLevel = chosen;
  $$('#zoomToggle .zoom-btn').forEach(b => b.classList.toggle('active', b.dataset.zoom === chosen));
  renderGantt();
}

// Default initial scroll: today at ~1/3 from the left of the visible area.
function scrollTodayDefault() {
  const grid = $('#ganttGridScroll');
  if (!grid) return;
  const { min } = getOverallDateRange();
  const offset = daysBetween(min, today()) * pixelsPerDay();
  const visW = grid.clientWidth || 800;
  grid.scrollLeft = Math.max(0, offset - visW / 3);
}

// "Today" button: pin today to the very left edge.
function scrollTodayToLeft() {
  const grid = $('#ganttGridScroll');
  if (!grid) return;
  const { min } = getOverallDateRange();
  const offset = daysBetween(min, today()) * pixelsPerDay();
  grid.scrollLeft = Math.max(0, offset - 8);
}

  // Filter separator: click to collapse Quick group, drag to swap group order.
  const sep = $('#filterSeparator');

    let dragMoved = false;

      dragStartX = e.clientX;
      dragMoved = false;
      const onMove = (ev) => {
        if (Math.abs(ev.clientX - dragStartX) > 12) dragMoved = true;
      };
      const onUp = (ev) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (dragMoved) {
          // Swap group order
          STATE.filterBarLayout.quickFirst = !STATE.filterBarLayout.quickFirst;
          saveData();
          applyFilterBarLayout();
        } else {
          // Click: toggle collapse of quick group
          STATE.filterBarLayout.quickCollapsed = !STATE.filterBarLayout.quickCollapsed;
          saveData();
          applyFilterBarLayout();
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  // Search
  let searchTimeout;
  $('#searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => performSearch(e.target.value), 200);
  });
  $('#searchInput').addEventListener('focus', (e) => {
    if (e.target.value) performSearch(e.target.value);
  });
  // Close search on outside click
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-box')) {
      $('#searchResults').classList.remove('show');
    }
  });
  // Keyboard: Cmd/Ctrl + K to focus search; Cmd/Ctrl + N for Quick Add
  document.addEventListener('keydown', (e) => {
    // Esc: close any open modal (popups have their own Esc handlers).
    if (e.key === 'Escape') {
      const root = $('#modalRoot');
      if (root && root.children.length > 0) {
        e.preventDefault();
        closeModal();
        return;
      }
    }
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
      e.preventDefault();
      $('#searchInput').focus();
      $('#searchInput').select();
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'n' || e.key === 'N')) {
      // Don't override when user is typing in an input
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      openQuickAddMilestone();
    }
    // Cmd/Ctrl+P opens our print preview modal (replaces the browser's
    // default print dialog, which would try to print the entire app UI).
    if ((e.metaKey || e.ctrlKey) && (e.key === 'p' || e.key === 'P')) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      openPrintDialog();
    }
    // Cmd/Ctrl+Z = undo, Cmd/Ctrl+Y or Cmd/Ctrl+Shift+Z = redo. Skipped
    // while user is in an input — there native undo handles the text edit.
    if ((e.metaKey || e.ctrlKey) && (e.key === 'z' || e.key === 'Z')) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      if (e.shiftKey) performRedo();
      else performUndo();
    }
    if ((e.metaKey || e.ctrlKey) && (e.key === 'y' || e.key === 'Y')) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      performRedo();
    }
    // Cmd/Ctrl+C: copy currently selected item (project/milestone/task).
    // For parents with children, asks whether to include them.
    if ((e.metaKey || e.ctrlKey) && (e.key === 'c' || e.key === 'C') && !e.shiftKey) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const sel = STATE.selectedItem;
      if (!sel) return;
      // Don't override browser copy if the user has text selected.
      const textSel = window.getSelection && window.getSelection().toString();
      if (textSel && textSel.length > 0) return;
      e.preventDefault();
      if (sel.type === 'project') {
        const p = getProject(sel.projectId);
        if (p) copyWithPrompt('project', p).then(() => renderAll());
      } else if (sel.type === 'milestone') {
        const m = getMilestone(sel.projectId, sel.milestoneId);
        if (m) copyWithPrompt('milestone', m).then(() => renderAll());
      } else if (sel.type === 'task') {
        const m = getMilestone(sel.projectId, sel.milestoneId);
        const tk = m ? (m.tasks || []).find(x => x.id === sel.taskId) : null;
        if (tk) copyWithPrompt('task', tk).then(() => renderAll());
      }
    }
    // Cmd/Ctrl+V: paste from clipboard. Where it lands depends on what's
    // on the clipboard AND what's currently selected:
    //   project on clipboard       → new project at top of list
    //   milestone on clipboard +
    //       a project is selected  → milestone added to that project
    //   task on clipboard +
    //       a milestone is selected → task added to that milestone
    if ((e.metaKey || e.ctrlKey) && (e.key === 'v' || e.key === 'V')) {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (!STATE.clipboard) return;
      e.preventDefault();
      const sel = STATE.selectedItem;
      if (STATE.clipboard.type === 'project') {
        const newId = pasteProject();
        if (newId) { STATE.selectedItem = { type: 'project', projectId: newId }; renderAll(); }
      } else if (STATE.clipboard.type === 'milestone') {
        const projectId = sel?.projectId;
        if (!projectId) { toast('Select a project to paste this milestone into', 'info'); return; }
        const newId = pasteMilestoneInto(projectId);
        if (newId) { STATE.selectedItem = { type: 'milestone', projectId, milestoneId: newId }; renderAll(); }
      } else if (STATE.clipboard.type === 'task') {
        const projectId = sel?.projectId;
        const milestoneId = sel?.milestoneId;
        if (!projectId || !milestoneId) { toast('Select a milestone to paste this task into', 'info'); return; }
        const newId = pasteTaskInto(projectId, milestoneId);
        if (newId) { STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: newId }; renderAll(); }
      }
    }
    // F2: rename the currently selected row in the Gantt side panel.
    if (e.key === 'F2') {
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const sel = STATE.selectedItem;
      if (!sel) return;
      // Find the corresponding rename anchor
      let selector = '';
      if (sel.type === 'project') selector = `.row-side[data-type="project"][data-project-id="${sel.projectId}"] [data-rename="project"]`;
      else if (sel.type === 'milestone') selector = `[data-rename="milestone"][data-project-id="${sel.projectId}"][data-milestone-id="${sel.milestoneId}"]`;
      else if (sel.type === 'task') selector = `[data-rename="task"][data-project-id="${sel.projectId}"][data-milestone-id="${sel.milestoneId}"][data-task-id="${sel.taskId}"]`;
      const anchor = selector && document.querySelector(selector);
      if (anchor) {
        e.preventDefault();
        openRenameInline(anchor, anchor.dataset.projectId, anchor.dataset.milestoneId, anchor.dataset.taskId);
      }
    }
    if (e.key === 'Escape') {
      // Close popup if open
      if ($('#activePopup')) { closePopup(); return; }
      // Close modal if any
      if ($('#modalRoot').children.length > 0) { closeModal(); return; }
      $('#searchResults').classList.remove('show');
      if (document.activeElement === $('#searchInput')) {
        $('#searchInput').blur();
        $('#searchInput').value = '';
        STATE.searchQuery = '';
        renderAll();
      }
    }
  });

  window.addEventListener('beforeunload', (e) => {
    if (isDirty()) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  renderAll();
  // Align DOM (active tab class + display:none) with whatever STATE.view
  // was restored from localStorage. Without this the user's last view
  // would be rendered into a hidden container while Gantt stayed visible.
  applyViewToDom(STATE.view || 'gantt');
  // Initial: today at left
  setTimeout(scrollTodayDefault, 100);

  // Restore the right scroll position based on the active view (today for
  // Gantt/Calendar/Workload). Slight delay so the now-visible view has
  // measured itself correctly first.
  setTimeout(() => {
    if (STATE.view === 'gantt') scrollTodayDefault();
    else if (STATE.view === 'calendar') scrollCalendarToToday();
    else if (STATE.view === 'workload') scrollWorkloadToToday();
  }, 150);

  // Track focused inputs so incoming Firestore syncs don't blow away the
  // user's typing.
  attachActiveInputTracker();

  // If we don't know who's using this browser yet, ask. Once they pick, the
  // choice is stored in localStorage and persists for that browser/profile.
  if (!STATE.data.currentUserId) {
    setTimeout(promptForUserIdentity, 400);
  }

  // Auto-print mode: when launched with ?print=1, apply print styling and
  // open the browser print dialog. This is how the in-Teams "Print" button
  // works around the iframe's blocked window.print() — it pops a normal
  // browser window with this query, and the new window prints itself.
  const params = new URLSearchParams(window.location.search);
  if (params.get('print') === '1') {
    const paper  = params.get('paper')  || 'letter';
    const orient = params.get('orient') || 'landscape';
    const scope  = params.get('scope')  || 'current';
    setTimeout(() => {
      applyPrintStyling(paper, orient, scope);
      setTimeout(() => {
        try { window.print(); } catch (e) { /* ignore */ }
      }, 400);
    }, 600);
  }
}

// Modal asking "Who are you?" — shown the first time someone opens the app on
// a given browser (or after they explicitly clear it in Settings). The pick
// is saved to localStorage under CURRENT_USER_KEY so the same Chrome / Edge
// profile remembers it indefinitely.
function promptForUserIdentity() {
  // Don't prompt if a modal is already open
  if ($('#modalRoot').children.length > 0) return;
  const engineers = STATE.data.engineers || [];
  if (engineers.length === 0) return;

  const cards = engineers.map(e => `
    <button type="button" class="user-pick-card" data-uid="${e.id}">
      <span class="eng-dot" style="background:${getEngineerColor(e)}; width:14px; height:14px;"></span>
      <span style="flex:1; text-align:left;">
        <div style="font-weight:600;">${escapeHtml(e.name)}</div>
        <div style="font-size:10px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.3px;">${escapeHtml(e.role)}</div>
      </span>
    </button>
  `).join('');

  const html = `
    <div class="modal-content" style="max-width: 480px;">
      <h2 style="margin-bottom: 6px;">Who are you?</h2>
      <p style="color: var(--text-dim); font-size: 12px; margin-bottom: 16px;">
        This identifies you for created-by, "My Work", and ownership of private milestones.
        Your choice is remembered on this browser. You can change it anytime in <strong>⚙ Settings</strong>.
      </p>
      <div class="user-pick-grid">
        ${cards}
      </div>
      <div style="margin-top: 14px; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 11px; color: var(--text-faint);">Not in the list? Add yourself in Settings.</span>
        <button class="btn small" id="userPickSkip">Skip for now</button>
      </div>
    </div>
  `;
  showModal(html);

  document.querySelectorAll('.user-pick-card').forEach(btn => {
    btn.addEventListener('click', () => {
      const uid = btn.dataset.uid;
      STATE.data.currentUserId = uid;
      saveData();
      closeModal();
      const eng = getEngineer(uid);
      toast(`Signed in as ${eng?.name || 'unknown'}`, 'success');
      // Re-subscribe to my new identity's prefs so the page picks up my
      // saved colors / expand state from any other browser I've used.
      subscribeUserPrefs();
      renderAll();
    });
  });
  $('#userPickSkip').addEventListener('click', closeModal);
}

init();
</script>

</body>
</html>
