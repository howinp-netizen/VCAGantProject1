}

function getSortedProjects() {
  const list = STATE.data.projects.slice();
  const sort = STATE.projectSort || 'manual';

  // For 'soonest_due' we look at the earliest non-completed milestone due date.
  const earliestDueOf = (p) => {
    let earliest = null;
    for (const m of (p.milestones || [])) {
      if (!m.dueDate) continue;
      const st = getStatus(m.statusId);
      if (st && st.isCompleted) continue;
      if (!earliest || m.dueDate < earliest) earliest = m.dueDate;
    }
    return earliest;
  };

  // Use a stable sort by adding original index as a tiebreaker.
  list.forEach((p, i) => p.__origIdx = i);

  const cmp = (a, b) => {
    if (sort === 'manual') return a.__origIdx - b.__origIdx;
    if (sort === 'name') {
      return (a.name || '').localeCompare(b.name || '') || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'number') {
      // Treat empty number as "after" everything else
      const an = (a.number || '').trim();
      const bn = (b.number || '').trim();
      if (!an && !bn) return a.__origIdx - b.__origIdx;
      if (!an) return 1;
      if (!bn) return -1;
      return an.localeCompare(bn, undefined, { numeric: true, sensitivity: 'base' }) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'soonest_due') {
      const ad = earliestDueOf(a);
      const bd = earliestDueOf(b);
      if (!ad && !bd) return a.__origIdx - b.__origIdx;
      if (!ad) return 1;
      if (!bd) return -1;
      return ad.localeCompare(bd) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'manager') {
      const am = (getEngineer(a.managerId)?.name || '').toLowerCase();
      const bm = (getEngineer(b.managerId)?.name || '').toLowerCase();
      if (!am && !bm) return a.__origIdx - b.__origIdx;
      if (!am) return 1;
      if (!bm) return -1;
      return am.localeCompare(bm) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'client') {
      const ac = (a.client || '').toLowerCase();
      const bc = (b.client || '').toLowerCase();
      if (!ac && !bc) return a.__origIdx - b.__origIdx;
      if (!ac) return 1;
      if (!bc) return -1;
      return ac.localeCompare(bc) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'newest') {
      return (b.createdAt || '').localeCompare(a.createdAt || '') || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'oldest') {
      return (a.createdAt || '').localeCompare(b.createdAt || '') || (a.__origIdx - b.__origIdx);
    }
    return a.__origIdx - b.__origIdx;
  };

  list.sort(cmp);
  list.forEach(p => { delete p.__origIdx; });
  return list;
}

function buildGanttRows() {
  const rows = [];
  const projects = getSortedProjects();
  for (const p of projects) {
    if (!projectPassesFilters(p)) continue;
    rows.push({ type: 'project', project: p });
    if (p.expanded !== false) {
      for (const m of (p.milestones || [])) {
        if (!milestonePassesFilters(m)) continue;
        rows.push({ type: 'milestone', project: p, milestone: m });
        if (m.expanded) {
          for (const t of (m.tasks || [])) {
            rows.push({ type: 'task', project: p, milestone: m, task: t });
          }
        }
      }
    }
  }
  return rows;
}

function isSelectedRow(type, ids) {
  if (!STATE.selectedItem) return false;
  if (STATE.selectedItem.type !== type) return false;
  if (STATE.selectedItem.projectId !== ids.projectId) return false;
  if (type === 'project') return true;
  if (STATE.selectedItem.milestoneId !== ids.milestoneId) return false;
  if (type === 'milestone') return true;
  return STATE.selectedItem.taskId === ids.taskId;
}

function renderGanttSideRow(row) {
  const cs = STATE.columnSettings;
  const wrap = (key, content, classes = '') => {
    const c = cs[key];
    if (!c || !c.visible) return '';
    return `<div class="side-col-${key} ${classes}" style="width:${c.width}px;">${content}</div>`;
  };

  if (row.type === 'project') {
    const p = row.project;
    const expandIcon = (p.expanded !== false) ? '▾' : '▸';
    const status = getStatus(p.statusId);
    const mgr = getEngineer(p.managerId);
    const sel = isSelectedRow('project', { projectId: p.id }) ? 'selected' : '';

    const numLabel = p.number ? `<span style="color:var(--accent); font-size:10px; margin-right:6px; font-weight:600;">${escapeHtml(p.number)}</span>` : '';
    const mgrCell = mgr
      ? `<span class="mgr-text" style="color:${mgr.color}"><span class="eng-dot" style="background:${mgr.color}"></span>${escapeHtml(mgr.name)}</span>`
      : `<span class="editable-empty">— None —</span>`;

    const allAssignIds = [...new Set((p.milestones || []).flatMap(m => m.assigneeIds || []))];
    const assignDots = allAssignIds.slice(0, 5).map(id => {
      const e = getEngineer(id);
      return e ? `<span class="eng-dot" style="background:${e.color}" title="${escapeHtml(e.name)}"></span>` : '';
    }).join('');
    const assignCell = allAssignIds.length === 0
      ? `<span class="editable-empty">—</span>`
      : `<span class="assign-text">${assignDots}${allAssignIds.length > 5 ? `<span style="font-size:9px; color:var(--text-faint); margin-left:2px;">+${allAssignIds.length - 5}</span>` : ''}</span>`;

    return `
      <div class="row project-row">
        <div class="row-side ${sel}" data-type="project" data-project-id="${p.id}">
          ${wrap('name', `<button class="row-delete-btn" data-delete="project" data-project-id="${p.id}" title="Delete project">×</button><span class="expand-icon" data-toggle="project" data-project-id="${p.id}">${expandIcon}</span><span class="name-text" data-rename="project" data-project-id="${p.id}" title="Click to open · double-click to rename">${numLabel}${escapeHtml(p.name)}<span class="rename-edit-icon" title="Rename">✏️</span></span><button class="row-add-btn" data-add="milestone" data-project-id="${p.id}" title="Add milestone">+</button>`)}
          ${wrap('client', `<span class="client-text" title="${escapeHtml(p.client || '')}">${p.client ? escapeHtml(p.client) : '<span class=\"editable-empty\">—</span>'}</span>`)}
          ${wrap('mgr', `<span class="editable-cell" data-edit-cell="manager" data-project-id="${p.id}" title="Click to change manager">${mgrCell}</span>`)}
          ${wrap('assign', assignCell)}
          ${wrap('cat', '')}
          ${wrap('due', '')}
          ${wrap('status', `<span class="status-text" style="color:${status.color}">${escapeHtml(status.name)}</span>`)}
        </div>
      </div>`;
  }

  if (row.type === 'milestone') {
    const m = row.milestone;
    const expandIcon = (m.tasks && m.tasks.length > 0) ? (m.expanded ? '▾' : '▸') : '';
    const expandClass = expandIcon ? '' : 'placeholder';
    const urg = urgencyClass(m.dueDate);
    const status = getStatus(m.statusId);
    const cat = getCategory(m.categoryId);
    const sel = isSelectedRow('milestone', { projectId: row.project.id, milestoneId: m.id }) ? 'selected' : '';

    const assigneeIds = m.assigneeIds || [];
    const assignDots = assigneeIds.slice(0, 4).map(id => {
      const e = getEngineer(id);
      return e ? `<span class="eng-dot" style="background:${e.color}" title="${escapeHtml(e.name)}"></span>` : '';
    }).join('');
    const assignCell = assigneeIds.length === 0
      ? `<span class="editable-empty">+ assign</span>`
      : `<span class="assign-text">${assignDots}${assigneeIds.length > 4 ? `<span style="font-size:9px; color:var(--text-faint); margin-left:2px;">+${assigneeIds.length - 4}</span>` : ''}</span>`;
    const catCell = cat
      ? `<span class="cat-text" style="color:${cat.color}">${escapeHtml(cat.name)}</span>`
      : `<span class="editable-empty">— set —</span>`;

    const progress = (typeof m.progress === 'number') ? m.progress : 0;
    const progressIcon = `<span class="mini-progress" data-edit-cell="progress" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Progress: ${progress}% — click to change"><span class="mini-progress-fill" style="width:${progress}%; background:${cat ? cat.color : 'var(--accent)'};"></span></span>`;

    // Visibility badge — shared has no badge (default), restricted ones get a small lock/group icon
    const vis = m.visibility || 'shared';
    const visBadge = vis === 'shared' ? '' :
      `<span class="vis-badge vis-${vis}" title="${vis === 'engineers' ? 'Visible to engineers/managers only' : 'Private — only the owner sees this'}">${vis === 'engineers' ? '👥' : '🔒'}</span>`;

    return `
      <div class="row milestone-row">
        <div class="row-side indent-1 ${sel}" data-type="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}">
          ${wrap('name', `<button class="row-delete-btn" data-delete="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Delete milestone">×</button><span class="expand-icon ${expandClass}" data-toggle="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}">${expandIcon || '·'}</span><span class="name-text" data-rename="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to open · double-click to rename">◆ ${escapeHtml(m.name)}<span class="rename-edit-icon" title="Rename">✏️</span></span>${visBadge}${progressIcon}<button class="row-add-btn" data-add="task" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Add task to this milestone">+</button>`)}
          ${wrap('client', '')}
          ${wrap('mgr', '')}
          ${wrap('assign', `<span class="editable-cell" data-edit-cell="assignees" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to assign">${assignCell}</span>`)}
          ${wrap('cat', `<span class="editable-cell" data-edit-cell="category" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to change category">${catCell}</span>`)}
          ${wrap('due', `<span class="editable-cell" data-edit-cell="m_due" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to change due date"><span class="due-text ${urg}">${m.dueDate ? formatShortDate(m.dueDate) : '— set —'}</span></span>`)}
          ${wrap('status', `<span class="editable-cell" data-edit-cell="m_status" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to change status"><span class="status-text" style="color:${status.color}">${escapeHtml(status.name)}</span></span>`)}
        </div>
      </div>`;
  }

  if (row.type === 'task') {
    const t = row.task;
    const eng = getEngineer(t.assigneeId);
    const sel = isSelectedRow('task', { projectId: row.project.id, milestoneId: row.milestone.id, taskId: t.id }) ? 'selected' : '';
    const assignCell = eng
      ? `<span class="assign-text"><span class="eng-dot" style="background:${eng.color}"></span><span style="font-size:11px; color:${eng.color};">${escapeHtml(eng.name)}</span></span>`
      : `<span class="editable-empty">+ assign</span>`;
    const range = t.start && t.end ? `${formatShortDate(t.start)}–${formatShortDate(t.end)}` : '';
    const tStatus = getStatus(t.statusId) || getStatus('st_notstarted');

    return `
      <div class="row">
        <div class="row-side indent-2 ${sel}" data-type="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}">
          ${wrap('name', `<button class="row-delete-btn" data-delete="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" title="Delete task">×</button><span class="expand-icon placeholder">·</span><span class="name-text" data-rename="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" style="color: var(--text-dim); font-size: 11px;" title="Click to open · double-click to rename">${escapeHtml(t.name || '(unnamed task)')}<span class="rename-edit-icon" title="Rename">✏️</span></span>`)}
          ${wrap('client', '')}
          ${wrap('mgr', '')}
          ${wrap('assign', `<span class="editable-cell" data-edit-cell="t_assignee" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" title="Click to change assignee">${assignCell}</span>`)}
          ${wrap('cat', '')}
          ${wrap('due', `<span class="editable-cell" data-edit-cell="t_dates" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" title="Click to change task dates"><span class="due-text" style="font-size:10px;">${range}</span></span>`)}
          ${wrap('status', `<span class="editable-cell" data-edit-cell="t_status" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" title="Click to change status"><span class="status-text" style="color:${tStatus.color}; font-size:10px;">${escapeHtml(tStatus.name)}</span></span>`)}
        </div>
      </div>`;
  }
}


function renderGanttGridRow(row, min, dayWidth) {
  if (row.type === 'project') {
    const p = row.project;
    let html = '';
    const range = getProjectDateRange(p);
    if (range.min && range.max) {
      const left = daysBetween(min, range.min) * dayWidth;
      const width = (daysBetween(range.min, range.max) + 1) * dayWidth;
      const status = getStatus(p.statusId);
      html += `<div class="bar project-bar" style="left:${left}px; width:${width}px; background:${status.color};"></div>`;
      // Floating label after the bar end (GoodDay-style) showing project number/name.
      // Lets the user identify the project from the chart without hovering.
      const labelLeft = left + width + 8;
      const numLabel = p.number ? `<span class="proj-tag-num">${escapeHtml(p.number)}</span>` : '';
      html += `<div class="project-end-label" style="left:${labelLeft}px;">${numLabel}<span class="proj-tag-name">${escapeHtml(p.name)}</span></div>`;
    }
    // milestone tick marks always visible on project row, even if collapsed
    for (const m of (p.milestones || [])) {
      if (!m.dueDate) continue;
      if (!milestonePassesFilters(m)) continue;
      const dDate = parseDate(m.dueDate);
      const left = daysBetween(min, dDate) * dayWidth + dayWidth/2 - 5;
      const color = getColorFor(m, 'milestone');
      const cat = getCategory(m.categoryId);
      html += `<div class="milestone-marker on-project"
                data-tooltip-title="◆ ${escapeHtml(m.name)}"
                data-tooltip-meta="${escapeHtml(p.name)}${cat ? ' · ' + escapeHtml(cat.name) : ''} · ${escapeHtml(m.dueDate)}"
                data-type="milestone" data-project-id="${p.id}" data-milestone-id="${m.id}"
                style="left:${left}px; background:${color};"></div>`;
    }
    return `<div class="row-grid project-row">${html}</div>`;
  }
  if (row.type === 'milestone') {
    const m = row.milestone;
    let html = '';
    if (!m.expanded && m.tasks && m.tasks.length > 0) {
      for (const t of m.tasks) {
        if (!t.start || !t.end) continue;
        const tStart = parseDate(t.start);
        const tEnd = parseDate(t.end);
        const left = daysBetween(min, tStart) * dayWidth;
        const width = (daysBetween(tStart, tEnd) + 1) * dayWidth;
        t._milestoneRef = m;
        const color = getColorFor(t, 'task');
        delete t._milestoneRef;
        const eng = getEngineer(t.assigneeId);
        const engName = eng ? eng.name : 'Unassigned';
        html += `<div class="bar task-bar compact draggable"
                  data-type="task" data-project-id="${row.project.id}" data-milestone-id="${m.id}" data-task-id="${t.id}"
                  data-tooltip-title="${escapeHtml(t.name || 'Task')}"
                  data-tooltip-meta="${escapeHtml(m.name)} · ${escapeHtml(engName)} · ${escapeHtml(t.start)} – ${escapeHtml(t.end)}"
                  style="left:${left}px; width:${width}px; background:${color};">
                  <div class="resize-handle left" data-resize="start"></div>
                  <div class="resize-handle right" data-resize="end"></div>
                </div>`;
      }
    }
    if (m.dueDate) {
      const left = daysBetween(min, parseDate(m.dueDate)) * dayWidth + dayWidth/2 - 6;
      const color = getColorFor(m, 'milestone');
      const assignNames = (m.assigneeIds || []).map(id => { const e = getEngineer(id); return e ? e.name : ''; }).filter(Boolean).join(', ');
      const cat = getCategory(m.categoryId);
      html += `<div class="milestone-marker draggable"
                data-type="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}"
                data-tooltip-title="◆ ${escapeHtml(m.name)}"
                data-tooltip-meta="${cat ? escapeHtml(cat.name) + ' · ' : ''}${escapeHtml(m.dueDate)}${assignNames ? ' · ' + escapeHtml(assignNames) : ''}"
                style="left:${left}px; background:${color};"></div>`;
    }
    return `<div class="row-grid milestone-row">${html}</div>`;
  }
  if (row.type === 'task') {
    const t = row.task;
    let html = '';
    if (t.start && t.end) {
      const tStart = parseDate(t.start);
      const tEnd = parseDate(t.end);
      const left = daysBetween(min, tStart) * dayWidth;
      const width = (daysBetween(tStart, tEnd) + 1) * dayWidth;
      t._milestoneRef = row.milestone;
      const color = getColorFor(t, 'task');
      delete t._milestoneRef;
      const eng = getEngineer(t.assigneeId);
      const engName = eng ? eng.name : 'Unassigned';
      const taskLabel = t.name || engName;
      html = `<div class="bar task-bar draggable"
              data-type="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}"
              data-tooltip-title="${escapeHtml(t.name || 'Task')}"
              data-tooltip-meta="${escapeHtml(row.milestone.name)} · ${escapeHtml(engName)} · ${escapeHtml(t.start)} – ${escapeHtml(t.end)}"
              style="left:${left}px; width:${width}px; background:${color}; height:14px; top:9px;">
              <div class="resize-handle left" data-resize="start"></div>
              <span class="bar-label">${escapeHtml(taskLabel)}</span>
              <div class="resize-handle right" data-resize="end"></div>
            </div>`;
    }
    return `<div class="row-grid">${html}</div>`;
  }
}

function attachGanttEvents() {
  $$('[data-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const t = el.dataset.toggle;
      const pid = el.dataset.projectId;
      const mid = el.dataset.milestoneId;
      if (t === 'project') {
        const p = getProject(pid);
        p.expanded = (p.expanded === false) ? true : false;
      } else if (t === 'milestone') {
        const m = getMilestone(pid, mid);
        m.expanded = !m.expanded;
      }
      saveData();
      renderGantt();
    });
  });

  // Inline + buttons for adding a milestone (on a project row) or a task
  // (on a milestone row). Reuses the same add logic as the detail panel.
  $$('[data-add]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const what = el.dataset.add;
      const projectId = el.dataset.projectId;
      const milestoneId = el.dataset.milestoneId;
      if (what === 'milestone') {
        if (!maybeConfirmDiscard()) return;
        discardEdits();
        const p = getProject(projectId);
        if (!p) return;
        const newM = { id: uid('m'), name: 'New Milestone', categoryId: '', statusId: 'st_notstarted', dueDate: '', assigneeIds: [], tasks: [], notes: '', progress: 0, visibility: 'shared', createdBy: STATE.data.currentUserId || '' };
        if (!p.milestones) p.milestones = [];
        p.milestones.push(newM);
        p.expanded = true;  // ensure the new milestone is visible
        logHistory(projectId, `Added milestone "${newM.name}"`);
        saveData();
        STATE.selectedItem = { type: 'milestone', projectId, milestoneId: newM.id };
        renderAll();
      } else if (what === 'task') {
        if (!maybeConfirmDiscard()) return;
        discardEdits();
        const m = getMilestone(projectId, milestoneId);
        if (!m) return;
        const newT = { id: uid('t'), name: '', assigneeId: '', start: todayStr(), end: m.dueDate || todayStr(), statusId: 'st_notstarted' };
        if (!m.tasks) m.tasks = [];
        m.tasks.push(newT);
        m.expanded = true;  // ensure the new task is visible
        logHistory(projectId, `Added task to "${m.name}"`);
        saveData();
        STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: newT.id };
        renderAll();
      }
    });
  });

  // Inline delete buttons on each row. Always confirm before deleting because
  // there's no undo for milestones/tasks/projects.
  $$('[data-delete]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const what = el.dataset.delete;
      const projectId = el.dataset.projectId;
      const milestoneId = el.dataset.milestoneId;
      const taskId = el.dataset.taskId;
      if (what === 'project') {
        const p = getProject(projectId);
        if (!p) return;
        const milestoneCount = (p.milestones || []).length;
        const taskCount = (p.milestones || []).reduce((n, m) => n + (m.tasks || []).length, 0);
        const detail = milestoneCount > 0
          ? ` This will also delete ${milestoneCount} milestone${milestoneCount === 1 ? '' : 's'}${taskCount > 0 ? ` and ${taskCount} task${taskCount === 1 ? '' : 's'}` : ''}.`
          : '';
        if (!confirm(`Delete project "${p.name}"?${detail}\n\nThis cannot be undone.`)) return;
        const idx = STATE.data.projects.findIndex(x => x.id === projectId);
        if (idx >= 0) STATE.data.projects.splice(idx, 1);
        if (STATE.selectedItem?.projectId === projectId) STATE.selectedItem = null;
        saveData();
        renderAll();
        toast(`Deleted project "${p.name}"`, 'success');
      } else if (what === 'milestone') {
        const p = getProject(projectId);
        const m = getMilestone(projectId, milestoneId);
        if (!p || !m) return;
        const taskCount = (m.tasks || []).length;
        const detail = taskCount > 0 ? ` This will also delete ${taskCount} task${taskCount === 1 ? '' : 's'}.` : '';
        if (!confirm(`Delete milestone "${m.name}"?${detail}\n\nThis cannot be undone.`)) return;
        const idx = (p.milestones || []).findIndex(x => x.id === milestoneId);
        if (idx >= 0) p.milestones.splice(idx, 1);
        logHistory(projectId, `Deleted milestone "${m.name}"`);
        if (STATE.selectedItem?.milestoneId === milestoneId) STATE.selectedItem = null;
        saveData();
        renderAll();
        toast(`Deleted milestone "${m.name}"`, 'success');
      } else if (what === 'task') {
        const m = getMilestone(projectId, milestoneId);
        if (!m) return;
        const t = (m.tasks || []).find(x => x.id === taskId);
        if (!t) return;
        const label = t.name || '(unnamed task)';
        if (!confirm(`Delete task "${label}"?\n\nThis cannot be undone.`)) return;
        const idx = (m.tasks || []).findIndex(x => x.id === taskId);
        if (idx >= 0) m.tasks.splice(idx, 1);
        logHistory(projectId, `Deleted task "${label}" from "${m.name}"`);
        if (STATE.selectedItem?.taskId === taskId) STATE.selectedItem = null;
        saveData();
        renderAll();
        toast(`Deleted task "${label}"`, 'success');
      }
    });
  });

  // Inline-editable cells (manager, assignees, category, milestone status, task assignee, progress)
  $$('[data-edit-cell]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const kind = el.dataset.editCell;
      const projectId = el.dataset.projectId;
      const milestoneId = el.dataset.milestoneId;
      const taskId = el.dataset.taskId;
      if (kind === 'manager') openManagerPopup(el, projectId);
      else if (kind === 'assignees') openAssigneesPopup(el, projectId, milestoneId);
      else if (kind === 'category') openCategoryPopup(el, projectId, milestoneId);
      else if (kind === 'm_status') openStatusPopup(el, projectId, milestoneId);
      else if (kind === 't_assignee') openTaskAssigneePopup(el, projectId, milestoneId, taskId);
      else if (kind === 'progress') openProgressPopup(el, projectId, milestoneId);
      else if (kind === 'm_due') openDueDatePopup(el, projectId, milestoneId);
      else if (kind === 't_dates') openTaskDatesPopup(el, projectId, milestoneId, taskId);
      else if (kind === 't_status') openTaskStatusPopup(el, projectId, milestoneId, taskId);
    });
  });

  // Rename: double-click on the name OR click on the small ✏️ icon (which
  // appears on hover). Single click is preserved for opening the detail panel.
  // Pressing F2 while a row is selected also triggers rename.
  $$('[data-rename]').forEach(el => {
    el.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      e.preventDefault();
      // Clear selection that double-click otherwise creates
      window.getSelection?.()?.removeAllRanges?.();
      openRenameInline(el, el.dataset.projectId, el.dataset.milestoneId, el.dataset.taskId);
    });
  });
  $$('.rename-edit-icon').forEach(icon => {
    icon.addEventListener('click', (e) => {
      e.stopPropagation();
      const nameSpan = icon.closest('[data-rename]');
      if (!nameSpan) return;
      openRenameInline(nameSpan, nameSpan.dataset.projectId, nameSpan.dataset.milestoneId, nameSpan.dataset.taskId);
    });
  });

  // Column header filter carets — open the same picker that quick-filter uses
  $$('[data-col-filter]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const colKey = el.dataset.colFilter;
      const filterType = COLUMN_FILTER_TYPE[colKey];
      if (filterType) openQuickFilterPicker(el, filterType);
    });
  });

  // Column resize handles in header
  $$('[data-col-resize]').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const key = handle.dataset.colResize;
      const col = STATE.columnSettings[key];
      if (!col) return;
      const startX = e.clientX;
      const startW = col.width;
      handle.classList.add('active');
      const onMove = (ev) => {
        const dx = ev.clientX - startX;
        col.width = Math.max(60, Math.min(500, startW + dx));
        // immediate visual feedback without re-render
        document.querySelectorAll(`.side-col-${key}`).forEach(el => { el.style.width = col.width + 'px'; });
        const sh = $('#sideHeader'); if (sh) sh.style.width = totalSideWidth() + 'px';
        const sb = $('#ganttSideScroll'); if (sb) sb.style.width = totalSideWidth() + 'px';
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        handle.classList.remove('active');
        saveData();
        renderGantt();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  $$('.row-side').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-toggle]')) return;
      if (e.target.closest('[data-edit-cell]')) return;
      if (e.target.closest('[data-add]')) return;
      if (e.target.closest('[data-delete]')) return;
      handleSelectClick({
        type: el.dataset.type,
        projectId: el.dataset.projectId,
        milestoneId: el.dataset.milestoneId,
        taskId: el.dataset.taskId,
      });
    });

    // Hover over a milestone row: if its due date is off-screen, show a
    // "jump-to-deadline" indicator pinned to the left or right edge of the
    // Gantt grid. Clicking it scrolls the grid to that date.
    if (el.dataset.type === 'milestone') {
      el.addEventListener('mouseenter', () => {
        const m = getMilestone(el.dataset.projectId, el.dataset.milestoneId);
        showDeadlineJumperIfOffscreen(m, el);
      });
      el.addEventListener('mouseleave', () => {
        // Small delay so the user can move from the row to the jumper itself
        scheduleDeadlineJumperHide();
      });
    }
  });

  // Click-to-select bars/markers (when not dragging)
  $$('.bar:not(.project-bar), .milestone-marker').forEach(el => {
    if (el.dataset.tooltipTitle) {
      el.addEventListener('mouseenter', (e) => showTooltip(e, el));
      el.addEventListener('mouseleave', hideTooltip);
      el.addEventListener('mousemove', (e) => moveTooltip(e));
    }
  });
}

/* ============== DEADLINE JUMPER ============== */
let _deadlineJumperHideTimer = null;

function showDeadlineJumperIfOffscreen(milestone, rowEl) {
  // Always start by clearing any pending hide and removing existing jumper.
  if (_deadlineJumperHideTimer) { clearTimeout(_deadlineJumperHideTimer); _deadlineJumperHideTimer = null; }
  removeDeadlineJumper();

  if (!milestone || !milestone.dueDate) return;
  const grid = $('#ganttGridScroll');
  if (!grid) return;

  const { min } = getOverallDateRange();
  const dayWidth = pixelsPerDay();
  const dueOffset = daysBetween(min, parseDate(milestone.dueDate)) * dayWidth + dayWidth / 2;

  const visStart = grid.scrollLeft;
  const visEnd = visStart + grid.clientWidth;
  // Add a small inset so a date that's right at the edge isn't called "off-screen".
  const inset = 24;

  let side = null;
  if (dueOffset < visStart + inset) side = 'left';
  else if (dueOffset > visEnd - inset) side = 'right';
  else return; // already on-screen — no jumper needed

  const jumper = document.createElement('div');
  jumper.className = `deadline-jumper`;
  jumper.id = 'activeDeadlineJumper';
  const arrowChar = side === 'left' ? '◀' : '▶';
  const dayDelta = daysBetween(today(), parseDate(milestone.dueDate));
  const dateLabel = formatShortDate(milestone.dueDate);
  let deltaLabel = '';
  if (dayDelta < 0) deltaLabel = ` (${Math.abs(dayDelta)}d ago)`;
  else if (dayDelta === 0) deltaLabel = ' (today)';
  else deltaLabel = ` (in ${dayDelta}d)`;
  // Always show: arrow first if going left, arrow last if going right (so the
  // visual cue points the direction the grid will scroll). Pinned to the left
  // side regardless, so the user has a stable target to click.
  if (side === 'left') {
    jumper.innerHTML = `<span class="arrow">${arrowChar}</span><span>${escapeHtml(dateLabel)}${escapeHtml(deltaLabel)}</span>`;
  } else {
    jumper.innerHTML = `<span>${escapeHtml(dateLabel)}${escapeHtml(deltaLabel)}</span><span class="arrow">${arrowChar}</span>`;
  }
  jumper.title = `Jump to deadline: ${milestone.dueDate}`;
  jumper.addEventListener('mouseenter', () => {
    if (_deadlineJumperHideTimer) { clearTimeout(_deadlineJumperHideTimer); _deadlineJumperHideTimer = null; }
  });
  jumper.addEventListener('mouseleave', scheduleDeadlineJumperHide);
  jumper.addEventListener('click', (e) => {
    e.stopPropagation();
    // Center the deadline in the visible area
    const target = dueOffset - grid.clientWidth / 2;
    grid.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    removeDeadlineJumper();
  });

  // Append to .gantt-body (relatively positioned).
  const body = grid.parentElement;
  if (!body) return;
  body.appendChild(jumper);

  // Compute the row's top relative to .gantt-body so the jumper aligns vertically.
  const bodyRect = body.getBoundingClientRect();
  let rowTop = 0;
  if (rowEl) {
    const rowRect = rowEl.getBoundingClientRect();
    rowTop = rowRect.top - bodyRect.top + (rowRect.height - 24) / 2;
    rowTop = Math.max(2, Math.min(bodyRect.height - 26, rowTop));
  } else {
    rowTop = (bodyRect.height - 24) / 2;
  }
  jumper.style.top = rowTop + 'px';

  // ALWAYS pin to the left edge of the grid viewport (just inside the side panel),
  // regardless of which side the deadline is on. This gives the user a stable,
  // close target to click — much shorter mouse path than the right edge, and
  // never crosses other rows that would dismiss the jumper.
  const sideWidth = totalSideWidth();
  jumper.style.left = (sideWidth + 8) + 'px';
  jumper.style.right = 'auto';
}

function scheduleDeadlineJumperHide() {
  if (_deadlineJumperHideTimer) clearTimeout(_deadlineJumperHideTimer);
  _deadlineJumperHideTimer = setTimeout(removeDeadlineJumper, 150);
}

function removeDeadlineJumper() {
  const j = $('#activeDeadlineJumper');
  if (j) j.remove();
}

/* ============== POPUP MENUS (inline editing in side panel) ============== */
function closePopup() {
  const p = $('#activePopup');
  if (p) p.remove();
  document.removeEventListener('click', closePopupOnOutsideClick, true);
}
function closePopupOnOutsideClick(e) {
  const p = $('#activePopup');
  if (!p) return;
  if (!p.contains(e.target)) closePopup();
}
function showPopup(anchorEl, contentHtml) {
  closePopup();
  const popup = document.createElement('div');
  popup.className = 'popup-menu';
  popup.id = 'activePopup';
  popup.innerHTML = contentHtml;
  document.body.appendChild(popup);

  const rect = anchorEl.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 4;
  // pre-measure
  const popupRect = popup.getBoundingClientRect();
  if (left + popupRect.width > window.innerWidth - 10) {
    left = Math.max(10, window.innerWidth - popupRect.width - 10);
  }
  if (top + popupRect.height > window.innerHeight - 10) {
    top = rect.top - popupRect.height - 4;
  }
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  setTimeout(() => document.addEventListener('click', closePopupOnOutsideClick, true), 0);
  return popup;
}

function buildEngineerSearchableList(currentValue, isMulti, onSelect) {
  const engs = STATE.data.engineers;
  const renderItems = (filterStr) => {
    const f = (filterStr || '').toLowerCase();
    let items = '';
    if (!isMulti) {
      items += `<div class="popup-menu-item ${!currentValue ? 'selected' : ''}" data-eng-id="">
        <span class="popup-checkbox">${!currentValue ? '✓' : ''}</span>— None —</div>`;
    }
    const filtered = engs.filter(e => !f || e.name.toLowerCase().includes(f) || e.role.toLowerCase().includes(f));
    if (filtered.length === 0) {
      items += `<div class="popup-menu-empty">No matches</div>`;
    } else {
      for (const e of filtered) {
        const isSelected = isMulti ? (currentValue || []).includes(e.id) : (currentValue === e.id);
        items += `<div class="popup-menu-item ${isSelected ? 'selected' : ''}" data-eng-id="${e.id}">
          <span class="popup-checkbox">${isSelected ? '✓' : ''}</span>
          <span class="eng-dot" style="background:${e.color}"></span>
          <span style="color:${e.color}">${escapeHtml(e.name)}</span>
          <span style="color:var(--text-faint); font-size:10px; margin-left:auto;">${e.role}</span>
        </div>`;
      }
    }
    return items;
  };

  return {
    html: `
      <div class="popup-menu-search">
        <input type="text" id="popupSearchInput" placeholder="Search team..." autocomplete="off" />
      </div>
      <div id="popupItemsContainer">${renderItems('')}</div>
    `,
    attach: (popup) => {
      const input = popup.querySelector('#popupSearchInput');
      const container = popup.querySelector('#popupItemsContainer');
      input.focus();
      input.addEventListener('input', () => {
        container.innerHTML = renderItems(input.value);
        attachItemHandlers();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePopup();
      });
      const attachItemHandlers = () => {
        container.querySelectorAll('.popup-menu-item').forEach(item => {
          item.addEventListener('click', (ev) => {
            ev.stopPropagation();
            onSelect(item.dataset.engId, popup);
          });
        });
      };
      attachItemHandlers();
    }
  };
}

function openAssigneesPopup(anchor, projectId, milestoneId) {
  const m = getMilestone(projectId, milestoneId);
  if (!m) return;

  const renderAndAttach = (popup, searchStr) => {
    const f = (searchStr || '').toLowerCase();
    const filtered = STATE.data.engineers.filter(e =>
      !f || e.name.toLowerCase().includes(f) || e.role.toLowerCase().includes(f)
    );
    let itemsHtml = `
      <div class="popup-menu-search">
        <input type="text" id="popupSearchInput" placeholder="Search team..." autocomplete="off" value="${escapeHtml(searchStr || '')}" />
      </div>
      <div id="popupItemsContainer">
    `;
    if (filtered.length === 0) {
      itemsHtml += `<div class="popup-menu-empty">No matches</div>`;
    } else {
      for (const e of filtered) {
        const isSelected = (m.assigneeIds || []).includes(e.id);
        itemsHtml += `<div class="popup-menu-item ${isSelected ? 'selected' : ''}" data-eng-id="${e.id}">
          <span class="popup-checkbox">${isSelected ? '✓' : ''}</span>
          <span class="eng-dot" style="background:${e.color}"></span>
          <span style="color:${e.color}">${escapeHtml(e.name)}</span>
          <span style="color:var(--text-faint); font-size:10px; margin-left:auto;">${e.role}</span>
        </div>`;
      }
    }
    itemsHtml += `</div>
      <div class="popup-menu-divider"></div>
      <div style="padding: 4px 8px; font-size: 10px; color: var(--text-faint);">Click to toggle. Multi-select.</div>
    `;
    popup.innerHTML = itemsHtml;
    const input = popup.querySelector('#popupSearchInput');
    if (input) {
      input.focus();
      // place cursor at end
      const len = input.value.length;
      input.setSelectionRange(len, len);
      input.addEventListener('input', () => renderAndAttach(popup, input.value));
      input.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopup(); });
    }
    popup.querySelectorAll('.popup-menu-item').forEach(item => {
      item.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const engId = item.dataset.engId;
        if (!engId) return;
        const cur = [...(m.assigneeIds || [])];
        const idx = cur.indexOf(engId);
        const eng = getEngineer(engId);
        if (idx >= 0) {
          cur.splice(idx, 1);
          logHistory(projectId, `Removed ${eng ? eng.name : '?'} from "${m.name}"`);
        } else {
          cur.push(engId);
          logHistory(projectId, `Assigned ${eng ? eng.name : '?'} to "${m.name}"`);
        }
        m.assigneeIds = cur;
        saveData();
        renderGantt();
        // re-render popup with same search filter
        const newAnchor = document.querySelector(`[data-edit-cell="assignees"][data-milestone-id="${milestoneId}"]`);
        if (newAnchor) {
          // Keep popup open at same anchor position
          const currentSearch = popup.querySelector('#popupSearchInput')?.value || '';
          renderAndAttach(popup, currentSearch);
        }
      });
    });
  };

  const popup = showPopup(anchor, '<div></div>');
  renderAndAttach(popup, '');
}

function openColumnsPopup(anchor) {
  let items = `
    <div style="padding: 8px 10px; font-size: 10px; color: var(--text-faint); border-bottom: 1px solid var(--border);">
      Show / hide columns. Drag column edges in the header to resize.
    </div>
  `;
  for (const [key, c] of Object.entries(STATE.columnSettings)) {
    const checked = c.visible;
    const disabled = !!c.required;
    items += `<div class="popup-menu-item ${checked ? 'selected' : ''}" data-col-toggle="${key}" ${disabled ? 'style="opacity:0.5; cursor:not-allowed;"' : ''}>
      <span class="popup-checkbox">${checked ? '✓' : ''}</span>
      <span>${escapeHtml(c.label)}${disabled ? ' <span style="color:var(--text-faint); font-size:9px;">(required)</span>' : ''}</span>
    </div>`;
  }
  items += `<div class="popup-menu-divider"></div>
    <div class="popup-menu-item" data-cols-action="reset" style="color: var(--text-dim);">
      <span class="popup-checkbox"></span>
      <span>↺ Show all</span>
    </div>`;

  const popup = showPopup(anchor, items);
  popup.querySelectorAll('[data-col-toggle]').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = item.dataset.colToggle;
      const col = STATE.columnSettings[key];
      if (!col || col.required) return;
      col.visible = !col.visible;
      saveData();
      // Update checkbox/selected without closing
      item.classList.toggle('selected', col.visible);
      const cb = item.querySelector('.popup-checkbox');
      if (cb) cb.textContent = col.visible ? '✓' : '';
      renderGantt();
    });
  });
  popup.querySelectorAll('[data-cols-action="reset"]').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      for (const c of Object.values(STATE.columnSettings)) c.visible = true;
      saveData();
      closePopup();
      renderGantt();
    });
  });
}

function openProgressPopup(anchor, projectId, milestoneId) {
  const m = getMilestone(projectId, milestoneId);
  if (!m) return;
  const cur = (typeof m.progress === 'number') ? m.progress : 0;
  const html = `
    <div style="padding:10px 12px; min-width: 220px;">
      <div style="font-size:11px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;">
        Progress %
      </div>
      <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
        <input type="number" id="progInput" class="field-input" value="${cur}" min="0" max="100" step="1"
               style="flex:1; text-align:right; font-variant-numeric: tabular-nums;" />
        <span style="color:var(--text-faint); font-size:14px;">%</span>
      </div>
      <input type="range" id="progSlider" min="0" max="100" step="1" value="${cur}" style="width:100%; margin-bottom:8px;" accent-color="var(--accent)" />
      <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px;">
        ${[0, 25, 50, 75, 100].map(v => `<button type="button" class="btn small prog-quick" data-v="${v}" style="flex:1; min-width:0;">${v}%</button>`).join('')}
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn small primary" id="progApply" style="flex:1;">Apply</button>
        <button class="btn small" id="progCancel">Cancel</button>
      </div>
    </div>
  `;
  const popup = showPopup(anchor, html);
  const input = popup.querySelector('#progInput');
  const slider = popup.querySelector('#progSlider');
  setTimeout(() => { input?.focus(); input?.select(); }, 30);

  const sync = (val) => {
    let v = parseInt(val);
    if (isNaN(v)) v = 0;
    v = Math.max(0, Math.min(100, v));
    input.value = v;
    slider.value = v;
  };
  input.addEventListener('input', () => sync(input.value));
  slider.addEventListener('input', () => sync(slider.value));
  popup.querySelectorAll('.prog-quick').forEach(b => {
    b.addEventListener('click', (e) => { e.stopPropagation(); sync(b.dataset.v); });
  });

  const apply = () => {
    let newVal = parseInt(input.value);
    if (isNaN(newVal)) newVal = 0;
    newVal = Math.max(0, Math.min(100, newVal));
    if (newVal === cur) { closePopup(); return; }
    m.progress = newVal;
    // If 100%, auto-set status to first completed status
    if (newVal === 100) {
      const completed = STATE.data.statuses.find(s => s.isCompleted);
      if (completed && m.statusId !== completed.id) {
        const oldS = getStatus(m.statusId);
        m.statusId = completed.id;
        logHistory(projectId, `"${m.name}" progress: ${cur}% → 100% (status: ${oldS.name} → ${completed.name})`);
      } else {
        logHistory(projectId, `"${m.name}" progress: ${cur}% → ${newVal}%`);
      }
    } else {
      logHistory(projectId, `"${m.name}" progress: ${cur}% → ${newVal}%`);
    }
    saveData();
    closePopup();
    renderAll();
    toast(`Progress: ${newVal}%`, 'success');
  };
  popup.querySelector('#progApply').addEventListener('click', (e) => { e.stopPropagation(); apply(); });
  popup.querySelector('#progCancel').addEventListener('click', (e) => { e.stopPropagation(); closePopup(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); apply(); }
    if (e.key === 'Escape') { e.preventDefault(); closePopup(); }
  });
}

        </label>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn small primary" id="tdApply" style="flex:1;">Apply</button>
        <button class="btn small" id="tdCancel">Cancel</button>
      </div>
    </div>
  `;
  const popup = showPopup(anchor, html);
  const startInput = popup.querySelector('#tdStart');
  const endInput = popup.querySelector('#tdEnd');
  setTimeout(() => startInput?.focus(), 30);
  const apply = () => {
    const newStart = startInput.value;
    const newEnd = endInput.value;
    if (newStart && newEnd && newStart > newEnd) {
      toast('Start date must be ≤ end date', 'error');
      return;
    }
    if (newStart === t.start && newEnd === t.end) { closePopup(); return; }
    const oldRange = `${t.start || '?'} → ${t.end || '?'}`;
    const newRange = `${newStart || '?'} → ${newEnd || '?'}`;
    t.start = newStart;
    t.end = newEnd;
    logHistory(projectId, `Task dates: ${oldRange} → ${newRange}`);
    saveData();
    closePopup();
    renderAll();
    toast('Task dates updated', 'success');
  };
  popup.querySelector('#tdApply').addEventListener('click', (e) => { e.stopPropagation(); apply(); });
  popup.querySelector('#tdCancel').addEventListener('click', (e) => { e.stopPropagation(); closePopup(); });
  [startInput, endInput].forEach(inp => inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); apply(); }
    if (e.key === 'Escape') { e.preventDefault(); closePopup(); }
  }));
}

// Inline rename — replaces the cell's text with an input bound to the row's
// project/milestone/task.
function openRenameInline(anchor, projectId, milestoneId, taskId) {
  // Determine current name and where it lives
  let target = null;
  let kind = '';
  if (taskId) {
    const m = getMilestone(projectId, milestoneId);
    target = (m?.tasks || []).find(x => x.id === taskId);
    kind = 'task';
  } else if (milestoneId) {
    target = getMilestone(projectId, milestoneId);
    kind = 'milestone';
  } else {
    target = getProject(projectId);
    kind = 'project';
  }
  if (!target) return;
  const oldName = target.name || '';

  // Replace the visible name span with an input. The anchor IS the name-text
  // span (we attached data-edit-cell="rename" directly to it).
  const nameSpan = anchor.classList.contains('name-text')
    ? anchor
    : anchor.querySelector('.name-text');
  if (!nameSpan || nameSpan.dataset.editing === '1') return;
  nameSpan.dataset.editing = '1';
  const originalHtml = nameSpan.innerHTML;
  nameSpan.innerHTML = `<input type="text" class="inline-rename-input" value="${escapeHtml(oldName)}" />`;
  const input = nameSpan.querySelector('input');
  input.focus();
  input.select();

  let committed = false;
  const cleanup = () => {
    nameSpan.dataset.editing = '';
  };
  const commit = () => {
    if (committed) return;
    committed = true;
    const newName = input.value.trim();
    if (!newName || newName === oldName) {
      // restore original
      nameSpan.innerHTML = originalHtml;
      cleanup();
      return;
    }
    target.name = newName;
    logHistory(projectId, `Renamed ${kind}: "${oldName}" → "${newName}"`);
    saveData();
    cleanup();
    renderAll();
    toast(`Renamed to "${newName}"`, 'success');
  };
  const cancel = () => {
    if (committed) return;
    committed = true;
    nameSpan.innerHTML = originalHtml;
    cleanup();
  };
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', commit);
  input.addEventListener('click', (e) => e.stopPropagation());
}

function showTooltip(e, el) {
  const title = el.dataset.tooltipTitle;
  const meta = el.dataset.tooltipMeta || '';
  const tt = document.createElement('div');
  tt.className = 'tooltip';
  tt.id = 'activeTooltip';
  tt.innerHTML = `<div class="tt-title">${title}</div>${meta ? `<div class="tt-meta">${meta}</div>` : ''}`;
  $('#tooltipRoot').appendChild(tt);
  moveTooltip(e);
}
function hideTooltip() {
  const tt = $('#activeTooltip');
  if (tt) tt.remove();
}
function moveTooltip(e) {
  const tt = $('#activeTooltip');
  if (!tt) return;
  let x = e.clientX + 12;
  let y = e.clientY + 12;
  const rect = tt.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight - 10) y = e.clientY - rect.height - 12;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

function handleSelectClick(item) {

  STATE.selectedItem = item;
  renderAll();
}

function attachSideResizer() {
  const handle = $('#sideResizer');
  if (!handle) return;
  // Always resize the LAST visible column (the rightmost one), so the side
  // panel boundary lines up exactly. This avoids the "sidebar jumps" glitch
  // that happened when STATE.sidePanelWidth got out of sync with the sum of
  // column widths.
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const visible = getVisibleColumns();
    if (visible.length === 0) return;
    const lastKey = visible[visible.length - 1].key;
    const col = STATE.columnSettings[lastKey];
    if (!col) return;
    const startX = e.clientX;
    const startW = col.width;
    handle.classList.add('active');

    const applyWidth = (newW) => {
      col.width = Math.max(60, Math.min(500, newW));
      document.querySelectorAll(`.side-col-${lastKey}`).forEach(el => { el.style.width = col.width + 'px'; });
      const sh = $('#sideHeader'); if (sh) sh.style.width = totalSideWidth() + 'px';
      const sb = $('#ganttSideScroll'); if (sb) sb.style.width = totalSideWidth() + 'px';
    };

    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      applyWidth(startW + dx);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      handle.classList.remove('active');
      saveData();
      renderGantt();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

/* ============== DRAG TO MOVE / RESIZE ============== */
function attachDragHandlers(min, dayWidth) {
  // Track if a drag actually moved enough to count as a drag (vs. a click)
  const DRAG_THRESHOLD = 4;

  // Milestone marker: drag to move dueDate
  $$('.milestone-marker.draggable').forEach(el => {
    let startX, startMouseX, origDueDate, dragged = false;
    const projectId = el.dataset.projectId;
    const milestoneId = el.dataset.milestoneId;

    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      startMouseX = e.clientX;
      const m = getMilestone(projectId, milestoneId);
      if (!m || !m.dueDate) return;
      origDueDate = m.dueDate;
      startX = parseFloat(el.style.left);
      dragged = false;

      const onMove = (ev) => {
        const dx = ev.clientX - startMouseX;
        if (Math.abs(dx) < DRAG_THRESHOLD && !dragged) return;
        dragged = true;
        el.classList.add('dragging');
        const dayOffset = Math.round(dx / dayWidth);
        const newDate = addDays(parseDate(origDueDate), dayOffset);
        el.style.left = (startX + dayOffset * dayWidth) + 'px';
        // live tooltip
        let tt = $('#activeTooltip');
        if (!tt) {
          tt = document.createElement('div');
          tt.className = 'tooltip';
          tt.id = 'activeTooltip';
          $('#tooltipRoot').appendChild(tt);
        }
        tt.innerHTML = `<div class="tt-title">◆ ${escapeHtml(getMilestone(projectId, milestoneId).name)}</div><div class="tt-meta">New due: ${fmtDate(newDate)}</div>`;
        moveTooltip(ev);
      };
      const onUp = (ev) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        el.classList.remove('dragging');
        hideTooltip();
        if (!dragged) {
          // It was a click — select
          handleSelectClick({ type: 'milestone', projectId, milestoneId });
          return;
        }
        const dx = ev.clientX - startMouseX;
        const dayOffset = Math.round(dx / dayWidth);
        if (dayOffset === 0) { renderGantt(); return; }
        const m = getMilestone(projectId, milestoneId);
        const oldDate = m.dueDate;
        m.dueDate = fmtDate(addDays(parseDate(origDueDate), dayOffset));
        logHistory(projectId, `"${m.name}" due: ${oldDate} → ${m.dueDate} (drag)`);
        saveData();
        renderAll();
        toast(`Moved to ${m.dueDate}`, 'success');
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Task bars: drag to move (whole), or drag handles to resize
  $$('.bar.task-bar.draggable').forEach(el => {
    const projectId = el.dataset.projectId;
    const milestoneId = el.dataset.milestoneId;
    const taskId = el.dataset.taskId;

    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const handle = e.target.closest('.resize-handle');
      const resizeMode = handle ? handle.dataset.resize : null; // 'start' | 'end' | null
      e.preventDefault();
      e.stopPropagation();

      const t = getTask(projectId, milestoneId, taskId);
      if (!t || !t.start || !t.end) return;
      const startMouseX = e.clientX;
      const origStart = t.start;
      const origEnd = t.end;
      const origLeft = parseFloat(el.style.left);
      const origWidth = parseFloat(el.style.width);
      let dragged = false;

      const onMove = (ev) => {
        const dx = ev.clientX - startMouseX;
        if (Math.abs(dx) < DRAG_THRESHOLD && !dragged) return;
        dragged = true;
        el.classList.add('dragging');
        const dayOffset = Math.round(dx / dayWidth);
        let newStartDate = parseDate(origStart);
        let newEndDate = parseDate(origEnd);
        if (resizeMode === 'start') {
          newStartDate = addDays(newStartDate, dayOffset);
          if (newStartDate >= newEndDate) newStartDate = addDays(newEndDate, -1);
          el.style.left = (origLeft + Math.max(dayOffset, daysBetween(parseDate(origEnd), addDays(parseDate(origEnd), -1))) * dayWidth) + 'px';
          // recompute properly
          const offsetFromMin = daysBetween(min, newStartDate);
          el.style.left = (offsetFromMin * dayWidth) + 'px';
          el.style.width = ((daysBetween(newStartDate, newEndDate) + 1) * dayWidth) + 'px';
        } else if (resizeMode === 'end') {
          newEndDate = addDays(newEndDate, dayOffset);
          if (newEndDate <= newStartDate) newEndDate = addDays(newStartDate, 1);
          el.style.width = ((daysBetween(newStartDate, newEndDate) + 1) * dayWidth) + 'px';
        } else {
          // move whole
          newStartDate = addDays(newStartDate, dayOffset);
          newEndDate = addDays(newEndDate, dayOffset);
          el.style.left = (origLeft + dayOffset * dayWidth) + 'px';
        }
        let tt = $('#activeTooltip');
        if (!tt) {
          tt = document.createElement('div');
          tt.className = 'tooltip';
          tt.id = 'activeTooltip';
          $('#tooltipRoot').appendChild(tt);
        }
        tt.innerHTML = `<div class="tt-title">${escapeHtml(t.name || 'Task')}</div><div class="tt-meta">${fmtDate(newStartDate)} → ${fmtDate(newEndDate)}</div>`;
        moveTooltip(ev);
      };
      const onUp = (ev) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        el.classList.remove('dragging');
        hideTooltip();
        if (!dragged) {
          handleSelectClick({ type: 'task', projectId, milestoneId, taskId });
          return;
        }
        const dx = ev.clientX - startMouseX;
        const dayOffset = Math.round(dx / dayWidth);
        if (dayOffset === 0) { renderGantt(); return; }
        const taskLive = getTask(projectId, milestoneId, taskId);
        const m = getMilestone(projectId, milestoneId);
        let newStart = parseDate(origStart);
        let newEnd = parseDate(origEnd);
        if (resizeMode === 'start') {
          newStart = addDays(newStart, dayOffset);
          if (newStart >= newEnd) newStart = addDays(newEnd, -1);
        } else if (resizeMode === 'end') {
          newEnd = addDays(newEnd, dayOffset);
          if (newEnd <= newStart) newEnd = addDays(newStart, 1);
        } else {
          newStart = addDays(newStart, dayOffset);
          newEnd = addDays(newEnd, dayOffset);
        }
        taskLive.start = fmtDate(newStart);
        taskLive.end = fmtDate(newEnd);
        const verb = resizeMode ? `resize ${resizeMode}` : 'move';
        logHistory(projectId, `Task on "${m.name}" ${verb}: ${origStart}→${origEnd} ⇒ ${taskLive.start}→${taskLive.end}`);
        saveData();
        renderAll();
        toast(`Task: ${taskLive.start} → ${taskLive.end}`, 'success');
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function attachDetailEvents() {
  const panel = $('#detailPanel');

  panel.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => handleDetailAction(el.dataset.action, el));
  });

  panel.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('input', () => stageEdit(el.dataset.edit, el.value));
    el.addEventListener('change', () => stageEdit(el.dataset.edit, el.value));
  });

  const aa = panel.querySelector('[data-action="add-assignee"]');
  if (aa) aa.addEventListener('change', () => {
    if (aa.value) {
      const eff = getEffective('milestone', STATE.selectedItem);
      const newIds = [...(eff.assigneeIds || []), aa.value];
      stageEdit('assigneeIds', newIds);
      renderDetailPanel();
    }
  });
}

function stageEdit(field, value) {
  if (!STATE.dirtySelected) STATE.dirtySelected = {};
  STATE.dirtySelected[field] = value;
  const btn = $('[data-action="apply"]');
  const dbtn = $('[data-action="discard"]');
  if (btn) {
    btn.disabled = false;
    btn.classList.remove('primary');
    btn.classList.add('dirty');
    btn.textContent = '● Save Changes';
  }
  if (dbtn) dbtn.disabled = false;
  const sub = $('.detail-subtitle');
  if (sub && !sub.querySelector('.dirty-indicator')) {
    sub.insertAdjacentHTML('beforeend', ' <span class="dirty-indicator" title="Unsaved changes"></span>');
  }
}

function handleDetailAction(action, el) {
  if (!STATE.selectedItem) return;
  const { type, projectId, milestoneId, taskId } = STATE.selectedItem;

  if (action === 'apply') { applyEdits(); return; }
  if (action === 'discard') { discardEdits(); renderDetailPanel(); return; }
  if (action === 'close-detail') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = null;
    renderAll();
    return;
  }
  if (action === 'back-to-project') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'project', projectId };
    renderAll();
    return;
  }
  if (action === 'back-to-milestone') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId };
    renderAll();
    return;
  }
  if (action === 'open-milestone') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId: el.dataset.milestoneId };
    renderAll();
    return;
  }
  if (action === 'open-task') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: el.dataset.taskId };
    renderAll();
    return;
  }
  if (action === 'add-milestone') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    const p = getProject(projectId);
    const newM = { id: uid('m'), name: 'New Milestone', categoryId: '', statusId: 'st_notstarted', dueDate: '', assigneeIds: [], tasks: [], notes: '', visibility: 'shared', createdBy: STATE.data.currentUserId || '' };
    if (!p.milestones) p.milestones = [];
    p.milestones.push(newM);
    logHistory(projectId, `Added milestone "${newM.name}"`);
    saveData();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId: newM.id };
    renderAll();
    return;
  }
  if (action === 'add-task') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    const m = getMilestone(projectId, milestoneId);
    const newT = { id: uid('t'), name: '', assigneeId: '', start: todayStr(), end: m.dueDate || todayStr(), statusId: 'st_notstarted' };
    if (!m.tasks) m.tasks = [];
    m.tasks.push(newT);
    logHistory(projectId, `Added task to "${m.name}"`);
    saveData();
    STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: newT.id };
    renderAll();
    return;
  }
  if (action === 'remove-assignee') {
    const engId = el.dataset.engId;
    const eff = getEffective('milestone', STATE.selectedItem);
    const newIds = (eff.assigneeIds || []).filter(i => i !== engId);
    stageEdit('assigneeIds', newIds);
    renderDetailPanel();
    return;
  }
  if (action === 'delete-project') {
    if (!confirm('Delete this project and all its milestones? This cannot be undone.')) return;
    STATE.data.projects = STATE.data.projects.filter(p => p.id !== projectId);
    discardEdits();
    saveData();
    STATE.selectedItem = null;
    renderAll();
    return;
  }
  if (action === 'delete-milestone') {
    if (!confirm('Delete this milestone?')) return;
    const p = getProject(projectId);
    const m = getMilestone(projectId, milestoneId);
    p.milestones = p.milestones.filter(x => x.id !== milestoneId);
    logHistory(projectId, `Deleted milestone "${m.name}"`);
    discardEdits();
    saveData();
    STATE.selectedItem = { type: 'project', projectId };
    renderAll();
    return;
  }
  if (action === 'delete-task') {
    if (!confirm('Delete this task?')) return;
    const m = getMilestone(projectId, milestoneId);
    m.tasks = m.tasks.filter(t => t.id !== taskId);
    logHistory(projectId, `Deleted a task from "${m.name}"`);
    discardEdits();
    saveData();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId };
    renderAll();
    return;
  }
}

/* ============== CALENDAR (scrollable, multi-month) ============== */
function renderCalendar() {
  const view = $('#calendarView');

  // Preserve current scroll position so toggling Milestones/Tasks checkboxes doesn't jump us.
  const prevScroll = $('#calScrollWrap');
  const prevScrollTop = prevScroll ? prevScroll.scrollTop : null;

  const events = collectCalendarEvents();
  const eventsByDate = {};
  for (const e of events) {
    if (!eventsByDate[e.date]) eventsByDate[e.date] = [];
    eventsByDate[e.date].push(e);
  }
  for (const k in eventsByDate) {
    eventsByDate[k].sort((a, b) => (a.kind === 'milestone' ? 0 : 1) - (b.kind === 'milestone' ? 0 : 1));
  }

  // Determine month range: from today - 1 month to last event date + 2 months, min 12 months total
  const t = today();
  let startMonth = new Date(t.getFullYear(), t.getMonth() - 1, 1);
  let endMonth = new Date(t.getFullYear(), t.getMonth() + 11, 1);
  for (const e of events) {
    const d = parseDate(e.date);
    if (d) {
      const dm = new Date(d.getFullYear(), d.getMonth(), 1);
      if (dm < startMonth) startMonth = dm;
      if (dm > endMonth) endMonth = dm;
    }
  }
  // pad end by 2 months
  endMonth = new Date(endMonth.getFullYear(), endMonth.getMonth() + 2, 1);

  let monthsHtml = '';
  let cur = new Date(startMonth);
  while (cur <= endMonth) {
    monthsHtml += renderCalMonth(cur.getFullYear(), cur.getMonth(), eventsByDate);
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }

  view.innerHTML = `
    <div class="cal-header">
      <h2 class="cal-title">Calendar</h2>
    </div>
    <div class="cal-scroll-wrap" id="calScrollWrap">
      ${monthsHtml}
    </div>
  `;

  view.querySelectorAll('.cal-event').forEach(el => {
    el.addEventListener('click', () => {
      handleSelectClick({
        type: el.dataset.type,
        projectId: el.dataset.projectId,
        milestoneId: el.dataset.milestoneId,
        taskId: el.dataset.taskId,
      });
    });
  });

  // Restore scroll position if we had one (after toggle re-render)
  if (prevScrollTop !== null) {
    const newScroll = $('#calScrollWrap');
    if (newScroll) newScroll.scrollTop = prevScrollTop;
  }
}

function renderCalMonth(year, month, eventsByDate) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const monthName = firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let cellsHtml = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(dow => {
    cellsHtml += `<div class="cal-dow-header">${dow}</div>`;
  });

  const prevLast = new Date(year, month, 0).getDate();
  for (let i = startOffset - 1; i >= 0; i--) {
    const d = prevLast - i;
    const date = new Date(year, month - 1, d);
    cellsHtml += renderCalDay(date, true, eventsByDate);
  }
  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    cellsHtml += renderCalDay(date, false, eventsByDate);
  }
  const totalCells = startOffset + totalDays;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= trailing; d++) {
    const date = new Date(year, month + 1, d);
    cellsHtml += renderCalDay(date, true, eventsByDate);
  }

  const isCurrent = (year === today().getFullYear() && month === today().getMonth());
  return `
    <div class="cal-month-section" data-year="${year}" data-month="${month}" ${isCurrent ? 'id="calCurrentMonth"' : ''}>
      <div class="cal-month-title">${monthName}</div>
      <div class="cal-grid">${cellsHtml}</div>
    </div>
  `;
}

function renderCalDay(date, otherMonth, eventsByDate) {
  const ds = fmtDate(date);
  const isToday = ds === todayStr();
  const isWknd = date.getDay() === 0 || date.getDay() === 6;
  const events = eventsByDate[ds] || [];
  const eventsHtml = events.map(e => {
    const cls = e.kind === 'task' ? 'task' : '';
    return `<div class="cal-event ${cls}"
      data-type="${e.kind === 'task' ? 'task' : 'milestone'}"
      data-project-id="${e.projectId}"
      data-milestone-id="${e.milestoneId}"
      ${e.taskId ? `data-task-id="${e.taskId}"` : ''}
      style="background: ${e.color}33; border-left-color: ${e.color}; color: ${e.color};"
      title="${escapeHtml(e.tooltip)}">${escapeHtml(e.label)}</div>`;
  }).join('');
  return `
    <div class="cal-day ${otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isWknd && !otherMonth ? 'weekend' : ''}">
      <div class="cal-day-num">${date.getDate()}</div>
      <div class="cal-events">${eventsHtml}</div>
    </div>
  `;
}

function collectCalendarEvents() {
  const events = [];
  for (const p of STATE.data.projects) {
    if (!projectPassesFilters(p)) continue;
    const mgr = getEngineer(p.managerId);
    // [Manager] tag replaces the old [Category] tag — managers are more useful
    // at a glance for office staffing/workload context.
    const mgrTag = mgr ? `[${mgr.name}] ` : '';
    // Project number prefix (e.g. "#24-105 Project Name")
    const projLabel = (p.number ? `${p.number} ` : '') + p.name;

    for (const m of (p.milestones || [])) {
      if (!milestonePassesFilters(m)) continue;
      const cat = getCategory(m.categoryId);

      if (STATE.showMilestones && m.dueDate) {
        const color = getColorFor(m, 'milestone');
        const engNames = (m.assigneeIds || []).map(id => { const e = getEngineer(id); return e ? e.name : ''; }).filter(Boolean).join(', ');
        const label = `◆ ${projLabel} — ${mgrTag}${m.name}${engNames ? ' (' + engNames + ')' : ''}`;
        const tooltip = `${projLabel}\n${mgr ? 'Manager: ' + mgr.name + '\n' : ''}${cat ? cat.name + ' · ' : ''}${m.name}\nDue: ${m.dueDate}${engNames ? '\nAssignees: ' + engNames : ''}`;
        events.push({
          date: m.dueDate, kind: 'milestone', label, tooltip, color,
          projectId: p.id, milestoneId: m.id,
        });
      }
      if (STATE.showTasks) {
        for (const tk of (m.tasks || [])) {
          if (!tk.start || !tk.end) continue;
          const start = parseDate(tk.start);
          const end = parseDate(tk.end);
          const days = daysBetween(start, end);
          const eng = getEngineer(tk.assigneeId);
          const color = eng ? eng.color : '#5a6573';
          const engLabel = eng ? eng.name : 'Unassigned';
          const taskLabel = tk.name || engLabel;
          const label = `${projLabel} — ${mgrTag}${m.name} · ${taskLabel}${eng && tk.name ? ' (' + eng.name + ')' : ''}`;
          const tooltip = `${projLabel}\n${mgr ? 'Manager: ' + mgr.name + '\n' : ''}${cat ? cat.name + ' · ' : ''}${m.name}\nTask: ${taskLabel}\n${engLabel}\n${tk.start} – ${tk.end}`;
          for (let i = 0; i <= days; i++) {
            const d = addDays(start, i);
            events.push({
              date: fmtDate(d), kind: 'task', label, tooltip, color,
              projectId: p.id, milestoneId: m.id, taskId: tk.id,
            });
          }
        }
      }
    }
  }
  return events;
}

function scrollCalendarToToday() {
  const el = $('#calCurrentMonth');
  const wrap = $('#calScrollWrap');
  if (el && wrap) {
    wrap.scrollTop = el.offsetTop - 10;
  }
}

/* ============== MY WORK VIEW ============== */
function renderMyWork() {
  const view = $('#myworkView');
  // Populate the user selector
  const selector = $('#myworkUser');
  if (selector) {
    const currentVal = selector.value || STATE.data.currentUserId || (STATE.data.engineers[0]?.id || '');
    const opts = STATE.data.engineers.map(e =>
      `<option value="${e.id}" ${e.id === currentVal ? 'selected' : ''}>${escapeHtml(e.name)} (${e.role})</option>`
    ).join('');
    selector.innerHTML = opts || '<option>No team members</option>';
  }

  const userId = ($('#myworkUser')?.value) || STATE.data.currentUserId || (STATE.data.engineers[0]?.id || '');
  const eng = getEngineer(userId);

  if (!eng) {
    view.innerHTML = `<div class="empty-state">
      <h2>No team members yet</h2>
      <p>Add team members in Settings, then come back to see "My Work".</p>
      <button class="btn primary" onclick="openSettings()">⚙ Open Settings</button>
    </div>`;
    return;
  }

  // Collect milestones relevant to this user. A milestone is relevant if:
  //   • the user is directly assigned to it (in assigneeIds), OR
  //   • the user is assigned to one of its tasks, OR
  //   • the user is the project's manager (so PMs can see what they oversee).
  const items = [];
  for (const p of STATE.data.projects) {
    const isManager = p.managerId === userId;
    for (const m of (p.milestones || [])) {
      const assigned = (m.assigneeIds || []).includes(userId);
      const hasTask = (m.tasks || []).some(t => t.assigneeId === userId);
      if (!assigned && !hasTask && !isManager) continue;
      const st = getStatus(m.statusId);
      if (st.isCompleted) continue; // hide completed
      items.push({
        project: p,
        milestone: m,
        isManager,
        viaTask: !assigned && hasTask,
        viaManager: !assigned && !hasTask && isManager,
      });
    }
  }

  // Bucket by due date
  const t = today();
  const buckets = {
    overdue: [],
    thisWeek: [],
    next2Weeks: [],
    later: [],
    noDate: [],
  };
  for (const item of items) {
    const m = item.milestone;
    if (!m.dueDate) { buckets.noDate.push(item); continue; }
    const d = parseDate(m.dueDate);
    const days = daysBetween(t, d);
    if (days < 0) buckets.overdue.push(item);
    else if (days <= 7) buckets.thisWeek.push(item);
    else if (days <= 21) buckets.next2Weeks.push(item);
    else buckets.later.push(item);
  }
  // Sort each bucket by due date
  for (const k of Object.keys(buckets)) {
    buckets[k].sort((a, b) => (a.milestone.dueDate || '').localeCompare(b.milestone.dueDate || ''));
  }

  const renderBucket = (className, title, list, icon) => {
    if (list.length === 0) return '';
    const itemsHtml = list.map(it => {
      const m = it.milestone;
      const p = it.project;
      const cat = getCategory(m.categoryId);
      const st = getStatus(m.statusId);
      const urg = urgencyClass(m.dueDate);
      const dateLabel = m.dueDate ? formatShortDate(m.dueDate) : 'No date';
      const progress = (typeof m.progress === 'number') ? m.progress : 0;
      const roleTag = it.viaManager
        ? '<span style="color:var(--accent); font-size:9px; margin-left:4px;">⚑ MGR (oversee)</span>'
        : it.isManager
        ? '<span style="color:var(--accent); font-size:9px; margin-left:4px;">⚑ MGR</span>'
        : (it.viaTask ? '<span style="color:var(--text-faint); font-size:9px; margin-left:4px;">(task only)</span>' : '');
      return `
        <div class="mywork-item" data-project-id="${p.id}" data-milestone-id="${m.id}">

            <div class="mywork-item-meta">${p.number ? escapeHtml(p.number) + ' · ' : ''}${escapeHtml(p.name)}${p.client ? ' · ' + escapeHtml(p.client) : ''}</div>

            <div class="mywork-item-progress-fill" style="width:${progress}%; background:${cat ? cat.color : 'var(--accent)'};"></div>

    }).join('');
    return `
      <div class="mywork-section ${className}">
        <div class="mywork-section-title">
          <span>${icon} ${escapeHtml(title)}</span>
          <span class="mywork-section-count">${list.length}</span>
        </div>
        ${itemsHtml}
      </div>`;
  };

  const totalCount = items.length;
  const greeting = totalCount === 0
    ? `<div class="empty-state"><h2>🎉 All clear, ${escapeHtml(eng.name.split(' ')[0])}!</h2><p>No active milestones assigned to you.</p></div>`

        ${renderBucket('overdue', 'Overdue', buckets.overdue, '⚠')}
        ${renderBucket('this-week', 'Due This Week', buckets.thisWeek, '🔥')}
        ${renderBucket('next-2-weeks', 'Next 2 Weeks', buckets.next2Weeks, '📅')}
        ${renderBucket('later', 'Later', buckets.later, '🌱')}
        ${buckets.noDate.length ? renderBucket('later', 'No Due Date', buckets.noDate, '◇') : ''}
      `;

  view.innerHTML = `
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;">
      <div>
        <h2 style="font-family: Georgia, serif; font-size: 22px; font-weight: 400;">
          <span style="color:${eng.color}">${escapeHtml(eng.name)}</span>'s Work
        </h2>
        <div style="font-size: 11px; color: var(--text-faint); margin-top: 2px;">${totalCount} active milestone${totalCount === 1 ? '' : 's'}</div>
      </div>

  view.querySelectorAll('.mywork-item').forEach(el => {
