          <span style="color:var(--text-faint); font-size:10px; margin-left:auto;">${e.role}</span>
        </div>`;
      }
    }
    itemsHtml += `</div>
      <div class="popup-menu-divider"></div>
      <div style="padding: 4px 8px; font-size: 10px; color: var(--text-faint);">Click to toggle. Multi-select.</div>
    `;
    popup.innerHTML = itemsHtml;
    const input = popup.querySelector('#popupSearchInput');
    if (input) {
      input.focus();
      // place cursor at end
      const len = input.value.length;
      input.setSelectionRange(len, len);
      input.addEventListener('input', () => renderAndAttach(popup, input.value));
      input.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePopup(); });
    }
    popup.querySelectorAll('.popup-menu-item').forEach(item => {
      item.addEventListener('click', (ev) => {
        ev.stopPropagation();
        const engId = item.dataset.engId;
        if (!engId) return;
        const cur = [...(m.assigneeIds || [])];
        const idx = cur.indexOf(engId);
        const eng = getEngineer(engId);
        if (idx >= 0) {
          cur.splice(idx, 1);
          logHistory(projectId, `Removed ${eng ? eng.name : '?'} from "${m.name}"`);
        } else {
          cur.push(engId);
          logHistory(projectId, `Assigned ${eng ? eng.name : '?'} to "${m.name}"`);
        }
        m.assigneeIds = cur;
        saveData();
        renderGantt();
        // re-render popup with same search filter
        const newAnchor = document.querySelector(`[data-edit-cell="assignees"][data-milestone-id="${milestoneId}"]`);
        if (newAnchor) {
          // Keep popup open at same anchor position
          const currentSearch = popup.querySelector('#popupSearchInput')?.value || '';
          renderAndAttach(popup, currentSearch);
        }
      });
    });
  };

  const popup = showPopup(anchor, '<div></div>');
  renderAndAttach(popup, '');
}

function openProgressPopup(anchor, projectId, milestoneId) {
  const m = getMilestone(projectId, milestoneId);
  if (!m) return;
  const cur = (typeof m.progress === 'number') ? m.progress : 0;
  const html = `
    <div style="padding:10px 12px; min-width: 220px;">
      <div style="font-size:11px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:8px;">
        Progress %
      </div>
      <div style="display:flex; gap:6px; align-items:center; margin-bottom:8px;">
        <input type="number" id="progInput" class="field-input" value="${cur}" min="0" max="100" step="1"
               style="flex:1; text-align:right; font-variant-numeric: tabular-nums;" />
        <span style="color:var(--text-faint); font-size:14px;">%</span>
      </div>
      <input type="range" id="progSlider" min="0" max="100" step="1" value="${cur}" style="width:100%; margin-bottom:8px;" accent-color="var(--accent)" />
      <div style="display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px;">
        ${[0, 25, 50, 75, 100].map(v => `<button type="button" class="btn small prog-quick" data-v="${v}" style="flex:1; min-width:0;">${v}%</button>`).join('')}
      </div>
      <div style="display:flex; gap:6px;">
        <button class="btn small primary" id="progApply" style="flex:1;">Apply</button>
        <button class="btn small" id="progCancel">Cancel</button>
      </div>
    </div>
  `;
  const popup = showPopup(anchor, html);
  const input = popup.querySelector('#progInput');
  const slider = popup.querySelector('#progSlider');
  setTimeout(() => { input?.focus(); input?.select(); }, 30);

  const sync = (val) => {
    let v = parseInt(val);
    if (isNaN(v)) v = 0;
    v = Math.max(0, Math.min(100, v));
    input.value = v;
    slider.value = v;
  };
  input.addEventListener('input', () => sync(input.value));
  slider.addEventListener('input', () => sync(slider.value));
  popup.querySelectorAll('.prog-quick').forEach(b => {
    b.addEventListener('click', (e) => { e.stopPropagation(); sync(b.dataset.v); });
  });

  const apply = () => {
    let newVal = parseInt(input.value);
    if (isNaN(newVal)) newVal = 0;
    newVal = Math.max(0, Math.min(100, newVal));
    if (newVal === cur) { closePopup(); return; }
    m.progress = newVal;
    // If 100%, auto-set status to first completed status
    if (newVal === 100) {
      const completed = STATE.data.statuses.find(s => s.isCompleted);
      if (completed && m.statusId !== completed.id) {
        const oldS = getStatus(m.statusId);
        m.statusId = completed.id;
        logHistory(projectId, `"${m.name}" progress: ${cur}% → 100% (status: ${oldS.name} → ${completed.name})`);
      } else {
        logHistory(projectId, `"${m.name}" progress: ${cur}% → ${newVal}%`);
      }
    } else {
      logHistory(projectId, `"${m.name}" progress: ${cur}% → ${newVal}%`);
    }
    maybeAutoCompleteProject(projectId);
    saveData();
    closePopup();
    renderAll();
    toast(`Progress: ${newVal}%`, 'success');
  };
  popup.querySelector('#progApply').addEventListener('click', (e) => { e.stopPropagation(); apply(); });
  popup.querySelector('#progCancel').addEventListener('click', (e) => { e.stopPropagation(); closePopup(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); apply(); }
    if (e.key === 'Escape') { e.preventDefault(); closePopup(); }
  });
}

// Inline rename — replaces the cell's text with an input bound to the row's
// project/milestone/task.
function openRenameInline(anchor, projectId, milestoneId, taskId) {
  // Determine current name and where it lives
  let target = null;
  let kind = '';
  if (taskId) {
    const m = getMilestone(projectId, milestoneId);
    target = (m?.tasks || []).find(x => x.id === taskId);
    kind = 'task';
  } else if (milestoneId) {
    target = getMilestone(projectId, milestoneId);
    kind = 'milestone';
  } else {
    target = getProject(projectId);
    kind = 'project';
  }
  if (!target) return;
  const oldName = target.name || '';

  // Replace the visible name span with an input. The anchor IS the name-text
  // span (we attached data-edit-cell="rename" directly to it).
  const nameSpan = anchor.classList.contains('name-text')
    ? anchor
    : anchor.querySelector('.name-text');
  if (!nameSpan || nameSpan.dataset.editing === '1') return;
  nameSpan.dataset.editing = '1';
  const originalHtml = nameSpan.innerHTML;
  nameSpan.innerHTML = `<input type="text" class="inline-rename-input" value="${escapeHtml(oldName)}" />`;
  const input = nameSpan.querySelector('input');
  input.focus();
  input.select();

  let committed = false;
  const cleanup = () => {
    nameSpan.dataset.editing = '';
  };
  const commit = () => {
    if (committed) return;
    committed = true;
    const newName = input.value.trim();
    if (!newName || newName === oldName) {
      // restore original
      nameSpan.innerHTML = originalHtml;
      cleanup();
      return;
    }
    let undoTarget;
    if (kind === 'project')   undoTarget = { type: 'project',   id: projectId };
    else if (kind === 'milestone') undoTarget = { type: 'milestone', projectId, id: milestoneId };
    else if (kind === 'task') undoTarget = { type: 'task', projectId, milestoneId, id: taskId };
    captureUndo(`rename ${kind}`, undoTarget);
    target.name = newName;
    logHistory(projectId, `Renamed ${kind}: "${oldName}" → "${newName}"`);
    saveData();
    cleanup();
    renderAll();
    toast(`Renamed to "${newName}"`, 'success');
  };
  const cancel = () => {
    if (committed) return;
    committed = true;
    nameSpan.innerHTML = originalHtml;
    cleanup();
  };
  input.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { e.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', commit);
  input.addEventListener('click', (e) => e.stopPropagation());
}

function showTooltip(e, el) {
  const title = el.dataset.tooltipTitle;
  const meta = el.dataset.tooltipMeta || '';
  const tt = document.createElement('div');
  tt.className = 'tooltip';
  tt.id = 'activeTooltip';
  tt.innerHTML = `<div class="tt-title">${title}</div>${meta ? `<div class="tt-meta">${meta}</div>` : ''}`;
  $('#tooltipRoot').appendChild(tt);
  moveTooltip(e);
}
function hideTooltip() {
  const tt = $('#activeTooltip');
  if (tt) tt.remove();
}
function moveTooltip(e) {
  const tt = $('#activeTooltip');
  if (!tt) return;
  let x = e.clientX + 12;
  let y = e.clientY + 12;
  const rect = tt.getBoundingClientRect();
  if (x + rect.width > window.innerWidth - 10) x = e.clientX - rect.width - 12;
  if (y + rect.height > window.innerHeight - 10) y = e.clientY - rect.height - 12;
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

function handleSelectClick(item) {

function attachSideResizer() {
  const handle = $('#sideResizer');
  if (!handle) return;
  // The side resizer changes only how much of the side panel is *visible*.
  // Column widths themselves stay put — when the user shrinks the panel,
  // the rightmost columns are clipped behind the Gantt area; when they
  // expand it back, those columns re-emerge at their original sizes.
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    e.stopPropagation();
    const startX = e.clientX;
    const total = totalSideWidth();
    const startVis = STATE.sidePanelVisibleWidth == null ? total : STATE.sidePanelVisibleWidth;
    handle.classList.add('active');

    const apply = (newVis) => {
      // Clamp: at minimum show ~60px (still leaves a sliver of name column),
      // at max go up to the full column-sum width (any wider has no effect
      // since there's no more content to reveal).
      newVis = Math.max(60, Math.min(total, newVis));
      STATE.sidePanelVisibleWidth = newVis;
      const sh = $('#sideHeader'); if (sh) sh.style.width = newVis + 'px';
      const sb = $('#ganttSideScroll'); if (sb) sb.style.width = newVis + 'px';
    };

    const onMove = (ev) => {
      const dx = ev.clientX - startX;
      apply(startVis + dx);
    };
    const onUp = () => {
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
      handle.classList.remove('active');
      // Persist locally + sync to user prefs (per-viewer, not shared)
      saveLocal();
      scheduleUserPrefsSync();
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });

  // Double-click to reset to full size (show all columns)
  handle.addEventListener('dblclick', (e) => {
    e.preventDefault();
    e.stopPropagation();
    STATE.sidePanelVisibleWidth = null;
    saveLocal();
    scheduleUserPrefsSync();
    renderGantt();
  });
}

/* ============== DRAG TO MOVE / RESIZE ============== */
function attachDragHandlers(min, dayWidth) {
  // Track if a drag actually moved enough to count as a drag (vs. a click)
  const DRAG_THRESHOLD = 4;

  // Milestone marker: drag to move dueDate
  $$('.milestone-marker.draggable').forEach(el => {
    let startX, startMouseX, origDueDate, dragged = false;
    const projectId = el.dataset.projectId;
    const milestoneId = el.dataset.milestoneId;

    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      startMouseX = e.clientX;
      const m = getMilestone(projectId, milestoneId);
      if (!m || !m.dueDate) return;
      origDueDate = m.dueDate;
      startX = parseFloat(el.style.left);
      dragged = false;

      const onMove = (ev) => {
        const dx = ev.clientX - startMouseX;
        if (Math.abs(dx) < DRAG_THRESHOLD && !dragged) return;
        dragged = true;
        el.classList.add('dragging');
        const dayOffset = Math.round(dx / dayWidth);
        const newDate = addDays(parseDate(origDueDate), dayOffset);
        el.style.left = (startX + dayOffset * dayWidth) + 'px';
        // live tooltip
        let tt = $('#activeTooltip');
        if (!tt) {
          tt = document.createElement('div');
          tt.className = 'tooltip';
          tt.id = 'activeTooltip';
          $('#tooltipRoot').appendChild(tt);
        }
        tt.innerHTML = `<div class="tt-title">◆ ${escapeHtml(getMilestone(projectId, milestoneId).name)}</div><div class="tt-meta">New due: ${fmtDate(newDate)}</div>`;
        moveTooltip(ev);
      };
      const onUp = (ev) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        el.classList.remove('dragging');
        hideTooltip();
        if (!dragged) {
          // It was a click — select
          handleSelectClick({ type: 'milestone', projectId, milestoneId });
          return;
        }
        const dx = ev.clientX - startMouseX;
        const dayOffset = Math.round(dx / dayWidth);
        if (dayOffset === 0) { renderGantt(); return; }
        const m = getMilestone(projectId, milestoneId);
        const oldDate = m.dueDate;
        m.dueDate = fmtDate(addDays(parseDate(origDueDate), dayOffset));
        logHistory(projectId, `"${m.name}" due: ${oldDate} → ${m.dueDate} (drag)`);
        saveData();
        renderAll();
        toast(`Moved to ${m.dueDate}`, 'success');
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  // Task bars: drag to move (whole), or drag handles to resize
  $$('.bar.task-bar.draggable').forEach(el => {
    const projectId = el.dataset.projectId;
    const milestoneId = el.dataset.milestoneId;
    const taskId = el.dataset.taskId;

    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const handle = e.target.closest('.resize-handle');
      const resizeMode = handle ? handle.dataset.resize : null; // 'start' | 'end' | null
      e.preventDefault();
      e.stopPropagation();

      const t = getTask(projectId, milestoneId, taskId);
      if (!t || !t.start || !t.end) return;
      const startMouseX = e.clientX;
      const origStart = t.start;
      const origEnd = t.end;
      const origLeft = parseFloat(el.style.left);
      const origWidth = parseFloat(el.style.width);
      let dragged = false;

      const onMove = (ev) => {
        const dx = ev.clientX - startMouseX;
        if (Math.abs(dx) < DRAG_THRESHOLD && !dragged) return;
        dragged = true;
        el.classList.add('dragging');
        const dayOffset = Math.round(dx / dayWidth);
        let newStartDate = parseDate(origStart);
        let newEndDate = parseDate(origEnd);
        if (resizeMode === 'start') {
          newStartDate = addDays(newStartDate, dayOffset);
          if (newStartDate >= newEndDate) newStartDate = addDays(newEndDate, -1);
          el.style.left = (origLeft + Math.max(dayOffset, daysBetween(parseDate(origEnd), addDays(parseDate(origEnd), -1))) * dayWidth) + 'px';
          // recompute properly
          const offsetFromMin = daysBetween(min, newStartDate);
          el.style.left = (offsetFromMin * dayWidth) + 'px';
          el.style.width = ((daysBetween(newStartDate, newEndDate) + 1) * dayWidth) + 'px';
        } else if (resizeMode === 'end') {
          newEndDate = addDays(newEndDate, dayOffset);
          if (newEndDate <= newStartDate) newEndDate = addDays(newStartDate, 1);
          el.style.width = ((daysBetween(newStartDate, newEndDate) + 1) * dayWidth) + 'px';
        } else {
          // move whole
          newStartDate = addDays(newStartDate, dayOffset);
          newEndDate = addDays(newEndDate, dayOffset);
          el.style.left = (origLeft + dayOffset * dayWidth) + 'px';
        }
        let tt = $('#activeTooltip');
        if (!tt) {
          tt = document.createElement('div');
          tt.className = 'tooltip';
          tt.id = 'activeTooltip';
          $('#tooltipRoot').appendChild(tt);
        }
        tt.innerHTML = `<div class="tt-title">${escapeHtml(t.name || 'Task')}</div><div class="tt-meta">${fmtDate(newStartDate)} → ${fmtDate(newEndDate)}</div>`;
        moveTooltip(ev);
      };
      const onUp = (ev) => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        el.classList.remove('dragging');
        hideTooltip();
        if (!dragged) {
          handleSelectClick({ type: 'task', projectId, milestoneId, taskId });
          return;
        }
        const dx = ev.clientX - startMouseX;
        const dayOffset = Math.round(dx / dayWidth);
        if (dayOffset === 0) { renderGantt(); return; }
        const taskLive = getTask(projectId, milestoneId, taskId);
        const m = getMilestone(projectId, milestoneId);
        let newStart = parseDate(origStart);
        let newEnd = parseDate(origEnd);
        if (resizeMode === 'start') {
          newStart = addDays(newStart, dayOffset);
          if (newStart >= newEnd) newStart = addDays(newEnd, -1);
        } else if (resizeMode === 'end') {
          newEnd = addDays(newEnd, dayOffset);
          if (newEnd <= newStart) newEnd = addDays(newStart, 1);
        } else {
          newStart = addDays(newStart, dayOffset);
          newEnd = addDays(newEnd, dayOffset);
        }
        taskLive.start = fmtDate(newStart);
        taskLive.end = fmtDate(newEnd);
        const verb = resizeMode ? `resize ${resizeMode}` : 'move';
        logHistory(projectId, `Task on "${m.name}" ${verb}: ${origStart}→${origEnd} ⇒ ${taskLive.start}→${taskLive.end}`);
        saveData();
        renderAll();
        toast(`Task: ${taskLive.start} → ${taskLive.end}`, 'success');
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function renderProjectDetail(pid) {
  const p = getProject(pid);
  if (!p) return '';
  const eff = getEffective('project', { projectId: pid });
  const statusOpts = STATE.data.statuses.map(s =>
    `<option value="${s.id}" ${s.id === eff.statusId ? 'selected' : ''}>${escapeHtml(s.name)}</option>`
  ).join('');

    `<option value="${e.id}" ${e.id === eff.managerId ? 'selected' : ''}>${escapeHtml(e.name)} (${e.role})</option>`
  ).join('');

  const milestonesHtml = (p.milestones || []).map(m => {
    const cat = getCategory(m.categoryId);
    const urg = urgencyClass(m.dueDate);
    let urgStyle = '';
    if (urg === 'urgent' || urg === 'overdue') urgStyle = 'color:var(--danger)';
    else if (urg === 'soon') urgStyle = 'color:var(--warn)';
    return `
      <div class="child-item" data-action="open-milestone" data-milestone-id="${m.id}">
        <span class="child-item-name">${cat ? `<span style="color:${cat.color}; font-size:10px; margin-right:4px;">${escapeHtml(cat.name)}</span>` : ''}◆ ${escapeHtml(m.name)}</span>
        <span class="child-item-date" style="${urgStyle}">${m.dueDate ? formatShortDate(m.dueDate) : '—'}</span>
      </div>`;
  }).join('') || '<div style="color:var(--text-faint); font-size:11px;">No milestones yet</div>';

  const createdBy = p.createdBy ? getEngineer(p.createdBy) : null;

          ${(() => {

            const all = [...seen].map(k => {
              return STATE.data.projects.find(p => (p.client || '').toLowerCase() === k)?.client || k;

            return all.map(c => `<option value="${escapeHtml(c)}">`).join('');

function attachDetailEvents() {
  const panel = $('#detailPanel');

  panel.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', () => handleDetailAction(el.dataset.action, el));
  });

  panel.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('input', () => stageEdit(el.dataset.edit, el.value));
    el.addEventListener('change', () => stageEdit(el.dataset.edit, el.value));
  });

  const aa = panel.querySelector('[data-action="add-assignee"]');
  if (aa) aa.addEventListener('change', () => {
    if (aa.value) {
      const eff = getEffective('milestone', STATE.selectedItem);
      const newIds = [...(eff.assigneeIds || []), aa.value];
      stageEdit('assigneeIds', newIds);
      renderDetailPanel();
    }
  });
}

function stageEdit(field, value) {
  if (!STATE.dirtySelected) STATE.dirtySelected = {};
  STATE.dirtySelected[field] = value;
  const btn = $('[data-action="apply"]');
  const dbtn = $('[data-action="discard"]');
  if (btn) {
    btn.disabled = false;
    btn.classList.remove('primary');
    btn.classList.add('dirty');
    btn.textContent = '● Save Changes';
  }
  if (dbtn) dbtn.disabled = false;
  const sub = $('.detail-subtitle');
  if (sub && !sub.querySelector('.dirty-indicator')) {
    sub.insertAdjacentHTML('beforeend', ' <span class="dirty-indicator" title="Unsaved changes"></span>');
  }
}

async function handleDetailAction(action, el) {
  if (!STATE.selectedItem) return;
  const { type, projectId, milestoneId, taskId } = STATE.selectedItem;

  if (action === 'apply') { applyEdits(); return; }
  if (action === 'discard') { discardEdits(); renderDetailPanel(); return; }
  if (action === 'close-detail') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = null;
    renderAll();
    return;
  }
  if (action === 'back-to-project') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'project', projectId };
    renderAll();
    return;
  }
  if (action === 'back-to-milestone') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId };
    renderAll();
    return;
  }
  if (action === 'open-milestone') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId: el.dataset.milestoneId };
    renderAll();
    return;
  }
  if (action === 'open-task') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: el.dataset.taskId };
    renderAll();
    return;
  }
  // Copy actions — prompt for include-children where applicable, then
  // stash on the clipboard. Paste happens via the floating Paste banner
  // or context menu (rendered in the relevant detail panels).
  if (action === 'copy-project') {
    const p = getProject(projectId);
    if (!p) return;
    await copyWithPrompt('project', p);
    renderAll();
    return;
  }
  if (action === 'copy-milestone') {
    const m = getMilestone(projectId, milestoneId);
    if (!m) return;
    await copyWithPrompt('milestone', m);
    renderAll();
    return;
  }
  if (action === 'copy-task') {
    const m = getMilestone(projectId, milestoneId);
    if (!m) return;
    const t = (m.tasks || []).find(x => x.id === taskId);
    if (!t) return;
    await copyWithPrompt('task', t);
    renderAll();
    return;
  }
  if (action === 'paste-project') {
    const newId = pasteProject();
    if (newId) {
      STATE.selectedItem = { type: 'project', projectId: newId };
      renderAll();
    }
    return;
  }
  if (action === 'paste-milestone') {
    const newId = pasteMilestoneInto(projectId);
    if (newId) {
      STATE.selectedItem = { type: 'milestone', projectId, milestoneId: newId };
      renderAll();
    }
    return;
  }
  if (action === 'paste-task') {
    const newId = pasteTaskInto(projectId, milestoneId);
    if (newId) {
      STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: newId };
      renderAll();
    }
    return;
  }

  if (action === 'add-milestone') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    const p = getProject(projectId);
    const newM = { id: uid('m'), name: 'New Milestone', categoryId: '', statusId: 'st_notstarted', dueDate: '', assigneeIds: [], tasks: [], notes: '', visibility: 'shared', createdBy: STATE.data.currentUserId || '' };
    if (!p.milestones) p.milestones = [];
    p.milestones.push(newM);
    logHistory(projectId, `Added milestone "${newM.name}"`);
    saveData();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId: newM.id };
    renderAll();
    return;
  }
  if (action === 'add-task') {
    if (!maybeConfirmDiscard()) return;
    discardEdits();
    const m = getMilestone(projectId, milestoneId);
    const newT = { id: uid('t'), name: '', assigneeId: '', start: todayStr(), end: m.dueDate || todayStr(), statusId: 'st_notstarted' };
    if (!m.tasks) m.tasks = [];
    m.tasks.push(newT);
    logHistory(projectId, `Added task to "${m.name}"`);
    saveData();
    STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: newT.id };
    renderAll();
    return;
  }
  if (action === 'remove-assignee') {
    const engId = el.dataset.engId;
    const eff = getEffective('milestone', STATE.selectedItem);
    const newIds = (eff.assigneeIds || []).filter(i => i !== engId);
    stageEdit('assigneeIds', newIds);
    renderDetailPanel();
    return;
  }
  if (action === 'delete-project') {
    const p = getProject(projectId);
    if (!p) return;
    if (!canDeleteProject(p, true)) return;
    const milestoneCount = (p.milestones || []).length;
    const taskCount = (p.milestones || []).reduce((n, m) => n + (m.tasks || []).length, 0);
    const detail = milestoneCount > 0
      ? ` Includes ${milestoneCount} milestone${milestoneCount === 1 ? '' : 's'}${taskCount > 0 ? ` and ${taskCount} task${taskCount === 1 ? '' : 's'}` : ''}.`
      : '';
    const ok = await showConfirm(
      `Move "${p.name}" to Trash?${detail}\n\nIt can be restored from Settings → Trash for ${TRASH_DAYS} days.`,
      { title: 'Delete Project', confirmLabel: 'Move to Trash' }
    );
    if (!ok) return;
    captureUndo(`delete project "${p.name}"`, { type: 'projectsList' });
    moveToTrash('project', p, { projectId: p.id, projectName: p.name });
    STATE.data.projects = STATE.data.projects.filter(x => x.id !== projectId);
    discardEdits();
    saveData();
    STATE.selectedItem = null;
    renderAll();
    toast(`Moved "${p.name}" to Trash. Cmd/Ctrl+Z to undo.`, 'success');
    return;
  }
  if (action === 'delete-milestone') {
    const p = getProject(projectId);
    const m = getMilestone(projectId, milestoneId);
    if (!p || !m) return;
    if (!canDeleteMilestone(p, m, true)) return;
    const taskCount = (m.tasks || []).length;
    const detail = taskCount > 0 ? ` Includes ${taskCount} task${taskCount === 1 ? '' : 's'}.` : '';
    const ok = await showConfirm(
      `Move milestone "${m.name}" to Trash?${detail}\n\nIt can be restored for ${TRASH_DAYS} days.`,
      { title: 'Delete Milestone', confirmLabel: 'Move to Trash' }
    );
    if (!ok) return;
    captureUndo(`delete milestone "${m.name}"`, { type: 'milestonesList', projectId: p.id });
    moveToTrash('milestone', m, { projectId: p.id, projectName: p.name, milestoneId: m.id, milestoneName: m.name });
    p.milestones = p.milestones.filter(x => x.id !== milestoneId);
    logHistory(projectId, `Deleted milestone "${m.name}"`);
    discardEdits();
    saveData();
    STATE.selectedItem = { type: 'project', projectId };
    renderAll();
    toast(`Moved "${m.name}" to Trash.`, 'success');
    return;
  }
  if (action === 'delete-task') {
    const p = getProject(projectId);
    const m = getMilestone(projectId, milestoneId);
    if (!p || !m) {
      console.warn('[delete-task] project or milestone not found', { projectId, milestoneId });
      return;
    }
    const t = (m.tasks || []).find(x => x.id === taskId);
    if (!t) {
      console.warn('[delete-task] task not found in milestone', { taskId, milestoneId });
      return;
    }
    if (!canDeleteTask(p, m, t, true)) {
      console.warn('[delete-task] permission denied', { me: STATE.data.currentUserId, projectCreatedBy: p.createdBy, managerId: p.managerId, msCreatedBy: m.createdBy, taskAssigneeId: t.assigneeId });
      return;
    }
    const ok = await showConfirm(
      `Move task to Trash?\n\nIt can be restored for ${TRASH_DAYS} days.`,
      { title: 'Delete Task', confirmLabel: 'Move to Trash' }
    );
    if (!ok) {
      console.log('[delete-task] user cancelled');
      return;
    }
    captureUndo(`delete task`, { type: 'tasksList', projectId, milestoneId });
    moveToTrash('task', t, { projectId, projectName: p.name, milestoneId, milestoneName: m.name });
    m.tasks = m.tasks.filter(x => x.id !== taskId);
    logHistory(projectId, `Deleted a task from "${m.name}"`);
    discardEdits();
    saveData();
    STATE.selectedItem = { type: 'milestone', projectId, milestoneId };
    renderAll();
    toast('Moved to Trash.', 'success');
    return;
  }
}

/* ============== CALENDAR (scrollable, multi-month) ============== */
function renderCalendar() {
  const view = $('#calendarView');

  // Preserve current scroll position so toggling Milestones/Tasks checkboxes doesn't jump us.
  // EXCEPT on first render of the calendar this session — then we want to
  // anchor on today (handled in setView via scrollCalendarToToday).
  const prevScroll = $('#calScrollWrap');
  const prevScrollTop = (prevScroll && STATE._calendarSeen) ? prevScroll.scrollTop : null;
  STATE._calendarSeen = true;

  const events = collectCalendarEvents();
  const eventsByDate = {};
  for (const e of events) {
    if (!eventsByDate[e.date]) eventsByDate[e.date] = [];
    eventsByDate[e.date].push(e);
  }
  for (const k in eventsByDate) {
    eventsByDate[k].sort((a, b) => (a.kind === 'milestone' ? 0 : 1) - (b.kind === 'milestone' ? 0 : 1));
  }

  // Determine month range: from today - 1 month to last event date + 2 months, min 12 months total
  const t = today();
  let startMonth = new Date(t.getFullYear(), t.getMonth() - 1, 1);
  let endMonth = new Date(t.getFullYear(), t.getMonth() + 11, 1);
  for (const e of events) {
    const d = parseDate(e.date);
    if (d) {
      const dm = new Date(d.getFullYear(), d.getMonth(), 1);
      if (dm < startMonth) startMonth = dm;
      if (dm > endMonth) endMonth = dm;
    }
  }
  // pad end by 2 months
  endMonth = new Date(endMonth.getFullYear(), endMonth.getMonth() + 2, 1);

  let monthsHtml = '';
  let cur = new Date(startMonth);
  while (cur <= endMonth) {
    monthsHtml += renderCalMonth(cur.getFullYear(), cur.getMonth(), eventsByDate);
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }

  view.innerHTML = `
    <div class="cal-header">
      <h2 class="cal-title">Calendar</h2>
    </div>
    <div class="cal-scroll-wrap" id="calScrollWrap">
      ${monthsHtml}
    </div>
  `;

  view.querySelectorAll('.cal-event').forEach(el => {
    el.addEventListener('click', () => {
      handleSelectClick({
        type: el.dataset.type,
        projectId: el.dataset.projectId,
        milestoneId: el.dataset.milestoneId,
        taskId: el.dataset.taskId,
      });
    });
  });

  // Restore scroll position if we had one (after toggle re-render)
  if (prevScrollTop !== null) {
    const newScroll = $('#calScrollWrap');
    if (newScroll) newScroll.scrollTop = prevScrollTop;
  }
}

function renderCalMonth(year, month, eventsByDate) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const startOffset = firstDay.getDay();
  const totalDays = lastDay.getDate();
  const monthName = firstDay.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let cellsHtml = '';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(dow => {
    cellsHtml += `<div class="cal-dow-header">${dow}</div>`;
  });

  const prevLast = new Date(year, month, 0).getDate();
  for (let i = startOffset - 1; i >= 0; i--) {
    const d = prevLast - i;
    const date = new Date(year, month - 1, d);
    cellsHtml += renderCalDay(date, true, eventsByDate);
  }
  for (let d = 1; d <= totalDays; d++) {
    const date = new Date(year, month, d);
    cellsHtml += renderCalDay(date, false, eventsByDate);
  }
  const totalCells = startOffset + totalDays;
  const trailing = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= trailing; d++) {
    const date = new Date(year, month + 1, d);
    cellsHtml += renderCalDay(date, true, eventsByDate);
  }

  const isCurrent = (year === today().getFullYear() && month === today().getMonth());
  return `
    <div class="cal-month-section" data-year="${year}" data-month="${month}" ${isCurrent ? 'id="calCurrentMonth"' : ''}>
      <div class="cal-month-title">${monthName}</div>
      <div class="cal-grid">${cellsHtml}</div>
    </div>
  `;
}

function renderCalDay(date, otherMonth, eventsByDate) {
  const ds = fmtDate(date);
  const isToday = ds === todayStr();
  const isWknd = date.getDay() === 0 || date.getDay() === 6;
  const events = eventsByDate[ds] || [];
  const eventsHtml = events.map(e => {
    const isMilestone = e.kind !== 'task';
    const cls = isMilestone ? 'milestone' : 'task';
    // Milestone events use the user's chosen deadline color (set in
    // Settings, stored locally per browser). Tasks still use the
    // engineer/status color at low alpha so they sit quietly.
    const DEADLINE_BG = STATE.deadlineColors.bg;
    const DEADLINE_FG = STATE.deadlineColors.fg;
    const bg = isMilestone ? DEADLINE_BG : `${e.color}22`;
    const fg = isMilestone ? DEADLINE_FG : e.color;
    const borderColor = isMilestone ? DEADLINE_BG : e.color;
    return `<div class="cal-event ${cls}"
      data-type="${isMilestone ? 'milestone' : 'task'}"
      data-project-id="${e.projectId}"
      data-milestone-id="${e.milestoneId}"
      ${e.taskId ? `data-task-id="${e.taskId}"` : ''}
      style="background: ${bg}; border-left-color: ${borderColor}; color: ${fg};"
      title="${escapeHtml(e.tooltip)}">${escapeHtml(e.label)}</div>`;
  }).join('');
  return `
    <div class="cal-day ${otherMonth ? 'other-month' : ''} ${isToday ? 'today' : ''} ${isWknd && !otherMonth ? 'weekend' : ''}">
      <div class="cal-day-num">${date.getDate()}</div>
      <div class="cal-events">${eventsHtml}</div>
    </div>
  `;
}

function collectCalendarEvents() {
  const events = [];
  for (const p of STATE.data.projects) {
    if (!projectPassesFilters(p)) continue;
    const mgr = getEngineer(p.managerId);
    // [Manager] tag replaces the old [Category] tag — managers are more useful
    // at a glance for office staffing/workload context.
    const mgrTag = mgr ? `[${abbreviateName(mgr.name)}] ` : '';
    // Project number prefix (e.g. "#24-105 Project Name")
    const projLabel = (p.number ? `${p.number} ` : '') + p.name;

    for (const m of (p.milestones || [])) {
      if (!milestonePassesFilters(m)) continue;
      const cat = getCategory(m.categoryId);

      if (STATE.showMilestones && m.dueDate) {
        const color = getColorFor(m, 'milestone');
        const engNames = (m.assigneeIds || []).map(id => { const e = getEngineer(id); return e ? abbreviateName(e.name) : ''; }).filter(Boolean).join(', ');
        const engNamesFull = (m.assigneeIds || []).map(id => { const e = getEngineer(id); return e ? e.name : ''; }).filter(Boolean).join(', ');
        const label = `${projLabel} — ${mgrTag}${m.name}${engNames ? ' (' + engNames + ')' : ''}`;
        const tooltip = `${projLabel}\n${mgr ? 'Manager: ' + mgr.name + '\n' : ''}${cat ? cat.name + ' · ' : ''}${m.name}\nDue: ${m.dueDate}${engNamesFull ? '\nAssignees: ' + engNamesFull : ''}`;
        events.push({
          date: m.dueDate, kind: 'milestone', label, tooltip, color,
          projectId: p.id, milestoneId: m.id,
        });
      }
      if (STATE.showTasks) {
        for (const tk of (m.tasks || [])) {
          if (!tk.start || !tk.end) continue;
          if (!taskPassesFilters(tk)) continue;
          const start = parseDate(tk.start);
          const end = parseDate(tk.end);
          const days = daysBetween(start, end);
          const eng = getEngineer(tk.assigneeId);
          const color = getEngineerColor(eng);
          const engLabel = eng ? abbreviateName(eng.name) : 'Unassigned';
          const engLabelFull = eng ? eng.name : 'Unassigned';
          const taskLabel = tk.name || engLabel;
          const label = `${projLabel} — ${mgrTag}${m.name} · ${taskLabel}${eng && tk.name ? ' (' + engLabel + ')' : ''}`;
          const tooltip = `${projLabel}\n${mgr ? 'Manager: ' + mgr.name + '\n' : ''}${cat ? cat.name + ' · ' : ''}${m.name}\nTask: ${taskLabel}\n${engLabelFull}\n${tk.start} – ${tk.end}`;
          for (let i = 0; i <= days; i++) {
            const d = addDays(start, i);
            events.push({
              date: fmtDate(d), kind: 'task', label, tooltip, color,
              projectId: p.id, milestoneId: m.id, taskId: tk.id,
            });
          }
        }
      }
    }
  }
  return events;
}

function scrollCalendarToToday() {
  const wrap = $('#calScrollWrap');
  if (!wrap) return;
  // Prefer the actual today cell so the row containing today is centered;
  // fall back to the month section if the cell isn't found (e.g. clipped).
  const todayCell = wrap.querySelector('.cal-day.today');
  const monthSection = wrap.querySelector('#calCurrentMonth');
  if (todayCell) {
    // Center today in the viewport rather than scrolling it to the top, so
    // the user can see surrounding days (week before / week after).
    const viewportH = wrap.clientHeight;
    const target = todayCell.offsetTop - (viewportH / 2) + (todayCell.offsetHeight / 2);
    wrap.scrollTop = Math.max(0, target);
  } else if (monthSection) {
    wrap.scrollTop = monthSection.offsetTop - 10;
  }
}

/* ============== MY WORK VIEW ============== */
function renderMyWork() {
  const view = $('#myworkView');
  // Populate the user selector
  const selector = $('#myworkUser');
  if (selector) {
    const currentVal = selector.value || STATE.data.currentUserId || (STATE.data.engineers[0]?.id || '');
    const opts = STATE.data.engineers.map(e =>
      `<option value="${e.id}" ${e.id === currentVal ? 'selected' : ''}>${escapeHtml(e.name)} (${e.role})</option>`
    ).join('');
    selector.innerHTML = opts || '<option>No team members</option>';
  }

  const userId = ($('#myworkUser')?.value) || STATE.data.currentUserId || (STATE.data.engineers[0]?.id || '');
  const eng = getEngineer(userId);

  if (!eng) {
    view.innerHTML = `<div class="empty-state">
      <h2>No team members yet</h2>
      <p>Add team members in Settings, then come back to see "My Work".</p>
      <button class="btn primary" onclick="openSettings()">⚙ Open Settings</button>
    </div>`;
    return;
  }

  // Collect milestones relevant to this user. A milestone is relevant if:
  //   • the user is directly assigned to it (in assigneeIds), OR
  //   • the user is assigned to one of its tasks, OR
  //   • the user is the project's manager (so PMs can see what they oversee).
  const items = [];
  for (const p of STATE.data.projects) {
    const isManager = p.managerId === userId;
    for (const m of (p.milestones || [])) {
      const assigned = (m.assigneeIds || []).includes(userId);
      const hasTask = (m.tasks || []).some(t => t.assigneeId === userId);
      if (!assigned && !hasTask && !isManager) continue;
      const st = getStatus(m.statusId);
      if (st.isCompleted) continue; // hide completed
      items.push({
        project: p,
        milestone: m,
        isManager,
        viaTask: !assigned && hasTask,
        viaManager: !assigned && !hasTask && isManager,
      });
    }
  }

  // Bucket by due date
  const t = today();
  const buckets = {
    overdue: [],
    thisWeek: [],
    next2Weeks: [],
    later: [],
    noDate: [],
  };
  for (const item of items) {
    const m = item.milestone;
    if (!m.dueDate) { buckets.noDate.push(item); continue; }
    const d = parseDate(m.dueDate);
    const days = daysBetween(t, d);
    if (days < 0) buckets.overdue.push(item);
    else if (days <= 7) buckets.thisWeek.push(item);
    else if (days <= 21) buckets.next2Weeks.push(item);
    else buckets.later.push(item);
  }
  // Sort each bucket by due date
  for (const k of Object.keys(buckets)) {
    buckets[k].sort((a, b) => (a.milestone.dueDate || '').localeCompare(b.milestone.dueDate || ''));
  }

  const renderBucket = (className, title, list, icon) => {
    if (list.length === 0) return '';
    const itemsHtml = list.map(it => {
      const m = it.milestone;
      const p = it.project;
      const cat = getCategory(m.categoryId);
      const st = getStatus(m.statusId);
      const urg = urgencyClass(m.dueDate);
      const dateLabel = m.dueDate ? formatShortDate(m.dueDate) : 'No date';
      const progress = (typeof m.progress === 'number') ? m.progress : 0;
      const roleTag = it.viaManager
        ? '<span style="color:var(--accent); font-size:9px; margin-left:4px;">⚑ MGR (oversee)</span>'
        : it.isManager
        ? '<span style="color:var(--accent); font-size:9px; margin-left:4px;">⚑ MGR</span>'
        : (it.viaTask ? '<span style="color:var(--text-faint); font-size:9px; margin-left:4px;">(task only)</span>' : '');
      return `
        <div class="mywork-item" data-project-id="${p.id}" data-milestone-id="${m.id}">
          <div class="mywork-item-date ${urg}">${escapeHtml(dateLabel)}</div>
          <div>
            <div class="mywork-item-title">
              ${cat ? `<span style="color:${cat.color}; font-size:10px; margin-right:6px;">${escapeHtml(cat.name)}</span>` : ''}
              ◆ ${escapeHtml(m.name)}${roleTag}
            </div>
            <div class="mywork-item-meta">
              ${p.number ? `<span class="proj-num">${escapeHtml(p.number)}</span>` : ''}
              <span class="proj-name">${escapeHtml(p.name)}</span>
              ${p.client ? `<span class="proj-client">· ${escapeHtml(p.client)}</span>` : ''}
            </div>
          </div>
          <div class="mywork-item-progress" title="Progress: ${progress}%">
            <div class="mywork-item-progress-fill" style="width:${progress}%; background:${cat ? cat.color : 'var(--accent)'};"></div>
          </div>
          <div class="mywork-item-status" style="color:${st.color}">${escapeHtml(st.name)}</div>
        </div>`;
    }).join('');
    return `
      <div class="mywork-section ${className}">
        <div class="mywork-section-title">
          <span>${icon} ${escapeHtml(title)}</span>
          <span class="mywork-section-count">${list.length}</span>
        </div>
        ${itemsHtml}
      </div>`;
  };

  const totalCount = items.length;
  const greeting = totalCount === 0
    ? `<div class="empty-state"><h2>🎉 All clear, ${escapeHtml(eng.name.split(' ')[0])}!</h2><p>No active milestones assigned to you.</p></div>`
    : `
        ${renderBucket('overdue', 'Overdue', buckets.overdue, '⚠')}
        ${renderBucket('this-week', 'Due This Week', buckets.thisWeek, '🔥')}
        ${renderBucket('next-2-weeks', 'Next 2 Weeks', buckets.next2Weeks, '📅')}
        ${renderBucket('later', 'Later', buckets.later, '🌱')}
        ${buckets.noDate.length ? renderBucket('later', 'No Due Date', buckets.noDate, '◇') : ''}
      `;

  view.innerHTML = `
    <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px;">
      <div>
        <h2 style="font-family: Georgia, serif; font-size: 22px; font-weight: 400;">
          <span style="color:${getEngineerColor(eng)}">${escapeHtml(eng.name)}</span>'s Work
        </h2>
        <div style="font-size: 11px; color: var(--text-faint); margin-top: 2px;">${totalCount} active milestone${totalCount === 1 ? '' : 's'}</div>
      </div>
    </div>
    <div class="mywork-scroll">
      ${greeting}
    </div>
  `;

  view.querySelectorAll('.mywork-item').forEach(el => {
    el.addEventListener('click', () => {
      handleSelectClick({
        type: 'milestone',
        projectId: el.dataset.projectId,
        milestoneId: el.dataset.milestoneId,
      });
    });
  });
}

/* ============== WORKLOAD VIEW ============== */
let WORKLOAD_ZOOM = 'day';

function workloadDayWidth() {
  return { day: 36, week: 14, month: 5 }[WORKLOAD_ZOOM];
}

function renderWorkload() {
  const view = $('#workloadView');
  const dayWidth = workloadDayWidth();

  // Sync threshold input
  const thrInput = $('#workloadThresholdInput');
  if (thrInput) thrInput.value = STATE.workloadThreshold;

  // Determine date range
  const t = today();
  let min = addDays(t, -7);
  let max = addDays(t, 60);
  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      for (const tk of (m.tasks || [])) {
        if (tk.start) { const d = parseDate(tk.start); if (d < min) min = d; }
        if (tk.end)   { const d = parseDate(tk.end);   if (d > max) max = d; }
      }
    }
  }
  // Align min to Monday
  const dow = min.getDay();
  min = addDays(min, dow === 0 ? -6 : 1 - dow);
  const totalDays = daysBetween(min, max) + 1;
  const timelineWidth = totalDays * dayWidth;

  if (STATE.data.engineers.length === 0) {
    view.innerHTML = `<div class="empty-state">
      <h2>No team members yet</h2>
      <p>Add team members in Settings to see workload.</p>
      <button class="btn primary" onclick="openSettings()">⚙ Open Settings</button>
    </div>`;
    return;
  }

  // Build per-engineer per-day count
  const engineers = STATE.data.engineers;
  const counts = {}; // counts[engId][dayIdx] = count
  for (const e of engineers) counts[e.id] = new Array(totalDays).fill(0);

  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      for (const tk of (m.tasks || [])) {
        if (!tk.start || !tk.end || !tk.assigneeId) continue;
        if (!counts[tk.assigneeId]) continue;
        const ts = parseDate(tk.start);
        const te = parseDate(tk.end);
        const startIdx = Math.max(0, daysBetween(min, ts));
        const endIdx = Math.min(totalDays - 1, daysBetween(min, te));
        for (let i = startIdx; i <= endIdx; i++) {
          counts[tk.assigneeId][i] += 1;
        }
      }
    }
  }

  // Render header
  let majorHtml = '';
  let minorHtml = '';
  if (WORKLOAD_ZOOM === 'day') {
    let curMonth = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getMonth() !== curMonth) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
          majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
        }
        curMonth = d.getMonth();
        monthStart = i;
      }
      const isWknd = d.getDay() === 0 || d.getDay() === 6;
      const isToday = fmtDate(d) === todayStr();
      minorHtml += `<div class="minor-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width:${dayWidth}px;">
        <span class="label-1">${d.getDate()}</span>
        <span class="label-2">${['S','M','T','W','T','F','S'][d.getDay()]}</span>
      </div>`;
    }
    const w = (totalDays - monthStart) * dayWidth;
    const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
  } else if (WORKLOAD_ZOOM === 'week') {
    let curMonth = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getMonth() !== curMonth) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
          majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
        }
        curMonth = d.getMonth();
        monthStart = i;
      }
      const isWknd = d.getDay() === 0 || d.getDay() === 6;
      const isToday = fmtDate(d) === todayStr();
      const showLabel = d.getDay() === 1;
      minorHtml += `<div class="minor-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width:${dayWidth}px;">
        ${showLabel ? `<span class="label-1">${d.getDate()}</span>` : ''}
      </div>`;
    }
    const w = (totalDays - monthStart) * dayWidth;
    const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
    majorHtml += `<div class="major-cell" style="width:${w}px;">${name}</div>`;
  } else {
    // month
    let curYear = -1, yearStart = 0;
    let curMonth = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getFullYear() !== curYear) {
        if (curYear !== -1) {
          const w = (i - yearStart) * dayWidth;
          majorHtml += `<div class="major-cell" style="width:${w}px;">${curYear}</div>`;
        }
        curYear = d.getFullYear();
        yearStart = i;
      }
      if (d.getMonth() !== curMonth) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const name = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short' });
          minorHtml += `<div class="minor-cell" style="width:${w}px;"><span class="label-1">${name}</span></div>`;
        }
        curMonth = d.getMonth();
        monthStart = i;
      }
    }
    const wY = (totalDays - yearStart) * dayWidth;
    majorHtml += `<div class="major-cell" style="width:${wY}px;">${curYear}</div>`;
    const wM = (totalDays - monthStart) * dayWidth;
    const nameM = addDays(min, monthStart).toLocaleDateString('en-US', { month: 'short' });
    minorHtml += `<div class="minor-cell" style="width:${wM}px;"><span class="label-1">${nameM}</span></div>`;
  }

  // Render rows: one per engineer (only those who have any tasks)
  const engsToShow = engineers.filter(e => counts[e.id].some(c => c > 0));
  let sideBodyHtml = '';
  let gridBodyHtml = '';

  if (engsToShow.length === 0) {
    sideBodyHtml = '';
    gridBodyHtml = '';
  } else {
    for (const e of engsToShow) {
      const totalTasks = counts[e.id].reduce((a, b) => a + b, 0);
      sideBodyHtml += `
        <div class="workload-row-name" data-eng-id="${e.id}">
          <span class="eng-dot" style="background:${getEngineerColor(e)}; width:10px; height:10px;"></span>
          <span style="color:${getEngineerColor(e)}">${escapeHtml(e.name)}</span>
          <span style="color:var(--text-faint); font-size:10px; margin-left:auto;">${totalTasks}d</span>
        </div>
      `;

      let cellsHtml = '';
      if (WORKLOAD_ZOOM === 'day') {
        for (let i = 0; i < totalDays; i++) {
          const d = addDays(min, i);
          const isWknd = d.getDay() === 0 || d.getDay() === 6;
          const isToday = fmtDate(d) === todayStr();
          const c = counts[e.id][i];
          const lvl = c >= STATE.workloadThreshold ? 'heavy' : (c >= Math.max(1, STATE.workloadThreshold - 1) ? 'medium' : '');
          cellsHtml += `<div class="workload-day-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width:${dayWidth}px;">
            ${c > 0 ? `<span class="workload-load ${lvl}">${c}</span>` : ''}
          </div>`;
        }
      } else if (WORKLOAD_ZOOM === 'week') {
        // Aggregate per week (max count in week)
        let i = 0;
        while (i < totalDays) {
          const d = addDays(min, i);
          // Find length of this "week" starting at i (until next Monday or end)
          let len = 1;
          while (i + len < totalDays) {
            const dd = addDays(min, i + len);
            if (dd.getDay() === 1) break;
            len++;
          }
          let maxC = 0;
          for (let j = i; j < i + len; j++) maxC = Math.max(maxC, counts[e.id][j]);
          const isToday = fmtDate(d) <= todayStr() && todayStr() < fmtDate(addDays(d, len));
          const lvl = maxC >= STATE.workloadThreshold ? 'heavy' : (maxC >= Math.max(1, STATE.workloadThreshold - 1) ? 'medium' : '');
          cellsHtml += `<div class="workload-day-cell ${isToday?'today':''}" style="width:${len * dayWidth}px;">
            ${maxC > 0 ? `<span class="workload-load ${lvl}">${maxC}</span>` : ''}
          </div>`;
          i += len;
        }
      } else {
        // month: max per month
        let i = 0;
        while (i < totalDays) {
          const d = addDays(min, i);
          const monthEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0);
          const lenInMonth = Math.min(daysBetween(d, monthEnd) + 1, totalDays - i);
          let maxC = 0;
          for (let j = i; j < i + lenInMonth; j++) maxC = Math.max(maxC, counts[e.id][j]);
          const tStr = todayStr();
          const isThisMonth = (d.getFullYear() === today().getFullYear() && d.getMonth() === today().getMonth());
          const lvl = maxC >= STATE.workloadThreshold ? 'heavy' : (maxC >= Math.max(1, STATE.workloadThreshold - 1) ? 'medium' : '');
          cellsHtml += `<div class="workload-day-cell ${isThisMonth?'today':''}" style="width:${lenInMonth * dayWidth}px;">
            ${maxC > 0 ? `<span class="workload-load ${lvl}">${maxC}</span>` : ''}
          </div>`;
          i += lenInMonth;
        }
      }
      gridBodyHtml += `<div class="workload-row" style="width:${timelineWidth}px;">${cellsHtml}</div>`;
    }
  }

  const todayOffset = daysBetween(min, today()) * dayWidth + dayWidth / 2;

  view.innerHTML = `
    <div class="workload-header">
      <div class="workload-side-header">Team Member</div>
      <div class="workload-timeline-header" id="workloadHeaderScroll">
        <div style="width:${timelineWidth}px;">
          <div class="timeline-row-major">${majorHtml}</div>
          <div class="timeline-row-minor">${minorHtml}</div>
        </div>
      </div>
    </div>
    <div class="workload-body">
      <div class="workload-side-body" id="workloadSideScroll">${sideBodyHtml || '<div class="empty-state" style="padding:20px;"><p style="font-size:11px;">No tasks scheduled.<br/>Assign tasks to team members in the Gantt view.</p></div>'}</div>
      <div class="workload-grid-wrap" id="workloadGridScroll">
        <div style="width:${timelineWidth}px; position:relative;">
          ${gridBodyHtml}
          <div class="today-line" style="left:${todayOffset}px; top:0; bottom:0;"></div>
        </div>
      </div>
    </div>
  `;

  // Sync scrolls
  const headerScroll = $('#workloadHeaderScroll');
  const sideScroll = $('#workloadSideScroll');
  const gridScroll = $('#workloadGridScroll');
  let syncing = false;
  if (gridScroll) {
    gridScroll.addEventListener('scroll', () => {
      if (syncing) return;
      syncing = true;
      if (headerScroll) headerScroll.scrollLeft = gridScroll.scrollLeft;
      if (sideScroll) sideScroll.scrollTop = gridScroll.scrollTop;
      syncing = false;
    });
  }
  if (sideScroll) {
    sideScroll.addEventListener('scroll', () => {
      if (syncing) return;
      syncing = true;
      if (gridScroll) gridScroll.scrollTop = sideScroll.scrollTop;
      syncing = false;
    });
  }

  // Click engineer name to filter Gantt by them (jump to gantt)
  view.querySelectorAll('.workload-row-name').forEach(el => {
    el.addEventListener('click', () => {
      const engId = el.dataset.engId;
      // Add an engineer filter and switch to gantt
      STATE.filters = STATE.filters.filter(f => f.type !== 'engineer');
      STATE.filters.push({ type: 'engineer', value: engId });
      setView('gantt');
    });
  });
}

function scrollWorkloadToToday() {
  const grid = $('#workloadGridScroll');
  if (!grid) return;
  const t = today();
  let min = addDays(t, -7);
  for (const p of STATE.data.projects) {
    for (const m of (p.milestones || [])) {
      for (const tk of (m.tasks || [])) {
        if (tk.start) { const d = parseDate(tk.start); if (d < min) min = d; }
      }
    }
  }
  const dow = min.getDay();
  min = addDays(min, dow === 0 ? -6 : 1 - dow);
  const offset = daysBetween(min, t) * workloadDayWidth();
  grid.scrollLeft = Math.max(0, offset - 40);
}

async function createProject() {
  // Re-check permission in case the modal was opened via some other path.
  if (!canCreateProject(true)) { closeModal(); return; }
  const name = $('#newProjName').value.trim();
  if (!name) { toast('Name required', 'error'); return; }
  const number = $('#newProjNumber').value.trim();
  const client = $('#newProjClient').value.trim();

  // Duplicate detection — warn if a project with the same number or the
  // same name already exists. Uses our own showConfirm modal instead of
  // native window.confirm, because Teams iframes (and other sandboxed
  // contexts without allow-modals) silently return false from
  // window.confirm — making the warning invisible to anyone using the
  // app inside Teams.
  const dupByNumber = number ? STATE.data.projects.find(p => (p.number || '').trim().toLowerCase() === number.toLowerCase()) : null;
  const dupByName = STATE.data.projects.find(p => p.name.trim().toLowerCase() === name.toLowerCase());
  if (dupByNumber || dupByName) {
    const dup = dupByNumber || dupByName;
    const reason = dupByNumber ? `project number "${number}"` : `project name "${name}"`;
    const owner = getEngineer(dup.createdBy) || getEngineer(dup.managerId);
    const ownerNote = owner ? ` (owned by ${owner.name})` : '';
    const ok = await showConfirm(
      `A project with the same ${reason} already exists${ownerNote}.\n\nCreate this one anyway?`,
      { title: 'Duplicate Project', confirmLabel: 'Create anyway', cancelLabel: 'Cancel', danger: false }
    );
    if (!ok) return;
  }

  // The creator is always the project manager — owners are inseparable from
  // creation per the team's policy. The Manager field in the modal is shown
  // for clarity but cannot deviate from the current user.
  const managerId = STATE.data.currentUserId;

  const now = new Date().toISOString();
  const creator = STATE.data.currentUserId ? getEngineer(STATE.data.currentUserId) : null;
  const project = {
    id: uid('p'),
    number, name, client, managerId,
    statusId: 'st_inprogress',
    expanded: true,
    milestones: [],
    createdAt: now,
    createdBy: STATE.data.currentUserId || null,
    history: [{
      id: uid('h'),
      timestamp: now,
      action: `Project created${managerId && getEngineer(managerId) ? ' (manager: ' + getEngineer(managerId).name + ')' : ''}`,
      by: creator ? creator.name : null,
    }],
  };
  STATE.data.projects.push(project);
  saveData();
  closeModal();
  STATE.selectedItem = { type: 'project', projectId: project.id };
  renderAll();
  toast('Project created', 'success');
}

function closeModal() {
  $('#modalRoot').innerHTML = '';

// Promise-based confirmation dialog using our own modal instead of native
// window.confirm(). Teams (and other sandboxed iframes that lack
// allow-modals) silently returns false from window.confirm, which made
// every delete action look broken to the user — no dialog appeared, and
// the delete just quietly didn't happen. This replaces that.
//
// Returns a Promise resolving to true (confirmed) or false (cancelled).
// Usage:
//   if (!(await showConfirm('Are you sure?'))) return;
//
// The dialog has a danger-styled confirm button by default. Pass
// opts.confirmLabel / opts.cancelLabel / opts.danger=false to customize.
function showConfirm(message, opts) {
  opts = opts || {};
  const confirmLabel = opts.confirmLabel || 'Confirm';
  const cancelLabel  = opts.cancelLabel  || 'Cancel';
  const danger       = opts.danger !== false;
  const title        = opts.title || 'Confirm';
  return new Promise((resolve) => {
    const html = `
      <div class="modal-content" style="max-width: 460px;">
        <h2 style="margin-bottom: 12px;">${escapeHtml(title)}</h2>
        <div style="font-size: 13px; color: var(--text-dim); line-height: 1.5; margin-bottom: 18px; white-space: pre-line;">${escapeHtml(message)}</div>
        <div style="display:flex; gap:8px; justify-content:flex-end;">
          <button class="btn" id="confirmCancel">${escapeHtml(cancelLabel)}</button>
          <button class="btn ${danger ? 'danger' : 'primary'}" id="confirmOk">${escapeHtml(confirmLabel)}</button>
        </div>
      </div>
    `;
    showModal(html);
    let settled = false;
    const finish = (value) => {
      if (settled) return;
      settled = true;
      // If our modal is still up, close it. Other close paths (Esc, ×)
      // will have already cleared modalRoot and we just resolve.
      const root = $('#modalRoot');
      if (root && root.querySelector('#confirmOk')) closeModal();
      resolve(value);
    };
    $('#confirmCancel')?.addEventListener('click', () => finish(false));
    $('#confirmOk')?.addEventListener('click', () => finish(true));
    // Watch the modal root: if any external code closes it (Esc, × button,
    // navigation, etc), treat as cancel.
    const root = $('#modalRoot');
    if (root) {
      const obs = new MutationObserver(() => {
        if (!root.querySelector('#confirmOk')) {
          obs.disconnect();
          finish(false);
        }
      });
      obs.observe(root, { childList: true, subtree: true });
    }
    setTimeout(() => $('#confirmCancel')?.focus(), 30);
  });
}

// Mount a modal's HTML into the modal root container. Pairs with closeModal.
// If the HTML is just the inner content (no .modal-overlay wrapper), we wrap
// it so the dark backdrop / centered fixed positioning kicks in correctly.
// Also injects a close × button into every modal-content so users can
// dismiss without hunting for an explicit Cancel — Esc still works too.
function showModal(html) {
  const wrapped = html.trim().startsWith('<div class="modal-overlay"')
    ? html
    : `<div class="modal-overlay">${html}</div>`;
  $('#modalRoot').innerHTML = wrapped;
  // Inject × buttons into any modal-content that doesn't already have one
  document.querySelectorAll('#modalRoot .modal-content').forEach(content => {
    if (content.querySelector('.modal-close-x')) return;
    // Make sure the content is a positioning context so the absolute X anchors correctly
    if (getComputedStyle(content).position === 'static') content.style.position = 'relative';
    const x = document.createElement('button');
    x.type = 'button';
    x.className = 'modal-close-x';
    x.innerHTML = '×';
    x.title = 'Close (Esc)';
    x.setAttribute('aria-label', 'Close');
    x.addEventListener('click', closeModal);
    content.appendChild(x);
  });
}

// If we have a deferred Firestore snapshot waiting and the user has fully
// stopped interacting, apply it now. Used after popup/modal close and on
// blur. Wrapped in setTimeout so any focus that's transferring (e.g. closing
// a popup that puts focus back into a parent input) settles first.
function flushPendingSnapshotIfIdle() {
  if (!STATE._pendingSnapshot && !STATE._pendingUserPrefs) return;
  setTimeout(() => {
    if (isUserActivelyTyping()) return;
    if (STATE._pendingSnapshot) {
      const snap = STATE._pendingSnapshot;
      STATE._pendingSnapshot = null;
      applyIncomingSnapshot(snap);
    }
    if (STATE._pendingUserPrefs) {
      const p = STATE._pendingUserPrefs;
      STATE._pendingUserPrefs = null;
      applyUserPrefsPayload(p);
      applyViewToDom(STATE.view || 'gantt');
      renderAll();
    }
  }, 50);
}

// Print dialog: pick paper size + which view, then print using a CSS @page rule.
// Force a hard reload of the page from the server, busting browser cache.
// Useful in Teams where the iframe holds onto an older version of the HTML
// and isn't easily refreshable. Adds a cache-busting query param so the CDN
// definitely re-fetches the file.
function forceRefreshFromServer() {
  const url = new URL(window.location.href);
  // Drop any existing _v= cache buster, then add a fresh one
  url.searchParams.delete('_v');
  url.searchParams.set('_v', Date.now().toString(36));
  // Replace (not push) so the user's back button doesn't end up here
  window.location.replace(url.toString());
}

  showModal(html);

  // Read all options from the form
  const readOptions = () => ({
    paper: document.querySelector('input[name="paperSize"]:checked').value,
    orient: document.querySelector('input[name="orientation"]:checked').value,
    scope: $('#printScope').value,
    scale: parseInt($('#printScale').value, 10) / 100,
    barWidth: parseInt($('#printBarWidth').value, 10) / 100,
    cols: Array.from(document.querySelectorAll('input[type="checkbox"][data-col]:checked')).map(el => el.dataset.col),
    incMilestoneRows: $('#incMilestoneRows').checked,
    incToday: $('#incToday').checked,
    todayPos: $('#printTodayPos').value,
  });

  // Live preview update — rebuild the print HTML and inject into the
  // preview iframe. The iframe size is the actual page ratio scaled to
  // fit the preview pane.

  // Visual preview zoom — user controls the apparent paper size in the
  // preview pane. Saved as a multiplier so 100% means a sensible default
  // DPI (56), 200% doubles it (closer to actual size), 20% lets the user
  // see large Tabloid-portrait layouts in full.
  let userPreviewZoom = 1.0;

  const updatePreview = () => {
    if (previewUpdateScheduled) return;
