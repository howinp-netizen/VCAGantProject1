}

/* ============== DIRTY EDITS ============== */
function getEffective(type, ids) {
  let live;
  if (type === 'project') live = getProject(ids.projectId);
  else if (type === 'milestone') live = getMilestone(ids.projectId, ids.milestoneId);
  else if (type === 'task') live = getTask(ids.projectId, ids.milestoneId, ids.taskId);
  if (!live) return null;
  if (!STATE.dirtySelected) return live;
  if (!STATE.selectedItem) return live;
  if (STATE.selectedItem.type !== type) return live;
  if (STATE.selectedItem.projectId !== ids.projectId) return live;
  if (type === 'project') return { ...live, ...STATE.dirtySelected };
  if (STATE.selectedItem.milestoneId !== ids.milestoneId) return live;
  if (type === 'milestone') return { ...live, ...STATE.dirtySelected };
  if (type === 'task' && STATE.selectedItem.taskId === ids.taskId) {
    return { ...live, ...STATE.dirtySelected };
  }
  return live;
}

function isDirty() { return STATE.dirtySelected !== null && Object.keys(STATE.dirtySelected).length > 0; }
function maybeConfirmDiscard() {
  if (!isDirty()) return true;
  return confirm('You have unsaved changes. Discard them?');
}
function discardEdits() { STATE.dirtySelected = null; }

function applyEdits() {
  if (!STATE.dirtySelected || !STATE.selectedItem) return;
  const { type, projectId, milestoneId, taskId } = STATE.selectedItem;
  const edits = STATE.dirtySelected;

  if (type === 'project') {
    const p = getProject(projectId);
    for (const k of Object.keys(edits)) {
      const old = p[k];
      const v = edits[k];
      if (old !== v) {
        if (k === 'statusId') logHistory(projectId, `Project status: ${getStatus(old).name} → ${getStatus(v).name}`);
        else if (k === 'managerId') {
          const oldM = getEngineer(old);
          const newM = getEngineer(v);
          logHistory(projectId, `Manager: ${oldM ? oldM.name : '(none)'} → ${newM ? newM.name : '(none)'}`);
        }
        else if (k === 'notes') {
          // Notes can be long — log a compact "updated" record instead of
          // dumping the whole before/after text into history.
          const hadBefore = !!(old && String(old).trim());
          const hasNow = !!(v && String(v).trim());
          if (!hadBefore && hasNow) logHistory(projectId, `Added project notes`);
          else if (hadBefore && !hasNow) logHistory(projectId, `Cleared project notes`);
          else logHistory(projectId, `Updated project notes`);
        }
        else logHistory(projectId, `Project ${k}: "${old || ''}" → "${v}"`);
        p[k] = v;
      }
    }
  } else if (type === 'milestone') {
    const m = getMilestone(projectId, milestoneId);
    for (const k of Object.keys(edits)) {
      const old = m[k];
      const v = edits[k];
      if (k === 'assigneeIds') {
        const oldSet = new Set(old || []);
        const newSet = new Set(v || []);
        const added = (v || []).filter(x => !oldSet.has(x));
        const removed = (old || []).filter(x => !newSet.has(x));
        for (const id of added) {
          const eng = getEngineer(id);
          logHistory(projectId, `Assigned ${eng ? eng.name : '?'} to "${m.name}"`);
        }
        for (const id of removed) {
          const eng = getEngineer(id);
          logHistory(projectId, `Removed ${eng ? eng.name : '?'} from "${m.name}"`);
        }
        m[k] = v;
      } else if (old !== v) {
        if (k === 'progress') {
          const newNum = parseInt(v) || 0;
          if (newNum === old) continue;
          logHistory(projectId, `"${m.name}" progress: ${old || 0}% → ${newNum}%`);
          m[k] = newNum;
          continue;
        }
        if (k === 'statusId') logHistory(projectId, `"${m.name}" status: ${getStatus(old).name} → ${getStatus(v).name}`);
        else if (k === 'dueDate') logHistory(projectId, `"${m.name}" due: ${old || '(none)'} → ${v || '(none)'}`);
        else if (k === 'categoryId') {
          const oc = getCategory(old); const nc = getCategory(v);
          logHistory(projectId, `"${m.name}" category: ${oc ? oc.name : '(none)'} → ${nc ? nc.name : '(none)'}`);
        }
        else logHistory(projectId, `"${m.name}" ${k} updated`);
        m[k] = v;
      }
    }
  } else if (type === 'task') {
    const m = getMilestone(projectId, milestoneId);
    const t = m.tasks.find(x => x.id === taskId);
    for (const k of Object.keys(edits)) {
      const old = t[k];
      const v = edits[k];
      if (old !== v) {
        if (k === 'assigneeId') {
          const oldEng = getEngineer(old);
          const newEng = getEngineer(v);
          logHistory(projectId, `Task on "${m.name}" assignee: ${oldEng ? oldEng.name : '(none)'} → ${newEng ? newEng.name : '(none)'}`);
        } else if (k === 'notes') {
          const taskLabel = t.name || '(unnamed task)';
          const hadBefore = !!(old && String(old).trim());
          const hasNow = !!(v && String(v).trim());
          if (!hadBefore && hasNow) logHistory(projectId, `Added notes to task "${taskLabel}"`);
          else if (hadBefore && !hasNow) logHistory(projectId, `Cleared notes on task "${taskLabel}"`);
          else logHistory(projectId, `Updated notes on task "${taskLabel}"`);
        } else {
          logHistory(projectId, `Task on "${m.name}" ${k}: ${old || ''} → ${v || ''}`);
        }
        t[k] = v;
      }
    }
  }

  STATE.dirtySelected = null;
  saveData();
  toast('Saved', 'success');
  renderAll();
}

/* ============== SEARCH ============== */
function performSearch(q) {
  STATE.searchQuery = q.trim();
  const results = $('#searchResults');
  if (!STATE.searchQuery) {
    results.classList.remove('show');
    results.innerHTML = '';
    renderAll();
    return;
  }
  const ql = STATE.searchQuery.toLowerCase();
  const found = [];
  for (const p of STATE.data.projects) {
    if (p.name.toLowerCase().includes(ql) || (p.client || '').toLowerCase().includes(ql) || (p.number || '').toLowerCase().includes(ql)) {
      const mgr = getEngineer(p.managerId);
      found.push({
        type: 'project',
        projectId: p.id,
        title: (p.number ? `${p.number} · ` : '') + p.name,
        meta: `${p.client || 'No client'}${mgr ? ' · Manager: ' + mgr.name : ''}`,
      });
    }
    for (const m of (p.milestones || [])) {
      if (m.name.toLowerCase().includes(ql)) {
        const cat = getCategory(m.categoryId);
        found.push({
          type: 'milestone',
          projectId: p.id, milestoneId: m.id,
          title: `◆ ${m.name}`,
          meta: `${p.name}${cat ? ' · ' + cat.name : ''}${m.dueDate ? ' · Due ' + m.dueDate : ''}`,
        });
      }
    }
  }
  if (found.length === 0) {
    results.innerHTML = `<div class="search-result-empty">No results for "${escapeHtml(STATE.searchQuery)}"</div>`;
  } else {
    results.innerHTML = found.slice(0, 30).map(r => `
      <div class="search-result-item" data-type="${r.type}" data-project-id="${r.projectId}" ${r.milestoneId ? `data-milestone-id="${r.milestoneId}"` : ''}>
        <div class="sr-name">${escapeHtml(r.title)}</div>
        <div class="sr-meta">${escapeHtml(r.meta)}</div>
      </div>
    `).join('');
    results.querySelectorAll('.search-result-item').forEach(el => {
      el.addEventListener('click', () => {
        const item = {
          type: el.dataset.type,
          projectId: el.dataset.projectId,
        };
        if (el.dataset.milestoneId) item.milestoneId = el.dataset.milestoneId;
        handleSelectClick(item);
        results.classList.remove('show');
        $('#searchInput').value = '';
        STATE.searchQuery = '';
        // also expand the project in gantt
        const p = getProject(item.projectId);
        if (p) p.expanded = true;
        renderAll();
        // scroll to milestone in gantt
        if (item.milestoneId) {
          setTimeout(() => scrollMilestoneIntoView(item), 100);
        }
      });
    });
  }
  results.classList.add('show');
  renderAll();
}

function scrollMilestoneIntoView(item) {
  const m = getMilestone(item.projectId, item.milestoneId);
  if (!m || !m.dueDate) return;
  const grid = $('#ganttGridScroll');
  if (!grid) return;
  const { min } = getOverallDateRange();
  const offset = daysBetween(min, parseDate(m.dueDate)) * pixelsPerDay();
  grid.scrollLeft = Math.max(0, offset - grid.clientWidth / 3);
}

/* ============== RENDER ============== */
function renderAll() {
  renderFilterBar();
  if (STATE.view === 'gantt') renderGantt();
  else if (STATE.view === 'calendar') renderCalendar();
  else if (STATE.view === 'mywork') renderMyWork();
  else if (STATE.view === 'workload') renderWorkload();
  renderDetailPanel();
  refreshCurrentUserBadge();
  refreshUndoRedoButtons();
  syncControlsToState();  // also refreshes the Paste Project button visibility
}

function refreshUndoRedoButtons() {
  const undoBtn = $('#undoBtn');
  const redoBtn = $('#redoBtn');
  if (undoBtn) {
    const top = STATE.undoStack[STATE.undoStack.length - 1];
    undoBtn.disabled = !top;
    undoBtn.title = top ? `Undo: ${top.label} (Cmd/Ctrl+Z)` : 'Nothing to undo (Cmd/Ctrl+Z)';
  }
  if (redoBtn) {
    const top = STATE.redoStack[STATE.redoStack.length - 1];
    redoBtn.disabled = !top;
    redoBtn.title = top ? `Redo: ${top.label} (Cmd/Ctrl+Shift+Z)` : 'Nothing to redo (Cmd/Ctrl+Shift+Z)';
  }
}

// Persist any UI-state change (filters, view, calendar toggles, etc.) to
// both localStorage cache and the user's Firebase prefs document. Called
// from anywhere a STATE.filters / STATE.view / STATE.show* mutation happens.
function persistUiState() {
  saveLocal();
  scheduleUserPrefsSync();
}

function refreshCurrentUserBadge() {
  const badge = $('#currentUserBadge');
  const dot = $('#currentUserDot');
  const name = $('#currentUserName');
  if (!badge || !dot || !name) return;
  const me = STATE.data.currentUserId ? getEngineer(STATE.data.currentUserId) : null;
  if (me) {
    badge.classList.remove('unset');
    dot.style.background = getEngineerColor(me);
    name.textContent = me.name;
    badge.title = `Signed in as ${me.name} (${me.role}). Click to change.`;
  } else {
    badge.classList.add('unset');
    dot.style.background = 'var(--text-faint)';
    name.textContent = '⚠ Not identified — click to set';
    badge.title = 'Click to identify yourself';
  }
}

// Just the visual side of switching views — set the active tab class,
// show/hide the right view container and toolbar. Doesn't trigger render
// or persistence. Used by setView() and during init() to align the DOM
// with whatever STATE.view was restored from localStorage/userPrefs.
function applyViewToDom(v) {
  $$('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  $('#ganttView').style.display = v === 'gantt' ? 'flex' : 'none';
  $('#calendarView').style.display = v === 'calendar' ? 'flex' : 'none';
  $('#myworkView').style.display = v === 'mywork' ? 'flex' : 'none';
  $('#workloadView').style.display = v === 'workload' ? 'flex' : 'none';
  $('#ganttToolbar').style.display = v === 'gantt' ? 'flex' : 'none';
  $('#calendarToolbar').style.display = v === 'calendar' ? 'flex' : 'none';
  $('#myworkToolbar').style.display = v === 'mywork' ? 'flex' : 'none';
  $('#workloadToolbar').style.display = v === 'workload' ? 'flex' : 'none';
  $('#filterBar').style.display = (v === 'gantt' || v === 'calendar') ? 'flex' : 'none';
  syncControlsToState();
}

// Sync all toolbar/header controls (checkboxes, selects, button-toggles)
// to the current STATE values. Important after restoring STATE from
// localStorage / Firebase: without this, e.g. STATE.showTasks=false but
// the <input type="checkbox"> still shows as checked because that's the
// HTML default. Called from applyViewToDom() and after preferences sync.
function syncControlsToState() {
  // Calendar toggles
  const cmTog = $('#showMilestones');
  if (cmTog) cmTog.checked = !!STATE.showMilestones;
  const ctTog = $('#showTasks');
  if (ctTog) ctTog.checked = !!STATE.showTasks;
  // Color mode dropdown
  const cmSel = $('#colorMode');
  if (cmSel && STATE.colorMode) cmSel.value = STATE.colorMode;
  // Zoom level button group (Gantt has it, Workload has its own)
  $$('#zoomToggle .zoom-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.zoom === STATE.zoomLevel);
  });
  // Workload zoom
  $$('#workloadToolbar .zoom-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.zoom === STATE.zoomLevel);
  });
  // Paste Project button — visible only when a project is on the clipboard.
  const pp = $('#pasteProjectBtn');
  if (pp) {
    if (STATE.clipboard && STATE.clipboard.type === 'project') {
      pp.style.display = '';
      pp.title = `Paste "${STATE.clipboard.item.name || ''}"`;
    } else {
      pp.style.display = 'none';
    }
  }
}

function setView(v) {
  if (!maybeConfirmDiscard()) return;
  discardEdits();
  STATE.view = v;
  applyViewToDom(v);
  renderAll();
  // Persist the chosen view so reopening the app puts the user back where
  // they were (same tab, same filters, etc).
  saveLocal();
  scheduleUserPrefsSync();
  if (v === 'gantt') setTimeout(scrollTodayDefault, 50);
  if (v === 'calendar') setTimeout(scrollCalendarToToday, 50);
  if (v === 'workload') setTimeout(scrollWorkloadToToday, 50);
}

/* ============== GANTT ============== */
function getVisibleColumns() {
  return Object.entries(STATE.columnSettings).filter(([k, c]) => c.visible).map(([k, c]) => ({ key: k, ...c }));
}
function totalSideWidth() {
  return getVisibleColumns().reduce((sum, c) => sum + c.width, 0);
}
// What's actually visible on screen for the side panel. Defaults to the full
// column-sum width; when the user drags the side resizer to make it smaller,
// only this clipped width is shown — the columns themselves keep their sizes
// and the Gantt area visually overlaps them on the right.
function visibleSideWidth() {
  const total = totalSideWidth();
  if (STATE.sidePanelVisibleWidth == null) return total;
  return Math.min(total, Math.max(60, STATE.sidePanelVisibleWidth));
}
// Map column keys to a quick-filter type so the column header itself can open a filter picker.
const COLUMN_FILTER_TYPE = {
  client: 'client',
  mgr: 'manager',
  assign: 'engineer',
  cat: 'category',
  status: 'milestone_status',
};

function renderColumnHeaders() {
  return getVisibleColumns().map(c => {
    const filterType = COLUMN_FILTER_TYPE[c.key];
    const hasActiveFilter = filterType && STATE.filters.some(f => f.type === filterType);
    const caret = filterType
      ? `<span class="col-filter-caret ${hasActiveFilter ? 'active' : ''}" data-col-filter="${c.key}" title="Filter by ${escapeHtml(c.label)}">▾</span>`
      : '';
    return `
      <div class="side-col-${c.key}" style="width:${c.width}px;">
        <span class="col-label-text">${escapeHtml(c.label)}</span>
        ${caret}
        <div class="col-resize-handle" data-col-resize="${c.key}"></div>
      </div>
    `;
  }).join('');
}

function renderColumnSettingsList() {
  return Object.entries(STATE.columnSettings).map(([key, c]) => `
    <div class="col-settings-row">
      <input type="checkbox" data-col-key="${key}" data-col-field="visible" ${c.visible ? 'checked' : ''} ${c.required ? 'disabled' : ''} />
      <span class="col-label">${escapeHtml(c.label)}${c.required ? ' <span style="color:var(--text-faint); font-size:10px;">(required)</span>' : ''}</span>
      <span style="font-size: 10px; color: var(--text-faint);">Width:</span>
      <input type="number" data-col-key="${key}" data-col-field="width" value="${c.width}" min="60" max="500" step="10" />
      <span style="color: var(--text-faint); font-size: 10px;">px</span>
    </div>
  `).join('');
}

function renderGantt() {
  const wrap = $('#ganttView');

  // Preserve scroll positions so opening/closing the detail panel
  // (or any small re-render) doesn't reset scrollLeft / scrollTop.
  let prevGridLeft = null, prevGridTop = null;
  const prevGrid = $('#ganttGridScroll');
  if (prevGrid) {
    prevGridLeft = prevGrid.scrollLeft;
    prevGridTop = prevGrid.scrollTop;
  }

  if (STATE.data.projects.length === 0) {
    wrap.innerHTML = `
      <div class="empty-state">
        <h2>No projects yet</h2>
        <p>Add your first project to start scheduling.</p>
        <div style="display:flex; gap:8px;">
          <button class="btn primary" onclick="document.getElementById('newProjectBtn').click()">+ New Project</button>
        </div>
      </div>`;
    return;
  }

  const { min, max } = getOverallDateRange();
  const totalDays = daysBetween(min, max) + 1;
  const dayWidth = pixelsPerDay();
  const timelineWidth = totalDays * dayWidth;
  // Two widths: the inner content (all columns laid out) is fullSideWidth.
  // The container that's visible on screen is visSideWidth — when the user
  // shrinks the side panel, the container clips and the rightmost columns
  // get hidden behind the Gantt area.
  const fullSideWidth = totalSideWidth();
  const visSideWidth = visibleSideWidth();
  const sideWidth = visSideWidth; // backwards-compat alias used below

  const headerHtml = renderTimelineHeader(min, totalDays, dayWidth);
  const rows = buildGanttRows();
  let sideHtml = '';
  let gridHtml = '';
  rows.forEach((row) => {
    sideHtml += renderGanttSideRow(row);
    gridHtml += renderGanttGridRow(row, min, dayWidth);
  });

  const todayOffset = daysBetween(min, today()) * dayWidth + dayWidth / 2;

  wrap.innerHTML = `
    <div class="gantt-header">
      <div class="gantt-side-header" id="sideHeader" style="width: ${visSideWidth}px;">
        <div class="gantt-side-header-content" style="width: ${fullSideWidth}px;">
          <span class="drag-handle-spacer" aria-hidden="true"></span>
          ${renderColumnHeaders()}
        </div>
        <div class="side-resize-handle" id="sideResizer"></div>
      </div>
      <div class="gantt-timeline-header-wrap" id="ganttHeaderScroll">
        <div class="gantt-timeline-header" style="width: ${timelineWidth}px;">
          ${headerHtml}
        </div>
      </div>
    </div>
    <div class="gantt-body">
      <div class="gantt-side-body" id="ganttSideScroll" style="width: ${visSideWidth}px;">
        <div class="gantt-side-body-inner" style="width: ${fullSideWidth}px;">${sideHtml}</div>
      </div>
      <div class="gantt-grid-wrap" id="ganttGridScroll">
        <div style="width: ${timelineWidth}px; position: relative;">
          ${(() => {
            // Weekend overlay: vertical bands over Sat/Sun. Drawn behind rows
            // (z-index 0; rows are z-index 1) so weekday/weekend separation
            // is visible across the whole chart, not just in the header.
            let bands = '';
            for (let i = 0; i < totalDays; i++) {
              const d = addDays(min, i);
              const dow = d.getDay();
              if (dow === 0 || dow === 6) {
                bands += `<div class="weekend-band" style="left:${i * dayWidth}px; width:${dayWidth}px;"></div>`;
              }
            }
            return bands;
          })()}
          ${gridHtml}
          <div class="today-line" style="left: ${todayOffset}px;"></div>
        </div>
      </div>
    </div>
  `;

  const headerScroll = $('#ganttHeaderScroll');
  const sideScroll = $('#ganttSideScroll');
  const gridScroll = $('#ganttGridScroll');

  // Restore previous scroll positions so detail-panel open/close doesn't reset scroll.
  if (prevGridLeft !== null && gridScroll) {
    gridScroll.scrollLeft = prevGridLeft;
    gridScroll.scrollTop = prevGridTop;
    if (headerScroll) headerScroll.scrollLeft = prevGridLeft;
    if (sideScroll) sideScroll.scrollTop = prevGridTop;
  }

  let syncing = false;
  gridScroll.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    headerScroll.scrollLeft = gridScroll.scrollLeft;
    sideScroll.scrollTop = gridScroll.scrollTop;
    syncing = false;
    updateStickyMajorCells(gridScroll, sideWidth);
    // Auto-extend the timeline when the user scrolls to either edge so they
    // can pan back/forward indefinitely. Throttled so the re-render doesn't
    // happen on every scroll event.
    maybeExtendTimeline(gridScroll);
  });
  sideScroll.addEventListener('scroll', () => {
    if (syncing) return;
    syncing = true;
    gridScroll.scrollTop = sideScroll.scrollTop;
    syncing = false;
  });

  // Initial sticky positioning
  updateStickyMajorCells(gridScroll, sideWidth);

  attachGanttEvents();
  attachSideResizer();
  attachDragHandlers(min, dayWidth);
}

// Extends the timeline by 90 days in either direction when the user reaches
// the left or right edge of the Gantt grid. Re-renders so the new days are
// drawn. When extending left, scrollLeft is adjusted to keep the user's
// calendar position visually anchored.
let _extendTimer = null;
function maybeExtendTimeline(gridScroll) {
  if (_extendTimer) return;
  _extendTimer = setTimeout(() => {
    _extendTimer = null;
    if (!gridScroll || !gridScroll.isConnected) return;
    const scrollLeft = gridScroll.scrollLeft;
    const maxScroll = gridScroll.scrollWidth - gridScroll.clientWidth;
    const EDGE = 80;
    const EXTEND = 90;
    if (scrollLeft <= EDGE) {
      const dayWidth = pixelsPerDay();
      STATE.timelineExtraLeft = (STATE.timelineExtraLeft || 0) + EXTEND;
      const adj = EXTEND * dayWidth;
      renderGantt();
      const newGrid = $('#ganttGridScroll');
      if (newGrid) newGrid.scrollLeft = scrollLeft + adj;
    } else if (scrollLeft >= maxScroll - EDGE) {
      STATE.timelineExtraRight = (STATE.timelineExtraRight || 0) + EXTEND;
      renderGantt();
      const newGrid = $('#ganttGridScroll');
      if (newGrid) newGrid.scrollLeft = scrollLeft;
    }
  }, 150);
}

// Sticky behavior for major (month/year) header cells: when scrolling
// horizontally, the cell currently visible at the left edge "sticks" to that
// edge, so its month/year label remains readable instead of scrolling out of
// view. As the next month's cell arrives, it pushes the previous one out
// (a classic sticky-header effect).
function updateStickyMajorCells(gridScroll, sideWidth) {
  const headerWrap = $('#ganttHeaderScroll');
  if (!headerWrap) return;
  const cells = headerWrap.querySelectorAll('.timeline-row-major .major-cell');
  if (!cells.length) return;
  const scrollLeft = gridScroll.scrollLeft;
  // Compute each cell's left/right relative to the header content.
  let runningLeft = 0;
  const ranges = [];
  cells.forEach(cell => {
    const w = cell.offsetWidth;
    ranges.push({ cell, left: runningLeft, right: runningLeft + w, width: w });
    runningLeft += w;
  });

  // The leftmost cell whose right edge is past the current scroll position is
  // the one currently "covering" the left edge of the visible area.
  let activeIdx = -1;
  for (let i = 0; i < ranges.length; i++) {
    if (ranges[i].right > scrollLeft) { activeIdx = i; break; }
  }
  if (activeIdx === -1) activeIdx = ranges.length - 1;

  for (let i = 0; i < ranges.length; i++) {
    const r = ranges[i];
    const cell = r.cell;
    if (i === activeIdx) {
      // The sticky cell: it stays pinned to the visible-area left edge as we
      // scroll past its natural starting position. translate moves it from its
      // natural position (which would slide left out of view) to the new
      // visible-left position.
      // Visible-area left, in header-content coordinates, is `scrollLeft`
      // (the header is synced to scroll the same as grid).
      let translate = scrollLeft - r.left;
      // Clamp: never translate negatively (we don't push the cell right of its
      // natural position) and never beyond the cell's own width (after that
      // point, the next cell takes over and this one is fully out of view).
      if (translate < 0) translate = 0;
      if (translate > r.width) translate = r.width;
      cell.style.transform = `translateX(${translate}px)`;
      cell.classList.add('is-sticky');
    } else {
      cell.style.transform = '';
      cell.classList.remove('is-sticky');
    }
  }
}

function renderTimelineHeader(min, totalDays, dayWidth) {
  const z = STATE.zoomLevel;
  let major = '';
  let minor = '';
  const t = today();
  const todayY = t.getFullYear();
  const todayM = t.getMonth();

  // Helper: render a major (top) cell representing one month, with year highlighted
  // and the current month marked.
  const monthMajorCell = (year, month, w) => {
    const isCurrent = (year === todayY && month === todayM);
    const cls = `major-cell ${isCurrent ? 'current-month' : ''}`;
    // Show full month name when there's room, else short.
    const monthName = new Date(year, month, 1).toLocaleDateString('en-US', {
      month: w >= 110 ? 'long' : 'short',
    });
    const yearLabel = `<span class="major-year">${year}</span>`;
    const dot = isCurrent ? '<span class="current-dot"></span>' : '';
    return `<div class="${cls}" style="width: ${w}px;">${dot}<span class="major-month">${monthName}</span> ${yearLabel}</div>`;
  };

  if (z === 'day') {
    let curMonth = -1, curYear = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getMonth() !== curMonth || d.getFullYear() !== curYear) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const startD = addDays(min, monthStart);
          major += monthMajorCell(startD.getFullYear(), startD.getMonth(), w);
        }
        curMonth = d.getMonth();
        curYear = d.getFullYear();
        monthStart = i;
      }
      const isWknd = d.getDay() === 0 || d.getDay() === 6;
      const isToday = fmtDate(d) === todayStr();
      minor += `<div class="minor-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width: ${dayWidth}px;">
        <span class="label-1">${d.getDate()}</span>
        <span class="label-2">${['S','M','T','W','T','F','S'][d.getDay()]}</span>
      </div>`;
    }
    const w = (totalDays - monthStart) * dayWidth;
    const startD = addDays(min, monthStart);
    major += monthMajorCell(startD.getFullYear(), startD.getMonth(), w);
  } else if (z === 'week') {
    let curMonth = -1, curYear = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getMonth() !== curMonth || d.getFullYear() !== curYear) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const startD = addDays(min, monthStart);
          major += monthMajorCell(startD.getFullYear(), startD.getMonth(), w);
        }
        curMonth = d.getMonth();
        curYear = d.getFullYear();
        monthStart = i;
      }
      const isWknd = d.getDay() === 0 || d.getDay() === 6;
      const isToday = fmtDate(d) === todayStr();
      // Show day number on Mondays AND on today, so today is never hidden.
      const showLabel = d.getDay() === 1 || isToday;
      minor += `<div class="minor-cell ${isWknd?'weekend':''} ${isToday?'today':''}" style="width: ${dayWidth}px;">
        ${showLabel ? `<span class="label-1">${d.getDate()}</span>` : ''}
      </div>`;
    }
    const w = (totalDays - monthStart) * dayWidth;
    const startD = addDays(min, monthStart);
    major += monthMajorCell(startD.getFullYear(), startD.getMonth(), w);
  } else if (z === 'month') {
    let curYear = -1, yearStart = 0;
    let curMonth = -1, monthStart = 0;
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      if (d.getFullYear() !== curYear) {
        if (curYear !== -1) {
          const w = (i - yearStart) * dayWidth;
          major += `<div class="major-cell year-cell" style="width: ${w}px;"><span class="major-year">${curYear}</span></div>`;
        }
        curYear = d.getFullYear();
        yearStart = i;
      }
      if (d.getMonth() !== curMonth) {
        if (curMonth !== -1) {
          const w = (i - monthStart) * dayWidth;
          const startD = addDays(min, monthStart);
          const isCurrent = (startD.getFullYear() === todayY && startD.getMonth() === todayM);
          const name = startD.toLocaleDateString('en-US', { month: 'short' });
          minor += `<div class="minor-cell month-minor ${isCurrent?'current':''}" style="width: ${w}px;"><span class="label-1">${name}</span></div>`;
        }
        curMonth = d.getMonth();
        monthStart = i;
      }
    }
    const wY = (totalDays - yearStart) * dayWidth;
    major += `<div class="major-cell year-cell" style="width: ${wY}px;"><span class="major-year">${curYear}</span></div>`;
    const wM = (totalDays - monthStart) * dayWidth;
    const startD = addDays(min, monthStart);
    const isCurrent = (startD.getFullYear() === todayY && startD.getMonth() === todayM);
    const nameM = startD.toLocaleDateString('en-US', { month: 'short' });
    minor += `<div class="minor-cell month-minor ${isCurrent?'current':''}" style="width: ${wM}px;"><span class="label-1">${nameM}</span></div>`;
  } else {
    // quarter view
    let curYear = -1, yearStart = 0;
    let curQ = -1, qStart = 0;
    const todayQ = Math.floor(todayM / 3);
    for (let i = 0; i < totalDays; i++) {
      const d = addDays(min, i);
      const q = Math.floor(d.getMonth() / 3);
      if (d.getFullYear() !== curYear) {
        if (curYear !== -1) {
          const w = (i - yearStart) * dayWidth;
          major += `<div class="major-cell year-cell" style="width: ${w}px;"><span class="major-year">${curYear}</span></div>`;
        }
        curYear = d.getFullYear();
        yearStart = i;
      }
      if (q !== curQ) {
        if (curQ !== -1) {
          const w = (i - qStart) * dayWidth;
          const startD = addDays(min, qStart);
          const isCurrent = (startD.getFullYear() === todayY && curQ === todayQ);
          minor += `<div class="minor-cell month-minor ${isCurrent?'current':''}" style="width: ${w}px;"><span class="label-1">Q${curQ+1}</span></div>`;
        }
        curQ = q;
        qStart = i;
      }
    }
    const wY = (totalDays - yearStart) * dayWidth;
    major += `<div class="major-cell year-cell" style="width: ${wY}px;"><span class="major-year">${curYear}</span></div>`;
    const wQ = (totalDays - qStart) * dayWidth;
    const startD = addDays(min, qStart);
    const isCurrent = (startD.getFullYear() === todayY && curQ === todayQ);
    minor += `<div class="minor-cell month-minor ${isCurrent?'current':''}" style="width: ${wQ}px;"><span class="label-1">Q${curQ+1}</span></div>`;
  }

  return `<div class="timeline-row-major">${major}</div><div class="timeline-row-minor">${minor}</div>`;
}

const SORT_LABELS = {
  manual:       { label: 'Manual',          desc: 'Order projects were added' },
  name:         { label: 'Project Name',    desc: 'Alphabetical by name' },
  number:       { label: 'Project Number',  desc: 'Numeric (e.g., 24-105 → 24-118)' },
  soonest_due:  { label: 'Soonest Deadline',desc: 'Earliest active milestone first' },
  manager:      { label: 'Project Manager', desc: 'Group by manager' },
  client:       { label: 'Client',          desc: 'Group by client' },
  newest:       { label: 'Newest First',    desc: 'Most recently created first' },
  oldest:       { label: 'Oldest First',    desc: 'Earliest created first' },
};

function refreshSortButtonLabel() {
  const btn = $('#sortBtn');
  if (!btn) return;
  const cur = SORT_LABELS[STATE.projectSort] || SORT_LABELS.manual;
  btn.innerHTML = `⇅ Sort: ${escapeHtml(cur.label)}`;
  btn.classList.toggle('active', STATE.projectSort !== 'manual');
}

function openSortPopup(anchor) {
  let html = `<div style="padding:8px 12px; font-size:11px; color:var(--accent); border-bottom:1px solid var(--border); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; background: rgba(212, 165, 116, 0.06);">Sort Projects By</div>`;
  for (const [key, info] of Object.entries(SORT_LABELS)) {
    const sel = STATE.projectSort === key;
    html += `<div class="popup-menu-item ${sel ? 'selected' : ''}" data-sort-key="${key}">
      <span class="popup-checkbox">${sel ? '✓' : ''}</span>
      <span style="flex:1;">
        <div>${escapeHtml(info.label)}</div>
        <div style="font-size:10px; color:var(--text-faint); margin-top:1px;">${escapeHtml(info.desc)}</div>
      </span>
    </div>`;
  }
  const popup = showPopup(anchor, html);
  popup.querySelectorAll('[data-sort-key]').forEach(item => {
    item.addEventListener('click', (e) => {
      e.stopPropagation();
      const key = item.dataset.sortKey;
      if (STATE.projectSort === key) { closePopup(); return; }
      STATE.projectSort = key;
      // Sort is per-viewer (everyone may want a different order). Save to
      // local cache + user prefs, NOT to the shared schedule document.
      saveLocal();
      scheduleUserPrefsSync();
      closePopup();
      refreshSortButtonLabel();
      renderAll();
    });
  });
}

function getSortedProjects() {
  const list = STATE.data.projects.slice();
  const sort = STATE.projectSort || 'manual';

  // For 'soonest_due' we look at the earliest non-completed milestone due date.
  const earliestDueOf = (p) => {
    let earliest = null;
    for (const m of (p.milestones || [])) {
      if (!m.dueDate) continue;
      const st = getStatus(m.statusId);
      if (st && st.isCompleted) continue;
      if (!earliest || m.dueDate < earliest) earliest = m.dueDate;
    }
    return earliest;
  };

  // Use a stable sort by adding original index as a tiebreaker.
  list.forEach((p, i) => p.__origIdx = i);

  const cmp = (a, b) => {
    if (sort === 'manual') return a.__origIdx - b.__origIdx;
    if (sort === 'name') {
      return (a.name || '').localeCompare(b.name || '') || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'number') {
      // Treat empty number as "after" everything else
      const an = (a.number || '').trim();
      const bn = (b.number || '').trim();
      if (!an && !bn) return a.__origIdx - b.__origIdx;
      if (!an) return 1;
      if (!bn) return -1;
      return an.localeCompare(bn, undefined, { numeric: true, sensitivity: 'base' }) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'soonest_due') {
      const ad = earliestDueOf(a);
      const bd = earliestDueOf(b);
      if (!ad && !bd) return a.__origIdx - b.__origIdx;
      if (!ad) return 1;
      if (!bd) return -1;
      return ad.localeCompare(bd) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'manager') {
      const am = (getEngineer(a.managerId)?.name || '').toLowerCase();
      const bm = (getEngineer(b.managerId)?.name || '').toLowerCase();
      if (!am && !bm) return a.__origIdx - b.__origIdx;
      if (!am) return 1;
      if (!bm) return -1;
      return am.localeCompare(bm) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'client') {
      const ac = (a.client || '').toLowerCase();
      const bc = (b.client || '').toLowerCase();
      if (!ac && !bc) return a.__origIdx - b.__origIdx;
      if (!ac) return 1;
      if (!bc) return -1;
      return ac.localeCompare(bc) || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'newest') {
      return (b.createdAt || '').localeCompare(a.createdAt || '') || (a.__origIdx - b.__origIdx);
    }
    if (sort === 'oldest') {
      return (a.createdAt || '').localeCompare(b.createdAt || '') || (a.__origIdx - b.__origIdx);
    }
    return a.__origIdx - b.__origIdx;
  };

  list.sort(cmp);
  list.forEach(p => { delete p.__origIdx; });
  return list;
}

function buildGanttRows() {
  const rows = [];
  const projects = getSortedProjects();
  for (const p of projects) {
    if (!projectPassesFilters(p)) continue;
    rows.push({ type: 'project', project: p });
    if (p.expanded !== false) {
      for (const m of (p.milestones || [])) {
        if (!milestonePassesFilters(m)) continue;
        rows.push({ type: 'milestone', project: p, milestone: m });
        if (m.expanded) {
          for (const t of (m.tasks || [])) {
            if (!taskPassesFilters(t)) continue;
            rows.push({ type: 'task', project: p, milestone: m, task: t });
          }
        }
      }
    }
  }
  return rows;
}

function isSelectedRow(type, ids) {
  if (!STATE.selectedItem) return false;
  if (STATE.selectedItem.type !== type) return false;
  if (STATE.selectedItem.projectId !== ids.projectId) return false;
  if (type === 'project') return true;
  if (STATE.selectedItem.milestoneId !== ids.milestoneId) return false;
  if (type === 'milestone') return true;
  return STATE.selectedItem.taskId === ids.taskId;
}

function renderGanttSideRow(row) {
  const cs = STATE.columnSettings;
  const wrap = (key, content, classes = '') => {
    const c = cs[key];
    if (!c || !c.visible) return '';
    return `<div class="side-col-${key} ${classes}" style="width:${c.width}px;">${content}</div>`;
  };

  if (row.type === 'project') {
    const p = row.project;
    const expandIcon = (p.expanded !== false) ? '▾' : '▸';
    const status = getStatus(p.statusId);
    const mgr = getEngineer(p.managerId);
    const sel = isSelectedRow('project', { projectId: p.id }) ? 'selected' : '';

    const numLabel = p.number ? `<span style="color:var(--accent); font-size:10px; margin-right:6px; font-weight:600;">${escapeHtml(p.number)}</span>` : '';
    const mgrCell = mgr
      ? `<span class="mgr-text" style="color:${getEngineerColor(mgr)}" title="${escapeHtml(mgr.name)}"><span class="eng-dot" style="background:${getEngineerColor(mgr)}"></span>${escapeHtml(abbreviateName(mgr.name))}</span>`
      : `<span class="editable-empty">— None —</span>`;

    const allAssignIds = [...new Set((p.milestones || []).flatMap(m => m.assigneeIds || []))];
    const assignDots = allAssignIds.slice(0, 5).map(id => {
      const e = getEngineer(id);
      return e ? `<span class="eng-dot" style="background:${getEngineerColor(e)}" title="${escapeHtml(e.name)}"></span>` : '';
    }).join('');
    const assignCell = allAssignIds.length === 0
      ? `<span class="editable-empty">—</span>`
      : `<span class="assign-text">${assignDots}${allAssignIds.length > 5 ? `<span style="font-size:9px; color:var(--text-faint); margin-left:2px;">+${allAssignIds.length - 5}</span>` : ''}</span>`;

    return `
      <div class="row project-row">
        <div class="row-side ${sel}" data-type="project" data-project-id="${p.id}">
          ${wrap('name', `<span class="expand-icon" data-toggle="project" data-project-id="${p.id}">${expandIcon}</span><span class="name-text" data-rename="project" data-project-id="${p.id}">${numLabel}${escapeHtml(p.name)}<span class="rename-edit-icon">✏️</span></span><button class="row-add-btn" data-add="milestone" data-project-id="${p.id}" title="Add milestone">+</button>`)}
          ${wrap('client', `<span class="client-text" title="${escapeHtml(p.client || '')}">${p.client ? escapeHtml(p.client) : '<span class=\"editable-empty\">—</span>'}</span>`)}
          ${wrap('mgr', `<span class="editable-cell" data-edit-cell="manager" data-project-id="${p.id}" title="Click to change manager">${mgrCell}</span>`)}
          ${wrap('assign', assignCell)}
          ${wrap('cat', '')}
          ${wrap('due', '')}
          ${wrap('status', `<span class="status-text" style="color:${status.color}">${escapeHtml(status.name)}</span>`)}
        </div>
      </div>`;
  }

  if (row.type === 'milestone') {
    const m = row.milestone;
    const expandIcon = (m.tasks && m.tasks.length > 0) ? (m.expanded ? '▾' : '▸') : '';
    const expandClass = expandIcon ? '' : 'placeholder';
    const urg = urgencyClass(m.dueDate);
    const status = getStatus(m.statusId);
    const cat = getCategory(m.categoryId);
    const sel = isSelectedRow('milestone', { projectId: row.project.id, milestoneId: m.id }) ? 'selected' : '';

    const assigneeIds = m.assigneeIds || [];
    const assignDots = assigneeIds.slice(0, 4).map(id => {
      const e = getEngineer(id);
      return e ? `<span class="eng-dot" style="background:${getEngineerColor(e)}" title="${escapeHtml(e.name)}"></span>` : '';
    }).join('');
    const assignCell = assigneeIds.length === 0
      ? `<span class="editable-empty">+ assign</span>`
      : `<span class="assign-text">${assignDots}${assigneeIds.length > 4 ? `<span style="font-size:9px; color:var(--text-faint); margin-left:2px;">+${assigneeIds.length - 4}</span>` : ''}</span>`;
    const catCell = cat
      ? `<span class="cat-text" style="color:${cat.color}">${escapeHtml(cat.name)}</span>`
      : `<span class="editable-empty">— set —</span>`;

    const progress = (typeof m.progress === 'number') ? m.progress : 0;
    const progressIcon = `<span class="mini-progress" data-edit-cell="progress" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Progress: ${progress}% — click to change"><span class="mini-progress-fill" style="width:${progress}%; background:${cat ? cat.color : 'var(--accent)'};"></span></span>`;

    // Visibility badge — shared has no badge (default), restricted ones get a small lock/group icon
    const vis = m.visibility || 'shared';
    const visBadge = vis === 'shared' ? '' :
      `<span class="vis-badge vis-${vis}" title="${vis === 'engineers' ? 'Visible to engineers/managers only' : 'Private — only the owner sees this'}">${vis === 'engineers' ? '👥' : '🔒'}</span>`;

    // Sticky-note badge — shown when this milestone has a non-empty
    // notes field. Lets you spot at a glance which milestones have
    // saved context without opening the detail panel. Tooltip shows
    // the first ~120 chars so you can preview without clicking.
    const hasNotes = !!(m.notes && String(m.notes).trim());
    const notesPreview = hasNotes ? String(m.notes).trim().replace(/\s+/g, ' ').slice(0, 160) : '';
    const notesTooltip = hasNotes && m.notes.length > 160 ? notesPreview + '…' : notesPreview;
    const notesBadge = hasNotes ? `<span class="notes-badge" title="Note: ${escapeHtml(notesTooltip)}">🗒️</span>` : '';

    return `
      <div class="row milestone-row" draggable="true" data-drag-type="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}">
        <span class="drag-handle" title="Drag to reorder"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><line x1="2" y1="3" x2="10" y2="3"/><line x1="2" y1="6" x2="10" y2="6"/><line x1="2" y1="9" x2="10" y2="9"/></svg></span>
        <div class="row-side indent-1 ${sel}" data-type="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}">
          ${wrap('name', `<span class="expand-icon ${expandClass}" data-toggle="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}">${expandIcon || '·'}</span><span class="name-text" data-rename="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}">◆ ${escapeHtml(m.name)}<span class="rename-edit-icon">✏️</span>${notesBadge}</span>${visBadge}${progressIcon}<button class="row-add-btn" data-add="task" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Add task to this milestone">+</button>`)}
          ${wrap('client', '')}
          ${wrap('mgr', '')}
          ${wrap('assign', `<span class="editable-cell" data-edit-cell="assignees" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to assign">${assignCell}</span>`)}
          ${wrap('cat', `<span class="editable-cell" data-edit-cell="category" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to change category">${catCell}</span>`)}
          ${wrap('due', `<span class="editable-cell" data-edit-cell="m_due" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to change due date"><span class="due-text ${urg}">${m.dueDate ? formatShortDate(m.dueDate) : '— set —'}</span></span>`)}
          ${wrap('status', `<span class="editable-cell" data-edit-cell="m_status" data-project-id="${row.project.id}" data-milestone-id="${m.id}" title="Click to change status"><span class="status-text" style="color:${status.color}">${escapeHtml(status.name)}</span></span>`)}
        </div>
      </div>`;
  }

  if (row.type === 'task') {
    const t = row.task;
    const eng = getEngineer(t.assigneeId);
    const sel = isSelectedRow('task', { projectId: row.project.id, milestoneId: row.milestone.id, taskId: t.id }) ? 'selected' : '';
    const assignCell = eng
      ? `<span class="assign-text" title="${escapeHtml(eng.name)}"><span class="eng-dot" style="background:${getEngineerColor(eng)}"></span><span style="font-size:11px; color:${getEngineerColor(eng)};">${escapeHtml(abbreviateName(eng.name))}</span></span>`
      : `<span class="editable-empty">+ assign</span>`;
    const range = t.start && t.end ? `${formatShortDate(t.start)}–${formatShortDate(t.end)}` : '';
    const tStatus = getStatus(t.statusId) || getStatus('st_notstarted');

    // Sticky-note badge for tasks — same pattern as milestones, so a
    // task that has saved context is visible from the row list without
    // opening the detail panel.
    const tHasNotes = !!(t.notes && String(t.notes).trim());
    const tNotesPreview = tHasNotes ? String(t.notes).trim().replace(/\s+/g, ' ').slice(0, 160) : '';
    const tNotesTooltip = tHasNotes && t.notes.length > 160 ? tNotesPreview + '…' : tNotesPreview;
    const tNotesBadge = tHasNotes ? `<span class="notes-badge" title="Note: ${escapeHtml(tNotesTooltip)}">🗒️</span>` : '';

    return `
      <div class="row" draggable="true" data-drag-type="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}">
        <span class="drag-handle" title="Drag to reorder"><svg viewBox="0 0 12 12" width="10" height="10" aria-hidden="true"><line x1="2" y1="3" x2="10" y2="3"/><line x1="2" y1="6" x2="10" y2="6"/><line x1="2" y1="9" x2="10" y2="9"/></svg></span>
        <div class="row-side indent-2 ${sel}" data-type="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}">
          ${wrap('name', `<span class="expand-icon placeholder">·</span><span class="name-text" data-rename="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" style="color: var(--text-dim); font-size: 11px;">${escapeHtml(t.name || '(unnamed task)')}<span class="rename-edit-icon">✏️</span>${tNotesBadge}</span>`)}
          ${wrap('client', '')}
          ${wrap('mgr', '')}
          ${wrap('assign', `<span class="editable-cell" data-edit-cell="t_assignee" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" title="Click to change assignee">${assignCell}</span>`)}
          ${wrap('cat', '')}
          ${wrap('due', `<span class="editable-cell" data-edit-cell="t_dates" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" title="Click to change task dates"><span class="due-text" style="font-size:10px;">${range}</span></span>`)}
          ${wrap('status', `<span class="editable-cell" data-edit-cell="t_status" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}" title="Click to change status"><span class="status-text" style="color:${tStatus.color}; font-size:10px;">${escapeHtml(tStatus.name)}</span></span>`)}
        </div>
      </div>`;
  }
}


function renderGanttGridRow(row, min, dayWidth) {
  if (row.type === 'project') {
    const p = row.project;
    let html = '';
    const range = getProjectDateRange(p);
    if (range.min && range.max) {
      const left = daysBetween(min, range.min) * dayWidth;
      const width = (daysBetween(range.min, range.max) + 1) * dayWidth;
      const status = getStatus(p.statusId);
      html += `<div class="bar project-bar" style="left:${left}px; width:${width}px; background:${status.color};"></div>`;
      // Floating label after the bar end (GoodDay-style) showing project number/name.
      // Lets the user identify the project from the chart without hovering.
      const labelLeft = left + width + 8;
      const numLabel = p.number ? `<span class="proj-tag-num">${escapeHtml(p.number)}</span>` : '';
      html += `<div class="project-end-label" style="left:${labelLeft}px;">${numLabel}<span class="proj-tag-name">${escapeHtml(p.name)}</span></div>`;
    }
    // milestone tick marks always visible on project row, even if collapsed
    for (const m of (p.milestones || [])) {
      if (!m.dueDate) continue;
      if (!milestonePassesFilters(m)) continue;
      const dDate = parseDate(m.dueDate);
      const left = daysBetween(min, dDate) * dayWidth + dayWidth/2 - 5;
      const color = getColorFor(m, 'milestone');
      const cat = getCategory(m.categoryId);
      html += `<div class="milestone-marker on-project"
                data-tooltip-title="◆ ${escapeHtml(m.name)}"
                data-tooltip-meta="${escapeHtml(p.name)}${cat ? ' · ' + escapeHtml(cat.name) : ''} · ${escapeHtml(m.dueDate)}"
                data-type="milestone" data-project-id="${p.id}" data-milestone-id="${m.id}"
                style="left:${left}px; background:${color};"></div>`;
    }
    return `<div class="row-grid project-row">${html}</div>`;
  }
  if (row.type === 'milestone') {
    const m = row.milestone;
    let html = '';
    if (!m.expanded && m.tasks && m.tasks.length > 0) {
      for (const t of m.tasks) {
        if (!t.start || !t.end) continue;
        if (!taskPassesFilters(t)) continue;
        const tStart = parseDate(t.start);
        const tEnd = parseDate(t.end);
        const left = daysBetween(min, tStart) * dayWidth;
        const width = (daysBetween(tStart, tEnd) + 1) * dayWidth;
        t._milestoneRef = m;
        const color = getColorFor(t, 'task');
        delete t._milestoneRef;
        const eng = getEngineer(t.assigneeId);
        const engName = eng ? eng.name : 'Unassigned';
        html += `<div class="bar task-bar compact draggable"
                  data-type="task" data-project-id="${row.project.id}" data-milestone-id="${m.id}" data-task-id="${t.id}"
                  data-tooltip-title="${escapeHtml(t.name || 'Task')}"
                  data-tooltip-meta="${escapeHtml(m.name)} · ${escapeHtml(engName)} · ${escapeHtml(t.start)} – ${escapeHtml(t.end)}"
                  style="left:${left}px; width:${width}px; background:${color};">
                  <div class="resize-handle left" data-resize="start"></div>
                  <div class="resize-handle right" data-resize="end"></div>
                </div>`;
      }
    }
    if (m.dueDate) {
      const left = daysBetween(min, parseDate(m.dueDate)) * dayWidth + dayWidth/2 - 6;
      const color = getColorFor(m, 'milestone');
      const assignNames = (m.assigneeIds || []).map(id => { const e = getEngineer(id); return e ? e.name : ''; }).filter(Boolean).join(', ');
      const cat = getCategory(m.categoryId);
      html += `<div class="milestone-marker draggable"
                data-type="milestone" data-project-id="${row.project.id}" data-milestone-id="${m.id}"
                data-tooltip-title="◆ ${escapeHtml(m.name)}"
                data-tooltip-meta="${cat ? escapeHtml(cat.name) + ' · ' : ''}${escapeHtml(m.dueDate)}${assignNames ? ' · ' + escapeHtml(assignNames) : ''}"
                style="left:${left}px; background:${color};"></div>`;
    }
    return `<div class="row-grid milestone-row">${html}</div>`;
  }
  if (row.type === 'task') {
    const t = row.task;
    let html = '';
    if (t.start && t.end) {
      const tStart = parseDate(t.start);
      const tEnd = parseDate(t.end);
      const left = daysBetween(min, tStart) * dayWidth;
      const width = (daysBetween(tStart, tEnd) + 1) * dayWidth;
      t._milestoneRef = row.milestone;
      const color = getColorFor(t, 'task');
      delete t._milestoneRef;
      const eng = getEngineer(t.assigneeId);
      const engName = eng ? eng.name : 'Unassigned';
      const taskLabel = t.name || engName;
      html = `<div class="bar task-bar draggable"
              data-type="task" data-project-id="${row.project.id}" data-milestone-id="${row.milestone.id}" data-task-id="${t.id}"
              data-tooltip-title="${escapeHtml(t.name || 'Task')}"
              data-tooltip-meta="${escapeHtml(row.milestone.name)} · ${escapeHtml(engName)} · ${escapeHtml(t.start)} – ${escapeHtml(t.end)}"
              style="left:${left}px; width:${width}px; background:${color}; height:14px; top:9px;">
              <div class="resize-handle left" data-resize="start"></div>
              <span class="bar-label">${escapeHtml(taskLabel)}</span>
              <div class="resize-handle right" data-resize="end"></div>
            </div>`;
    }
    return `<div class="row-grid">${html}</div>`;
  }
}

function attachGanttEvents() {
  $$('[data-toggle]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const t = el.dataset.toggle;
      const pid = el.dataset.projectId;
      const mid = el.dataset.milestoneId;
      if (t === 'project') {
        const p = getProject(pid);
        const newVal = !(p.expanded);
        p.expanded = newVal;
        // Per-viewer view state — don't sync to others
        setExpanded('project', pid, newVal);
      } else if (t === 'milestone') {
        const m = getMilestone(pid, mid);
        const newVal = !m.expanded;
        m.expanded = newVal;
        setExpanded('milestone', mid, newVal);
      }
      // No saveData() — expand/collapse is local only
      renderGantt();
    });
  });

  // Inline + buttons for adding a milestone (on a project row) or a task
  // (on a milestone row). Reuses the same add logic as the detail panel.
  $$('[data-add]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const what = el.dataset.add;
      const projectId = el.dataset.projectId;
      const milestoneId = el.dataset.milestoneId;
      if (what === 'milestone') {
        if (!maybeConfirmDiscard()) return;
        discardEdits();
        const p = getProject(projectId);
        if (!p) return;
        const newM = { id: uid('m'), name: 'New Milestone', categoryId: '', statusId: 'st_notstarted', dueDate: '', assigneeIds: [], tasks: [], notes: '', progress: 0, visibility: 'shared', createdBy: STATE.data.currentUserId || '' };
        if (!p.milestones) p.milestones = [];
        p.milestones.push(newM);
        p.expanded = true;  // ensure the new milestone is visible
        logHistory(projectId, `Added milestone "${newM.name}"`);
        saveData();
        STATE.selectedItem = { type: 'milestone', projectId, milestoneId: newM.id };
        renderAll();
      } else if (what === 'task') {
        if (!maybeConfirmDiscard()) return;
        discardEdits();
        const m = getMilestone(projectId, milestoneId);
        if (!m) return;
        const newT = { id: uid('t'), name: '', assigneeId: '', start: todayStr(), end: m.dueDate || todayStr(), statusId: 'st_notstarted' };
        if (!m.tasks) m.tasks = [];
        m.tasks.push(newT);
        m.expanded = true;  // ensure the new task is visible
        logHistory(projectId, `Added task to "${m.name}"`);
        saveData();
        STATE.selectedItem = { type: 'task', projectId, milestoneId, taskId: newT.id };
        renderAll();
      }
    });
  });

  // Inline delete buttons on each row. Items are moved to the Trash (where
  // they live for 30 days and can be restored) rather than being permanently
  // erased, and Cmd/Ctrl+Z immediately undoes the deletion.
  $$('[data-delete]').forEach(el => {
    el.addEventListener('click', async (e) => {
      e.stopPropagation();
      const what = el.dataset.delete;
      const projectId = el.dataset.projectId;
      const milestoneId = el.dataset.milestoneId;
      const taskId = el.dataset.taskId;
      if (what === 'project') {
        const p = getProject(projectId);
        if (!p) return;
        const milestoneCount = (p.milestones || []).length;
        const taskCount = (p.milestones || []).reduce((n, m) => n + (m.tasks || []).length, 0);
        const detail = milestoneCount > 0
          ? ` Includes ${milestoneCount} milestone${milestoneCount === 1 ? '' : 's'}${taskCount > 0 ? ` and ${taskCount} task${taskCount === 1 ? '' : 's'}` : ''}.`
          : '';
        if (!(await showConfirm(`Move "${p.name}" to Trash?${detail}\n\nIt can be restored from Settings → Trash for ${TRASH_DAYS} days.`, { title: 'Delete Project', confirmLabel: 'Move to Trash' }))) return;
        captureUndo(`delete project "${p.name}"`, { type: 'projectsList' });
        moveToTrash('project', p, { projectId: p.id, projectName: p.name });
        const idx = STATE.data.projects.findIndex(x => x.id === projectId);
        if (idx >= 0) STATE.data.projects.splice(idx, 1);
        if (STATE.selectedItem?.projectId === projectId) STATE.selectedItem = null;
        saveData();
        renderAll();
        toast(`Moved "${p.name}" to Trash. Cmd/Ctrl+Z to undo.`, 'success');
      } else if (what === 'milestone') {
        const p = getProject(projectId);
        const m = getMilestone(projectId, milestoneId);
        if (!p || !m) return;
        const taskCount = (m.tasks || []).length;
        const detail = taskCount > 0 ? ` Includes ${taskCount} task${taskCount === 1 ? '' : 's'}.` : '';
        if (!(await showConfirm(`Move milestone "${m.name}" to Trash?${detail}\n\nIt can be restored for ${TRASH_DAYS} days.`, { title: 'Delete Milestone', confirmLabel: 'Move to Trash' }))) return;
        captureUndo(`delete milestone "${m.name}"`, { type: 'milestonesList', projectId: p.id });
        moveToTrash('milestone', m, { projectId: p.id, projectName: p.name, milestoneId: m.id, milestoneName: m.name });
        const idx = (p.milestones || []).findIndex(x => x.id === milestoneId);
        if (idx >= 0) p.milestones.splice(idx, 1);
        logHistory(projectId, `Deleted milestone "${m.name}"`);
        if (STATE.selectedItem?.milestoneId === milestoneId) STATE.selectedItem = null;
        saveData();
        renderAll();
        toast(`Moved "${m.name}" to Trash. Cmd/Ctrl+Z to undo.`, 'success');
      } else if (what === 'task') {
        const p = getProject(projectId);
        const m = getMilestone(projectId, milestoneId);
        if (!m) return;
        const t = (m.tasks || []).find(x => x.id === taskId);
        if (!t) return;
        const label = t.name || '(unnamed task)';
        if (!(await showConfirm(`Move task "${label}" to Trash?\n\nIt can be restored for ${TRASH_DAYS} days.`, { title: 'Delete Task', confirmLabel: 'Move to Trash' }))) return;
        captureUndo(`delete task "${label}"`, { type: 'tasksList', projectId: p?.id, milestoneId: m.id });
        moveToTrash('task', t, { projectId: p?.id, projectName: p?.name, milestoneId: m.id, milestoneName: m.name });
        const idx = (m.tasks || []).findIndex(x => x.id === taskId);
        if (idx >= 0) m.tasks.splice(idx, 1);
        logHistory(projectId, `Deleted task "${label}" from "${m.name}"`);
        if (STATE.selectedItem?.taskId === taskId) STATE.selectedItem = null;
        saveData();
        renderAll();
        toast(`Moved "${label}" to Trash. Cmd/Ctrl+Z to undo.`, 'success');
      }
    });
  });

  // Inline-editable cells (manager, assignees, category, milestone status, task assignee, progress)
  $$('[data-edit-cell]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const kind = el.dataset.editCell;
      const projectId = el.dataset.projectId;
      const milestoneId = el.dataset.milestoneId;
      const taskId = el.dataset.taskId;
      if (kind === 'manager') openManagerPopup(el, projectId);
      else if (kind === 'assignees') openAssigneesPopup(el, projectId, milestoneId);
      else if (kind === 'category') openCategoryPopup(el, projectId, milestoneId);
      else if (kind === 'm_status') openStatusPopup(el, projectId, milestoneId);
      else if (kind === 't_assignee') openTaskAssigneePopup(el, projectId, milestoneId, taskId);
      else if (kind === 'progress') openProgressPopup(el, projectId, milestoneId);
      else if (kind === 'm_due') openDueDatePopup(el, projectId, milestoneId);
      else if (kind === 't_dates') openTaskDatesPopup(el, projectId, milestoneId, taskId);
      else if (kind === 't_status') openTaskStatusPopup(el, projectId, milestoneId, taskId);
    });
  });

  // Rename: double-click on the name OR click on the small ✏️ icon (which
  // appears on hover). Single click is preserved for opening the detail panel.
  // Pressing F2 while a row is selected also triggers rename.
  $$('[data-rename]').forEach(el => {
    el.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      e.preventDefault();
      // Clear selection that double-click otherwise creates
      window.getSelection?.()?.removeAllRanges?.();
      openRenameInline(el, el.dataset.projectId, el.dataset.milestoneId, el.dataset.taskId);
    });
  });
  $$('.rename-edit-icon').forEach(icon => {
    icon.addEventListener('click', (e) => {
      e.stopPropagation();
      const nameSpan = icon.closest('[data-rename]');
      if (!nameSpan) return;
      openRenameInline(nameSpan, nameSpan.dataset.projectId, nameSpan.dataset.milestoneId, nameSpan.dataset.taskId);
    });
  });

  // Column header filter carets — open the same picker that quick-filter uses
  $$('[data-col-filter]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const colKey = el.dataset.colFilter;
      const filterType = COLUMN_FILTER_TYPE[colKey];
      if (filterType) openQuickFilterPicker(el, filterType);
    });
  });

  // Column resize handles in header
  $$('[data-col-resize]').forEach(handle => {
    handle.addEventListener('mousedown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      const key = handle.dataset.colResize;
      const col = STATE.columnSettings[key];
      if (!col) return;
      const startX = e.clientX;
      const startW = col.width;
      handle.classList.add('active');
      const onMove = (ev) => {
        const dx = ev.clientX - startX;
        col.width = Math.max(60, Math.min(500, startW + dx));
        // immediate visual feedback without re-render
        document.querySelectorAll(`.side-col-${key}`).forEach(el => { el.style.width = col.width + 'px'; });
        // Inner content gets the full column-sum width; outer container uses
        // the user's visible-width preference (clipping any overflow).
        const inner = document.querySelectorAll('.gantt-side-header-content, .gantt-side-body-inner');
        inner.forEach(el => { el.style.width = totalSideWidth() + 'px'; });
        const visW = visibleSideWidth();
        const sh = $('#sideHeader'); if (sh) sh.style.width = visW + 'px';
        const sb = $('#ganttSideScroll'); if (sb) sb.style.width = visW + 'px';
      };
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        handle.classList.remove('active');
        // Column widths are per-viewer — save to user prefs only, not to
        // the shared schedule document.
        saveLocal();
        scheduleUserPrefsSync();
        renderGantt();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });

  $$('.row-side').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-toggle]')) return;
      if (e.target.closest('[data-edit-cell]')) return;
      if (e.target.closest('[data-add]')) return;
      if (e.target.closest('[data-delete]')) return;
      handleSelectClick({
        type: el.dataset.type,
        projectId: el.dataset.projectId,
        milestoneId: el.dataset.milestoneId,
        taskId: el.dataset.taskId,
      });
    });

    // Hover over a milestone row: if its due date is off-screen, show a
    // "jump-to-deadline" indicator pinned to the left or right edge of the
    // Gantt grid. Clicking it scrolls the grid to that date.
    if (el.dataset.type === 'milestone') {
      el.addEventListener('mouseenter', () => {
        const m = getMilestone(el.dataset.projectId, el.dataset.milestoneId);
        showDeadlineJumperIfOffscreen(m, el);
      });
      el.addEventListener('mouseleave', () => {
        // Small delay so the user can move from the row to the jumper itself
        scheduleDeadlineJumperHide();
      });
    }
  });

  // Click-to-select bars/markers (when not dragging)
  $$('.bar:not(.project-bar), .milestone-marker').forEach(el => {
    if (el.dataset.tooltipTitle) {
      el.addEventListener('mouseenter', (e) => showTooltip(e, el));
      el.addEventListener('mouseleave', hideTooltip);
      el.addEventListener('mousemove', (e) => moveTooltip(e));
    }
  });

  // -------- Drag & drop reordering --------
  // Each row can be picked up by its left-side hamburger handle and
  // dropped above or below another row of the same kind. Projects can
  // be reordered among the project list; milestones can reorder within
  // their parent project; tasks within their parent milestone. Crossing
  // parents (e.g. moving a milestone to a different project) is allowed
  // intentionally — we update the parent reference on drop.
  wireRowDragAndDrop();
}

// Holds the in-flight drag info between dragstart/dragover/drop handlers.
// Cleared by dragend regardless of success/cancel.
let _dragInfo = null;

function wireRowDragAndDrop() {
  $$('.row[draggable="true"]').forEach(row => {
    // Only start drag when the user grabbed the handle — clicking other
    // parts of the row (rename, expand) shouldn't initiate a drag.
    let armed = false;
    const handle = row.querySelector('.drag-handle');
    if (handle) {
      handle.addEventListener('mousedown', () => { armed = true; });
      handle.addEventListener('mouseup',   () => { armed = false; });
      // Touch — the handle is the only valid grip on mobile too
      handle.addEventListener('touchstart', () => { armed = true; }, { passive: true });
      handle.addEventListener('touchend',   () => { armed = false; });
    }
    row.addEventListener('dragstart', (e) => {
      if (!armed) {
        e.preventDefault();
        return;
      }
      _dragInfo = {
        type: row.dataset.dragType,
        projectId: row.dataset.projectId,
        milestoneId: row.dataset.milestoneId || null,
        taskId: row.dataset.taskId || null,
      };
      row.classList.add('dragging');
      // Most browsers require setData for drag to work
      try { e.dataTransfer.setData('text/plain', JSON.stringify(_dragInfo)); } catch {}
      e.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => {
      armed = false;
      row.classList.remove('dragging');
      $$('.row.drop-target-above, .row.drop-target-below').forEach(r => {
        r.classList.remove('drop-target-above', 'drop-target-below');
      });
      _dragInfo = null;
    });
    row.addEventListener('dragover', (e) => {
      if (!_dragInfo) return;
      // Only allow dropping onto rows of the same TYPE.
      if (row.dataset.dragType !== _dragInfo.type) return;
      // Milestones can only reorder within their own project — moving
      // to a different project requires the Copy/Paste flow, not drag.
      // Tasks can only land within their own milestone.
      if (_dragInfo.type === 'milestone') {
        if (row.dataset.projectId !== _dragInfo.projectId) return;
      }
      if (_dragInfo.type === 'task') {
        if (row.dataset.milestoneId !== _dragInfo.milestoneId) return;
      }
      e.preventDefault();  // signals "drop allowed here"
      e.dataTransfer.dropEffect = 'move';
      // Decide above-vs-below based on cursor position within the row
      const rect = row.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      row.classList.toggle('drop-target-above', above);
      row.classList.toggle('drop-target-below', !above);
    });
    row.addEventListener('dragleave', () => {
      row.classList.remove('drop-target-above', 'drop-target-below');
    });
    row.addEventListener('drop', (e) => {
      if (!_dragInfo) return;
      if (row.dataset.dragType !== _dragInfo.type) return;
      if (_dragInfo.type === 'milestone' && row.dataset.projectId !== _dragInfo.projectId) return;
      if (_dragInfo.type === 'task' && row.dataset.milestoneId !== _dragInfo.milestoneId) return;
      e.preventDefault();
      const rect = row.getBoundingClientRect();
      const above = (e.clientY - rect.top) < rect.height / 2;
      const target = {
        type: row.dataset.dragType,
        projectId: row.dataset.projectId,
        milestoneId: row.dataset.milestoneId || null,
        taskId: row.dataset.taskId || null,
      };
      performReorder(_dragInfo, target, above);
      row.classList.remove('drop-target-above', 'drop-target-below');
    });
  });
}

// Move `source` so that it lands immediately above (`above=true`) or
// below the `target` row. Both must be the same type. Mutates the
// schedule data, saves, and re-renders. Only supports milestone and
// task reorder — projects are not draggable.
function performReorder(source, target, above) {
  // No-op when dropping onto itself
  if (source.type === 'milestone' && source.milestoneId === target.milestoneId) return;
  if (source.type === 'task' && source.taskId === target.taskId) return;

  if (source.type === 'milestone') {
    // Milestone drag is restricted to the same project (enforced in
    // wireRowDragAndDrop). Anything else is a no-op for safety.
    if (source.projectId !== target.projectId) return;
    const project = getProject(source.projectId);
    if (!project) return;
    captureUndo('reorder milestone', { type: 'milestonesList', projectId: project.id });
    const list = project.milestones || [];
    const srcIdx = list.findIndex(m => m.id === source.milestoneId);
    if (srcIdx < 0) return;
    const item = list.splice(srcIdx, 1)[0];
    let tgtIdx = list.findIndex(m => m.id === target.milestoneId);
    if (tgtIdx < 0) {
      list.splice(srcIdx, 0, item);  // restore on bad target
      return;
    }
    if (!above) tgtIdx++;
    list.splice(tgtIdx, 0, item);
    logHistory(project.id, `Reordered milestone "${item.name}"`);
    saveData();
    renderAll();
    toast('Milestone order updated', 'success');
    return;
  }

  if (source.type === 'task') {
    // Tasks stay within their parent milestone (enforced earlier).
    const m = getMilestone(source.projectId, source.milestoneId);
    if (!m) return;
    captureUndo('reorder task', { type: 'tasksList', projectId: source.projectId, milestoneId: source.milestoneId });
    const list = m.tasks || [];
    const srcIdx = list.findIndex(t => t.id === source.taskId);
    if (srcIdx < 0) return;
    const item = list.splice(srcIdx, 1)[0];
    let tgtIdx = list.findIndex(t => t.id === target.taskId);
    if (tgtIdx < 0) {
      list.splice(srcIdx, 0, item);
      return;
    }
    if (!above) tgtIdx++;
    list.splice(tgtIdx, 0, item);
    logHistory(source.projectId, `Reordered task in "${m.name}"`);
    saveData();
    renderAll();
    toast('Task order updated', 'success');
    return;
  }
}

/* ============== DEADLINE JUMPER ============== */
let _deadlineJumperHideTimer = null;

function showDeadlineJumperIfOffscreen(milestone, rowEl) {
  // Always start by clearing any pending hide and removing existing jumper.
  if (_deadlineJumperHideTimer) { clearTimeout(_deadlineJumperHideTimer); _deadlineJumperHideTimer = null; }
  removeDeadlineJumper();

  if (!milestone || !milestone.dueDate) return;
  const grid = $('#ganttGridScroll');
  if (!grid) return;

  const { min } = getOverallDateRange();
  const dayWidth = pixelsPerDay();
  const dueOffset = daysBetween(min, parseDate(milestone.dueDate)) * dayWidth + dayWidth / 2;

  const visStart = grid.scrollLeft;
  const visEnd = visStart + grid.clientWidth;
  // Add a small inset so a date that's right at the edge isn't called "off-screen".
  const inset = 24;

  let side = null;
  if (dueOffset < visStart + inset) side = 'left';
  else if (dueOffset > visEnd - inset) side = 'right';
  else return; // already on-screen — no jumper needed

  const jumper = document.createElement('div');
  jumper.className = `deadline-jumper`;
  jumper.id = 'activeDeadlineJumper';
  const arrowChar = side === 'left' ? '◀' : '▶';
  const dayDelta = daysBetween(today(), parseDate(milestone.dueDate));
  const dateLabel = formatShortDate(milestone.dueDate);
  let deltaLabel = '';
  if (dayDelta < 0) deltaLabel = ` (${Math.abs(dayDelta)}d ago)`;
  else if (dayDelta === 0) deltaLabel = ' (today)';
  else deltaLabel = ` (in ${dayDelta}d)`;
  // Always show: arrow first if going left, arrow last if going right (so the
  // visual cue points the direction the grid will scroll). Pinned to the left
  // side regardless, so the user has a stable target to click.
  if (side === 'left') {
    jumper.innerHTML = `<span class="arrow">${arrowChar}</span><span>${escapeHtml(dateLabel)}${escapeHtml(deltaLabel)}</span>`;
  } else {
    jumper.innerHTML = `<span>${escapeHtml(dateLabel)}${escapeHtml(deltaLabel)}</span><span class="arrow">${arrowChar}</span>`;
  }
  jumper.title = `Jump to deadline: ${milestone.dueDate}`;
  jumper.addEventListener('mouseenter', () => {
    if (_deadlineJumperHideTimer) { clearTimeout(_deadlineJumperHideTimer); _deadlineJumperHideTimer = null; }
  });
  jumper.addEventListener('mouseleave', scheduleDeadlineJumperHide);
  jumper.addEventListener('click', (e) => {
    e.stopPropagation();
    // Center the deadline in the visible area
    const target = dueOffset - grid.clientWidth / 2;
    grid.scrollTo({ left: Math.max(0, target), behavior: 'smooth' });
    removeDeadlineJumper();
  });

  // Append to .gantt-body (relatively positioned).
  const body = grid.parentElement;
  if (!body) return;
  body.appendChild(jumper);

  // Compute the row's top relative to .gantt-body so the jumper aligns vertically.
  const bodyRect = body.getBoundingClientRect();
  let rowTop = 0;
  if (rowEl) {
    const rowRect = rowEl.getBoundingClientRect();
    rowTop = rowRect.top - bodyRect.top + (rowRect.height - 24) / 2;
    rowTop = Math.max(2, Math.min(bodyRect.height - 26, rowTop));
  } else {
    rowTop = (bodyRect.height - 24) / 2;
  }
  jumper.style.top = rowTop + 'px';

  // ALWAYS pin to the left edge of the grid viewport (just inside the side panel),
  // regardless of which side the deadline is on. This gives the user a stable,
  // close target to click — much shorter mouse path than the right edge, and
  // never crosses other rows that would dismiss the jumper.
  const sideWidth = totalSideWidth();
  jumper.style.left = (sideWidth + 8) + 'px';
  jumper.style.right = 'auto';
}

function scheduleDeadlineJumperHide() {
  if (_deadlineJumperHideTimer) clearTimeout(_deadlineJumperHideTimer);
  _deadlineJumperHideTimer = setTimeout(removeDeadlineJumper, 150);
}

function removeDeadlineJumper() {
  const j = $('#activeDeadlineJumper');
  if (j) j.remove();
}

/* ============== POPUP MENUS (inline editing in side panel) ============== */
function closePopup() {
  const p = $('#activePopup');
  if (p) p.remove();
  document.removeEventListener('click', closePopupOnOutsideClick, true);
  flushPendingSnapshotIfIdle();
}
function closePopupOnOutsideClick(e) {
  const p = $('#activePopup');
  if (!p) return;
  if (!p.contains(e.target)) closePopup();
}
function showPopup(anchorEl, contentHtml) {
  closePopup();
  const popup = document.createElement('div');
  popup.className = 'popup-menu';
  popup.id = 'activePopup';
  popup.innerHTML = contentHtml;
  document.body.appendChild(popup);

  const rect = anchorEl.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 4;
  // pre-measure
  const popupRect = popup.getBoundingClientRect();
  if (left + popupRect.width > window.innerWidth - 10) {
    left = Math.max(10, window.innerWidth - popupRect.width - 10);
  }
  if (top + popupRect.height > window.innerHeight - 10) {
    top = rect.top - popupRect.height - 4;
  }
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
  setTimeout(() => document.addEventListener('click', closePopupOnOutsideClick, true), 0);
  return popup;
}

function buildEngineerSearchableList(currentValue, isMulti, onSelect) {
  const engs = STATE.data.engineers;
  const renderItems = (filterStr) => {
    const f = (filterStr || '').toLowerCase();
    let items = '';
    if (!isMulti) {
      items += `<div class="popup-menu-item ${!currentValue ? 'selected' : ''}" data-eng-id="">
        <span class="popup-checkbox">${!currentValue ? '✓' : ''}</span>— None —</div>`;
    }
    const filtered = engs.filter(e => !f || e.name.toLowerCase().includes(f) || e.role.toLowerCase().includes(f));
    if (filtered.length === 0) {
      items += `<div class="popup-menu-empty">No matches</div>`;
    } else {
      for (const e of filtered) {
        const isSelected = isMulti ? (currentValue || []).includes(e.id) : (currentValue === e.id);
        items += `<div class="popup-menu-item ${isSelected ? 'selected' : ''}" data-eng-id="${e.id}">
          <span class="popup-checkbox">${isSelected ? '✓' : ''}</span>
          <span class="eng-dot" style="background:${getEngineerColor(e)}"></span>
          <span style="color:${getEngineerColor(e)}">${escapeHtml(e.name)}</span>
          <span style="color:var(--text-faint); font-size:10px; margin-left:auto;">${e.role}</span>
        </div>`;
      }
    }
    return items;
  };

  return {
    html: `
      <div class="popup-menu-search">
        <input type="text" id="popupSearchInput" placeholder="Search team..." autocomplete="off" />
      </div>
      <div id="popupItemsContainer">${renderItems('')}</div>
    `,
    attach: (popup) => {
      const input = popup.querySelector('#popupSearchInput');
      const container = popup.querySelector('#popupItemsContainer');
      input.focus();
      input.addEventListener('input', () => {
        container.innerHTML = renderItems(input.value);
        attachItemHandlers();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closePopup();
      });
      const attachItemHandlers = () => {
        container.querySelectorAll('.popup-menu-item').forEach(item => {
          item.addEventListener('click', (ev) => {
            ev.stopPropagation();
            onSelect(item.dataset.engId, popup);
          });
        });
      };
      attachItemHandlers();
    }
  };
}

function openAssigneesPopup(anchor, projectId, milestoneId) {
  const m = getMilestone(projectId, milestoneId);

  const renderAndAttach = (popup, searchStr) => {
    const f = (searchStr || '').toLowerCase();
    const filtered = STATE.data.engineers.filter(e =>
      !f || e.name.toLowerCase().includes(f) || e.role.toLowerCase().includes(f)
    );
    let itemsHtml = `
      <div class="popup-menu-search">
        <input type="text" id="popupSearchInput" placeholder="Search team..." autocomplete="off" value="${escapeHtml(searchStr || '')}" />
      </div>
      <div id="popupItemsContainer">
    `;
    if (filtered.length === 0) {

      for (const e of filtered) {

        itemsHtml += `<div class="popup-menu-item ${isSelected ? 'selected' : ''}" data-eng-id="${e.id}">
