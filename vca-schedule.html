// permission errors because canDeleteMilestone didn't cover all cases.
function canDeleteTask(p, m, t, showToast) {
  const me = STATE.data.currentUserId;
  if (!me) { if (showToast) toast('Please identify yourself first', 'error'); return false; }
  if (p.createdBy === me || p.managerId === me) return true;
  if (m.createdBy === me) return true;
  if (t && t.createdBy === me) return true;
  if (t && t.assigneeId === me) return true;
  if (showToast) toast("You don't have permission to delete this task.", 'error');
  return false;
}

STATE._writerId = uid('w');

// ============== UNDO / TRASH ==============
//
// Two layers of safety against accidental destructive changes:
//
//   1. Undo stack — each entry remembers the *before* and *after* state of
//      the specific scope (project/milestone/task) the user just touched.
//      Undo restores the "before" of that scope only, leaving everything
//      else in the current STATE alone — including changes other users may
//      have made since. This is critical for multi-user editing: my undo
//      must not stomp on your concurrent edits to a different project.
//
//   2. Trash — when a project / milestone / task is deleted, it goes into
//      STATE.data.trash (synced to Firestore) instead of being lost. Items
//      stay there for 30 days, then are auto-purged. The Trash modal lets
//      anyone restore items.
//
const UNDO_LIMIT = 30;
const TRASH_DAYS = 30;
STATE.undoStack = [];
STATE.redoStack = [];
// Copy/paste clipboard. Stores a single copied item plus its type so we
// know what "paste" should mean in context. Persisted in localStorage so a
// refresh doesn't lose the clipboard mid-task.
STATE.clipboard = null;  // { type: 'project'|'milestone'|'task', item: deepClone, withChildren: bool }
STATE._suspendUndoCapture = false; // prevent capturing during an undo/redo itself

// ============== CLIPBOARD (COPY / PASTE) ==============
//
// Single-item clipboard for projects, milestones, and tasks. We deep-clone
// on copy so later edits to the original don't bleed in, and re-id on
// paste so each pasted copy is a fully independent entity. When copying a
// parent (project / milestone) we ask the user whether to include its
// children — that flag is stored alongside the data so paste honors the
// original intent.
const CLIPBOARD_KEY = 'studio-schedule-clipboard';

function saveClipboardToStorage() {
  try {
    if (STATE.clipboard) {
      localStorage.setItem(CLIPBOARD_KEY, JSON.stringify(STATE.clipboard));
    } else {
      localStorage.removeItem(CLIPBOARD_KEY);
    }
  } catch (e) { console.warn('[clipboard] save failed', e); }
}
function loadClipboardFromStorage() {
  try {
    const raw = localStorage.getItem(CLIPBOARD_KEY);
    if (raw) STATE.clipboard = JSON.parse(raw);
  } catch (e) { console.warn('[clipboard] load failed', e); }
}

// Assign fresh ids throughout a copied subtree so pasted items don't
// collide with the originals. Also strip created/history metadata since
// the paste is, conceptually, a new entity.
function freshIdsForProject(p) {
  p.id = uid('p');
  p.createdAt = new Date().toISOString();
  p.createdBy = STATE.data.currentUserId || p.createdBy || null;
  delete p.history;
  for (const m of (p.milestones || [])) freshIdsForMilestone(m);
}
function freshIdsForMilestone(m) {
  m.id = uid('m');
  m.createdBy = STATE.data.currentUserId || m.createdBy || null;
  for (const t of (m.tasks || [])) freshIdsForTask(t);
}
function freshIdsForTask(t) {
  t.id = uid('t');
}

// Public copy entrypoints. Each takes the source item and, for parents,
// an optional withChildren flag. The flag is set after asking the user.
function copyProject(p, withChildren) {
  const data = deepClone(p);
  if (!withChildren) data.milestones = [];
  STATE.clipboard = { type: 'project', item: data, withChildren: !!withChildren };
  saveClipboardToStorage();
  toast(`Copied project "${p.name}"${withChildren ? ' with milestones' : ''}`, 'success');
}
function copyMilestone(m, withChildren) {
  const data = deepClone(m);
  if (!withChildren) data.tasks = [];
  STATE.clipboard = { type: 'milestone', item: data, withChildren: !!withChildren };
  saveClipboardToStorage();
  toast(`Copied milestone "${m.name}"${withChildren ? ' with tasks' : ''}`, 'success');
}
function copyTask(t) {
  STATE.clipboard = { type: 'task', item: deepClone(t), withChildren: false };
  saveClipboardToStorage();
  toast(`Copied task "${t.name || '(unnamed)'}"`, 'success');
}

// Paste entrypoints. Each operates on a target — projects list for
// project paste, a project for milestone paste, a milestone for task paste.
// Returns the new id (or null on failure) so callers can select it.
function pasteProject() {
  if (!STATE.clipboard || STATE.clipboard.type !== 'project') return null;
  const p = deepClone(STATE.clipboard.item);
  freshIdsForProject(p);
  p.name = p.name + ' (copy)';
  STATE.data.projects.unshift(p);
  logHistory(p.id, `Created project from clipboard`);
  saveData();
  toast(`Pasted project "${p.name}"`, 'success');
  return p.id;
}
function pasteMilestoneInto(projectId) {
  if (!STATE.clipboard || STATE.clipboard.type !== 'milestone') return null;
  const p = getProject(projectId);
  if (!p) return null;
  const m = deepClone(STATE.clipboard.item);
  freshIdsForMilestone(m);
  m.name = m.name + ' (copy)';
  if (!p.milestones) p.milestones = [];
  p.milestones.push(m);
  logHistory(projectId, `Pasted milestone "${m.name}" into project`);
  saveData();
  toast(`Pasted milestone "${m.name}"`, 'success');
  return m.id;
}
function pasteTaskInto(projectId, milestoneId) {
  if (!STATE.clipboard || STATE.clipboard.type !== 'task') return null;
  const m = getMilestone(projectId, milestoneId);
  if (!m) return null;
  const t = deepClone(STATE.clipboard.item);
  freshIdsForTask(t);
  t.name = (t.name || 'Task') + ' (copy)';
  if (!m.tasks) m.tasks = [];
  m.tasks.push(t);
  logHistory(projectId, `Pasted task into "${m.name}"`);
  saveData();
  toast(`Pasted task`, 'success');
  return t.id;
}

// Copy with a children-or-not prompt. Used by Copy buttons in detail
// panel and the keyboard shortcut. For tasks (no children possible) we
// skip the prompt.
async function copyWithPrompt(kind, item) {
  if (kind === 'task') {
    copyTask(item);
    return;
  }
  if (kind === 'project') {
    const msCount = (item.milestones || []).length;
    if (msCount === 0) {
      copyProject(item, false);
      return;
    }
    const tCount = (item.milestones || []).reduce((n, m) => n + (m.tasks || []).length, 0);
    const detail = tCount > 0 ? ` (and ${tCount} task${tCount === 1 ? '' : 's'})` : '';
    const ok = await showConfirm(
      `Include ${msCount} milestone${msCount === 1 ? '' : 's'}${detail} in the copy?\n\n• Yes: copies the project together with its milestones and tasks.\n• No: copies only the project itself — milestones will not be included.`,
      { title: 'Copy Project', confirmLabel: 'Include children', cancelLabel: 'Project only', danger: false }
    );
    copyProject(item, ok);
    return;
  }
  if (kind === 'milestone') {
    const tCount = (item.tasks || []).length;
    if (tCount === 0) {
      copyMilestone(item, false);
      return;
    }
    const ok = await showConfirm(
      `Include ${tCount} task${tCount === 1 ? '' : 's'} in the copy?\n\n• Yes: copies the milestone with its tasks.\n• No: copies only the milestone — tasks will not be included.`,
      { title: 'Copy Milestone', confirmLabel: 'Include tasks', cancelLabel: 'Milestone only', danger: false }
    );
    copyMilestone(item, ok);
    return;
  }
}

// ============== INCOMING-SYNC GUARD ==============
//
// When a Firestore sync arrives, we normally re-render the whole UI. That's
// disruptive if the user is currently typing into an inline rename input,
// the new-project modal, the detail panel, etc. — re-rendering blows away
// their input element and any text not yet committed.
//
// To prevent this, we:
//   1. Track every focused input/textarea/select via a global focusin handler.
//   2. When a snapshot arrives during active typing, stash it in
//      STATE._pendingSnapshot and skip the merge/render until the user blurs.
//   3. On blur (or modal/popup close), apply any pending snapshot.
//
STATE._pendingSnapshot = null;

function isUserActivelyTyping() {
  const el = document.activeElement;
  if (el) {
    const tag = el.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
    if (el.isContentEditable) return true;
  }
  // A popup or modal is open — sync would close it, so wait.
  if (document.getElementById('activePopup')) return true;
  const modalRoot = document.getElementById('modalRoot');
  if (modalRoot && modalRoot.children.length > 0) return true;
  return false;
}

// Wired up once at init time. We re-apply STATE._pendingSnapshot when the
// last input blurs (i.e. nothing is focused anymore).
function attachActiveInputTracker() {
  document.addEventListener('focusout', () => {
    flushPendingSnapshotIfIdle();
  }, true);
}

function deepClone(o) { return JSON.parse(JSON.stringify(o)); }

// Capture an undo entry. The `target` describes which scope is being changed
// so undo can restore just that scope and leave everything else alone:
//
//   { type: 'project',   id: projectId }                   — whole project
//   { type: 'milestone', projectId, id: milestoneId }      — single milestone
//   { type: 'task',      projectId, milestoneId, id }      — single task
//   { type: 'projectsList' }                               — for create/delete of projects
//   { type: 'milestonesList', projectId }                  — for create/delete of milestones
//   { type: 'tasksList', projectId, milestoneId }          — for create/delete of tasks
//   { type: 'trash' }                                      — for trash list changes
//
// The "before" snapshot is taken immediately, of just that scope. The "after"
// is captured by the caller invoking saveData() (we sample STATE again then).
function captureUndo(label, target) {
  if (STATE._suspendUndoCapture) return;
  if (!target) return; // require explicit scope so we don't accidentally over-undo
  const before = readScope(target);
  STATE.undoStack.push({
    label: label || 'change',
    target,
    before: deepClone(before),
    after: null, // filled in by saveData() after the change is applied
    at: Date.now(),
  });
  if (STATE.undoStack.length > UNDO_LIMIT) STATE.undoStack.shift();
  STATE.redoStack = [];
}

// Read the current value of the scope described by `target` from STATE.
function readScope(target) {
  if (target.type === 'project') {
    return STATE.data.projects.find(p => p.id === target.id) || null;
  }
  if (target.type === 'milestone') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    return (p?.milestones || []).find(m => m.id === target.id) || null;
  }
  if (target.type === 'task') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    const m = (p?.milestones || []).find(x => x.id === target.milestoneId);
    return (m?.tasks || []).find(t => t.id === target.id) || null;
  }
  if (target.type === 'projectsList') {
    return STATE.data.projects;
  }
  if (target.type === 'milestonesList') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    return p ? (p.milestones || []) : [];
  }
  if (target.type === 'tasksList') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    const m = (p?.milestones || []).find(x => x.id === target.milestoneId);
    return m ? (m.tasks || []) : [];
  }
  if (target.type === 'trash') {
    return STATE.data.trash || [];
  }
  return null;
}

// Write a value back into the scope. For list-typed targets we replace the
// whole list. For item-typed targets we replace the matching item, or insert
// it back if it was deleted (null before == "didn't exist", value == "did").
function writeScope(target, value) {
  if (target.type === 'project') {
    const idx = STATE.data.projects.findIndex(p => p.id === target.id);
    if (value === null) {
      if (idx >= 0) STATE.data.projects.splice(idx, 1);
    } else {
      if (idx >= 0) STATE.data.projects[idx] = deepClone(value);
      else STATE.data.projects.push(deepClone(value));
    }
    return;
  }
  if (target.type === 'milestone') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    if (!p) return;
    if (!p.milestones) p.milestones = [];
    const idx = p.milestones.findIndex(m => m.id === target.id);
    if (value === null) {
      if (idx >= 0) p.milestones.splice(idx, 1);
    } else {
      if (idx >= 0) p.milestones[idx] = deepClone(value);
      else p.milestones.push(deepClone(value));
    }
    return;
  }
  if (target.type === 'task') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    const m = (p?.milestones || []).find(x => x.id === target.milestoneId);
    if (!m) return;
    if (!m.tasks) m.tasks = [];
    const idx = m.tasks.findIndex(t => t.id === target.id);
    if (value === null) {
      if (idx >= 0) m.tasks.splice(idx, 1);
    } else {
      if (idx >= 0) m.tasks[idx] = deepClone(value);
      else m.tasks.push(deepClone(value));
    }
    return;
  }
  if (target.type === 'projectsList') {
    STATE.data.projects = deepClone(value || []);
    return;
  }
  if (target.type === 'milestonesList') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    if (p) p.milestones = deepClone(value || []);
    return;
  }
  if (target.type === 'tasksList') {
    const p = STATE.data.projects.find(x => x.id === target.projectId);
    const m = (p?.milestones || []).find(x => x.id === target.milestoneId);
    if (m) m.tasks = deepClone(value || []);
    return;
  }
  if (target.type === 'trash') {
    STATE.data.trash = deepClone(value || []);
    return;
  }
}

// Called by saveData() right after a write succeeds, to finalize the most
// recent undo entry's "after" snapshot.
function finalizeUndoEntry() {
  if (STATE._suspendUndoCapture) return;
  const top = STATE.undoStack[STATE.undoStack.length - 1];
  if (!top || top.after !== null) return;
  top.after = deepClone(readScope(top.target));
}

function performUndo() {
  if (STATE.undoStack.length === 0) {
    toast('Nothing to undo', 'info');
    return;
  }
  const entry = STATE.undoStack.pop();
  // Refresh the "after" snapshot in case it wasn't finalized yet
  if (entry.after === null) entry.after = deepClone(readScope(entry.target));
  STATE.redoStack.push(entry);
  STATE._suspendUndoCapture = true;
  writeScope(entry.target, entry.before);
  STATE._suspendUndoCapture = false;
  saveData();
  renderAll();
  toast(`Undid: ${entry.label}`, 'success');
}

function performRedo() {
  if (STATE.redoStack.length === 0) {
    toast('Nothing to redo', 'info');
    return;
  }
  const entry = STATE.redoStack.pop();
  STATE.undoStack.push(entry);
  STATE._suspendUndoCapture = true;
  writeScope(entry.target, entry.after);
  STATE._suspendUndoCapture = false;
  saveData();
  renderAll();
  toast(`Redid: ${entry.label}`, 'success');
}

// Move an item to the trash with metadata describing what it was. The trash
// entry includes enough context to restore the item back into its original
// parent (project/milestone), even after other rearrangements.
function moveToTrash(kind, item, context) {
  if (!STATE.data.trash) STATE.data.trash = [];
  const me = STATE.data.currentUserId ? getEngineer(STATE.data.currentUserId) : null;
  STATE.data.trash.unshift({
    id: uid('trash'),
    kind,                    // 'project' | 'milestone' | 'task'
    item: JSON.parse(JSON.stringify(item)),
    context: context || {},  // { projectId, projectName, milestoneId, milestoneName }
    deletedAt: new Date().toISOString(),
    deletedBy: me ? me.name : null,
    deletedById: me ? me.id : null,
  });
  // Auto-purge entries older than TRASH_DAYS
  const cutoff = Date.now() - TRASH_DAYS * 24 * 60 * 60 * 1000;
  STATE.data.trash = STATE.data.trash.filter(t => new Date(t.deletedAt).getTime() > cutoff);
}

function restoreFromTrash(trashId) {
  if (!STATE.data.trash) return;
  const idx = STATE.data.trash.findIndex(t => t.id === trashId);
  if (idx < 0) return;
  const entry = STATE.data.trash[idx];
  // Capture two undo entries — one for the trash list change, one for the
  // restored item's parent. We chain them so a single undo reverses both.
  captureUndo(`restore ${entry.kind} from trash`, { type: 'trash' });
  if (entry.kind === 'project') {
    STATE.data.projects.push(entry.item);
  } else if (entry.kind === 'milestone') {
    const p = getProject(entry.context.projectId);
    if (!p) {
      toast('Original project no longer exists; cannot restore milestone here.', 'error');
      return;
    }
    if (!p.milestones) p.milestones = [];
    p.milestones.push(entry.item);
  } else if (entry.kind === 'task') {
    const m = getMilestone(entry.context.projectId, entry.context.milestoneId);
    if (!m) {
      toast('Original milestone no longer exists; cannot restore task here.', 'error');
      return;
    }
    if (!m.tasks) m.tasks = [];
    m.tasks.push(entry.item);
  }
  STATE.data.trash.splice(idx, 1);
  saveData();
  renderAll();
  toast(`Restored ${entry.kind}: "${entry.item.name || '(unnamed)'}"`, 'success');
}

async function permanentlyDeleteFromTrash(trashId) {
  if (!STATE.data.trash) return;
  const idx = STATE.data.trash.findIndex(t => t.id === trashId);
  if (idx < 0) return;
  const entry = STATE.data.trash[idx];
  if (!(await showConfirm(`Permanently delete "${entry.item.name || '(unnamed)'}"?\n\nThis cannot be undone.`, { title: 'Permanent Delete', confirmLabel: 'Delete', danger: true }))) return;
  STATE.data.trash.splice(idx, 1);
  saveData();
  renderTrashModal();
  toast('Permanently deleted', 'success');
}

async function emptyTrash() {
  if (!STATE.data.trash || STATE.data.trash.length === 0) return;
  const n = STATE.data.trash.length;
  if (!(await showConfirm(`Permanently delete all ${n} items in the trash?\n\nThis cannot be undone.`, { title: 'Empty Trash', confirmLabel: 'Delete all', danger: true }))) return;
  STATE.data.trash = [];
  saveData();
  renderTrashModal();
  toast(`Emptied trash (${n} items)`, 'success');
}

function openTrashModal() {
  renderTrashModal();
}

function renderTrashModal() {
  const items = STATE.data.trash || [];
  let body;
  if (items.length === 0) {
    body = `<div style="padding: 30px 12px; text-align:center; color: var(--text-faint);">Trash is empty.</div>`;
  } else {
    const cutoffMs = TRASH_DAYS * 24 * 60 * 60 * 1000;
    body = items.map(t => {
      const ageMs = Date.now() - new Date(t.deletedAt).getTime();
      const daysLeft = Math.max(0, Math.ceil((cutoffMs - ageMs) / (24 * 60 * 60 * 1000)));
      const kindIcon = t.kind === 'project' ? '📁' : t.kind === 'milestone' ? '◆' : '·';
      const ctx = t.kind === 'milestone' ? `in ${escapeHtml(t.context.projectName || '?')}`
                : t.kind === 'task'      ? `in ${escapeHtml((t.context.milestoneName || '?'))}`
                : '';
      return `
        <div class="trash-item">
          <div class="trash-item-icon">${kindIcon}</div>
          <div class="trash-item-body">
            <div class="trash-item-name">${escapeHtml(t.item.name || '(unnamed)')}</div>
            <div class="trash-item-meta">
              ${escapeHtml(t.kind)} ${ctx} · deleted ${escapeHtml(formatRelativeTime(t.deletedAt))}${t.deletedBy ? ' by ' + escapeHtml(t.deletedBy) : ''} · ${daysLeft}d left
            </div>
          </div>
          <div class="trash-item-actions">
            <button class="btn small primary" onclick="restoreFromTrash('${t.id}')">Restore</button>
            <button class="btn small danger" onclick="permanentlyDeleteFromTrash('${t.id}')">Delete forever</button>
          </div>
        </div>
      `;
    }).join('');
  }
  $('#modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal modal-large">
        <div class="modal-header">
          <div class="modal-title">🗑 Trash <span style="color:var(--text-faint); font-size:12px; font-weight:400;">— ${items.length} item${items.length === 1 ? '' : 's'}, kept for ${TRASH_DAYS} days</span></div>
          <button class="detail-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          ${body}
        </div>
        <div class="modal-footer">
          ${items.length > 0 ? '<button class="btn danger" onclick="emptyTrash()">Empty Trash</button>' : ''}
          <button class="btn" onclick="closeModal()">Close</button>
        </div>
      </div>
    </div>
  `;
}

function formatRelativeTime(iso) {
  const t = new Date(iso).getTime();
  const diff = Date.now() - t;
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}

window.restoreFromTrash = restoreFromTrash;
window.permanentlyDeleteFromTrash = permanentlyDeleteFromTrash;
window.emptyTrash = emptyTrash;
window.openTrashModal = openTrashModal;
async function saveData() {
  // Snapshot the "after" state of the most recent undo entry now that the
  // change is committed.
  finalizeUndoEntry();
  saveLocal();
  if (STATE.firebase) {
    try {
      const { db, doc, setDoc } = STATE.firebase;
      const ref = doc(db, 'schedules', 'main');
      await setDoc(ref, {
        engineers: STATE.data.engineers,
        statuses: STATE.data.statuses,
        categories: STATE.data.categories,
        projects: STATE.data.projects,
        trash: STATE.data.trash || [],
        _writer: STATE._writerId,
        _updated: new Date().toISOString()
      });
    } catch(e) {
      console.error('Cloud save failed', e);
      toast('Cloud save failed', 'error');
    }
  }
}

/* ============== AUTO-COMPLETE ============== */
// If the user enabled "Auto-complete projects" in Settings, and every
// milestone in the given project is now in a Completed status, change the
// project's own status to the first Completed status too. No-op when the
// setting is off, when the project has no milestones, or when the project
// is already Completed.
function maybeAutoCompleteProject(projectId, opts) {
  if (!STATE.autoCompleteProject) return false;
  const silent = !!(opts && opts.silent);
  const project = STATE.data.projects.find(p => p.id === projectId);
  if (!project) return false;
  const ms = project.milestones || [];
  if (ms.length === 0) return false;
  const allDone = ms.every(m => {
    const st = getStatus(m.statusId);
    return st && st.isCompleted;
  });
  if (!allDone) return false;
  const projStatus = getStatus(project.statusId);
  if (projStatus && projStatus.isCompleted) return false;
  const completedStatus = STATE.data.statuses.find(s => s.isCompleted);
  if (!completedStatus) return false;
  const oldName = projStatus ? projStatus.name : '?';
  project.statusId = completedStatus.id;
  logHistory(projectId, `Project status: ${oldName} → ${completedStatus.name} (auto: all milestones complete)`);
  if (!silent) toast(`Project "${project.name}" marked Complete`, 'success');
  return true;
}

// Sweep every project — used when the user just enables the auto-complete
// setting, to bring already-finished projects in line right away. We pass
// silent so we don't fire one toast per project; instead we emit a single
// summary toast at the end.
function sweepAutoCompleteAll() {
  if (!STATE.autoCompleteProject) return 0;
  let changed = 0;
  for (const p of STATE.data.projects) {
    if (maybeAutoCompleteProject(p.id, { silent: true })) changed++;
  }
  if (changed > 0) {
    toast(`Auto-completed ${changed} project${changed === 1 ? '' : 's'} with all milestones done`, 'success');
  }
  return changed;
}

/* ============== HISTORY ============== */
function logHistory(projectId, action) {
  const project = STATE.data.projects.find(p => p.id === projectId);
  if (!project) return;
  if (!project.history) project.history = [];
  const userId = STATE.data.currentUserId || null;
  const userName = userId ? (getEngineer(userId)?.name || '?') : null;
  project.history.unshift({
    id: uid('h'),
    timestamp: new Date().toISOString(),
    action,
    by: userName,
    byId: userId,
  });
  if (project.history.length > 200) project.history = project.history.slice(0, 200);
}

/* ============== DATA HELPERS ============== */
function getEngineer(id) { return STATE.data.engineers.find(e => e.id === id); }

// Per-user color overrides. Each browser keeps its own preferred color for
// each engineer in localStorage. The shared engineer list (Firestore) is
// untouched — only the *display* color changes for the current viewer.
const COLOR_OVERRIDE_KEY = 'studio-schedule-color-overrides';
function loadColorOverrides() {
  try { return JSON.parse(localStorage.getItem(COLOR_OVERRIDE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveColorOverrides(map) {
  localStorage.setItem(COLOR_OVERRIDE_KEY, JSON.stringify(map || {}));
}
STATE.colorOverrides = loadColorOverrides();

// Personal preference for the calendar's milestone (deadline) color.
// Stored locally per browser like other color overrides. Default is a
// muted terracotta that reads as "deadline" without being aggressive.
const DEADLINE_COLOR_KEY = 'studio-schedule-deadline-color';
const DEADLINE_TEXT_KEY = 'studio-schedule-deadline-text';
const DEFAULT_DEADLINE_BG = '#a8554a';
const DEFAULT_DEADLINE_FG = '#fbeee5';
function loadDeadlineColors() {
  return {
    bg: localStorage.getItem(DEADLINE_COLOR_KEY) || DEFAULT_DEADLINE_BG,
    fg: localStorage.getItem(DEADLINE_TEXT_KEY)  || DEFAULT_DEADLINE_FG,
  };
}
function saveDeadlineColor(bg, fg) {
  if (bg) localStorage.setItem(DEADLINE_COLOR_KEY, bg);
  if (fg) localStorage.setItem(DEADLINE_TEXT_KEY, fg);
  STATE.deadlineColors = loadDeadlineColors();
  scheduleUserPrefsSync();
}
function resetDeadlineColors() {
  localStorage.removeItem(DEADLINE_COLOR_KEY);
  localStorage.removeItem(DEADLINE_TEXT_KEY);
  STATE.deadlineColors = loadDeadlineColors();
  scheduleUserPrefsSync();
}
STATE.deadlineColors = loadDeadlineColors();
// Returns the color the current viewer should see for this engineer:
// the local override if set, otherwise the engineer's shared color.
function getEngineerColor(engOrId) {
  const eng = (typeof engOrId === 'string') ? getEngineer(engOrId) : engOrId;
  if (!eng) return '#5a6573';
  const ovr = STATE.colorOverrides[eng.id];
  return ovr || eng.color || '#5a6573';
}

// Compact two-letter abbreviation for an engineer's name. Used in tight
// spaces (calendar tiles, narrow Gantt columns) where the full name doesn't
// fit. "Alex Quinonez" → "AQ", "Noah Park" → "NP", "Amy" → "AM".
function abbreviateName(name) {
  if (!name) return '';
  const parts = String(name).trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
  return parts[0].slice(0, 2).toUpperCase();
}
function setEngineerColorOverride(engId, color) {
  if (!engId) return;
  if (color) STATE.colorOverrides[engId] = color;
  else delete STATE.colorOverrides[engId];
  saveColorOverrides(STATE.colorOverrides);
  scheduleUserPrefsSync();
}
function clearEngineerColorOverride(engId) {
  delete STATE.colorOverrides[engId];
  saveColorOverrides(STATE.colorOverrides);
  scheduleUserPrefsSync();
}
function clearAllColorOverrides() {
  STATE.colorOverrides = {};
  saveColorOverrides({});
  scheduleUserPrefsSync();
}

// View state — per-viewer UI state that should NOT sync to other users.
// Expanded/collapsed of projects/milestones is one example: when I collapse
// a project on my screen, I don't want everyone else to suddenly see it
// collapsed too. We persist these in localStorage keyed by item id.
const VIEW_STATE_KEY = 'studio-schedule-view-state';
function loadViewState() {
  try { return JSON.parse(localStorage.getItem(VIEW_STATE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveViewStateRaw(s) {
  localStorage.setItem(VIEW_STATE_KEY, JSON.stringify(s || {}));
}
STATE.viewState = loadViewState();
// Returns whether a given project/milestone id is expanded for THIS viewer.
// Default for projects: expanded; for milestones: collapsed.
function isExpanded(kind, id) {
  const key = `${kind}:${id}`;
  if (key in STATE.viewState) return !!STATE.viewState[key];
  return kind === 'project'; // projects default open, milestones default closed
}
function setExpanded(kind, id, val) {
  STATE.viewState[`${kind}:${id}`] = !!val;
  persistViewState();
  scheduleUserPrefsSync();
}
function persistViewState() {
  const next = { ...STATE.viewState };
  for (const p of STATE.data.projects) {
    next[`project:${p.id}`] = !!p.expanded;
    for (const m of (p.milestones || [])) {
      next[`milestone:${m.id}`] = !!m.expanded;
    }
  }
  STATE.viewState = next;
  saveViewStateRaw(next);
  scheduleUserPrefsSync();
}
// Apply local view state onto the data we just received from Firestore /
// localStorage so the UI reflects MY expand/collapse choices, not the
// last writer's. Called after every sync.
function applyViewStateToData() {
  for (const p of STATE.data.projects) {
    p.expanded = isExpanded('project', p.id);
    for (const m of (p.milestones || [])) {
      m.expanded = isExpanded('milestone', m.id);
    }
  }
}
function getStatus(id) { return STATE.data.statuses.find(s => s.id === id) || STATE.data.statuses[0]; }
function getCategory(id) { return STATE.data.categories.find(c => c.id === id); }
function getProject(id) { return STATE.data.projects.find(p => p.id === id); }
function getMilestone(projectId, milestoneId) {
  const p = getProject(projectId);
  return p ? (p.milestones || []).find(m => m.id === milestoneId) : null;
}
function getTask(projectId, milestoneId, taskId) {
  const m = getMilestone(projectId, milestoneId);
  return m ? (m.tasks || []).find(t => t.id === taskId) : null;
}

function getProjectDateRange(p) {
  let min = null, max = null;
  for (const m of (p.milestones || [])) {
    if (m.dueDate) { const d = parseDate(m.dueDate); if (!min || d < min) min = d; if (!max || d > max) max = d; }
    for (const t of (m.tasks || [])) {
      if (t.start) { const ds = parseDate(t.start); if (!min || ds < min) min = ds; }
      if (t.end)   { const de = parseDate(t.end);   if (!max || de > max) max = de; }
    }
  }
  return { min, max };
}

// Extra days to add at the timeline's left/right edges. The user can extend
// these by scrolling past the current edge (auto-extends) or with the ⇤/⇥
// nudge buttons. We keep them on STATE so they persist for the session.
function getOverallDateRange() {
  let min = null, max = null;
  for (const p of STATE.data.projects) {
    if (!projectPassesFilters(p)) continue;
    const r = getProjectDateRange(p);
    if (r.min && (!min || r.min < min)) min = r.min;
    if (r.max && (!max || r.max > max)) max = r.max;
  }
  const t = today();
  if (!min || min > t) min = addDays(t, -7);
  if (!max || max < t) max = addDays(t, 30);
  min = addDays(min, -7 - (STATE.timelineExtraLeft || 0));
  max = addDays(max, 21 + (STATE.timelineExtraRight || 0));
  // align min to Monday
  const dow = min.getDay();
  const offset = dow === 0 ? -6 : 1 - dow;
  min = addDays(min, offset);
  return { min, max };
}

function urgencyClass(dueDate) {
  if (!dueDate) return '';
  const d = parseDate(dueDate);
  const t = today();
  const diff = daysBetween(t, d);
  if (diff < 0) return 'overdue';
  if (diff <= 7) return 'urgent';
  if (diff <= 14) return 'soon';
  return '';
}
function urgencyColor(dueDate) {
  const c = urgencyClass(dueDate);
  if (c === 'overdue' || c === 'urgent') return 'var(--danger)';
  if (c === 'soon') return 'var(--warn)';
  return 'var(--ok)';
}

function getColorFor(item, type) {
  if (STATE.colorMode === 'engineer') {
    let assigneeId = null;
    if (type === 'task') assigneeId = item.assigneeId;
    else if (type === 'milestone') assigneeId = (item.assigneeIds && item.assigneeIds[0]) || null;
    const eng = getEngineer(assigneeId);
    return getEngineerColor(eng);
  }
  if (STATE.colorMode === 'status') return getStatus(item.statusId).color;
  if (STATE.colorMode === 'urgency') {
    if (type === 'milestone') return urgencyColor(item.dueDate);
    if (type === 'task') return '#6b9bd1';
  }
  if (STATE.colorMode === 'category') {
    if (type === 'milestone' && item.categoryId) {
      const cat = getCategory(item.categoryId);
      if (cat) return cat.color;
    }
    if (type === 'task') {
      const m = item._milestoneRef;  // optional
      if (m && m.categoryId) {
        const cat = getCategory(m.categoryId);
        if (cat) return cat.color;
      }
    }
    return '#5a6573';
  }
  return '#5a6573';
}

/* ============== FILTERS ============== */
const FILTER_TYPES = {
  project_status: { label: 'Project Status', getOptions: () => [
    { value: 'active',    label: 'Active (in progress)' },
    { value: 'completed', label: 'Completed' },
    { value: 'onhold',    label: 'On Hold' },
    { value: 'notstarted', label: 'Not Started' },
  ]},
  manager: { label: 'Project Manager', getOptions: () =>
    STATE.data.engineers.map(e => ({ value: e.id, label: `${e.name} (${e.role})` }))
  },
  engineer: { label: 'Assignee', getOptions: () =>
    STATE.data.engineers.map(e => ({ value: e.id, label: `${e.name} (${e.role})` }))
  },
  category: { label: 'Phase/Type', getOptions: () =>
    STATE.data.categories.map(c => ({ value: c.id, label: c.name }))
  },
  client: { label: 'Client', getOptions: () => {
    const seen = new Set();
    const out = [];
    for (const p of STATE.data.projects) {
      const c = (p.client || '').trim();
      if (!c || seen.has(c)) continue;
      seen.add(c);
      out.push({ value: c, label: c });
    }
    out.sort((a, b) => a.label.localeCompare(b.label));
    return out;
  }},
  milestone_status: { label: 'Milestone Status', getOptions: () =>
    STATE.data.statuses.map(s => ({ value: s.id, label: s.name }))
  },
  visibility: { label: 'Visibility', getOptions: () => [
    { value: 'shared',    label: '🌐 Shared (everyone)' },
    { value: 'engineers', label: '👥 Engineers/Managers only' },
    { value: 'private',   label: '🔒 Private (owner only)' },
  ]},
  due_range: { label: 'Due Within', getOptions: () => [
    { value: 'overdue', label: 'Overdue' },
    { value: '7',  label: 'Next 7 days' },
    { value: '14', label: 'Next 14 days' },
    { value: '30', label: 'Next 30 days' },
    { value: '90', label: 'Next 90 days' },
  ]},
  hide_completed: { label: 'Hide Completed', getOptions: () => [
    { value: 'projects',   label: 'Hide completed projects' },
    { value: 'milestones', label: 'Hide completed milestones' },
  ]},
  hide_all_milestones_complete: { label: 'Hide Wrapped-Up Projects', getOptions: () => [
    { value: 'on', label: 'Hide projects whose milestones are all complete' },
  ]},
};

function projectPassesFilters(p) {
  // Group filters by type. Within a single type, multiple values combine
  // with OR (selecting both Manager A and Manager B should show projects
  // managed by either). Across different types they combine with AND
  // (Manager A AND Status Active = projects matching both).
  const byType = {};
  for (const f of STATE.filters) {
    (byType[f.type] || (byType[f.type] = [])).push(f.value);
  }

  // Helper: does the project match ANY value in this type's list?
  const checkType = (type, predicate) => {
    const values = byType[type];
    if (!values || values.length === 0) return true;
    return values.some(predicate);
  };

  // project_status — value is one of: active/completed/onhold/notstarted
  if (!checkType('project_status', (v) => {
    const st = getStatus(p.statusId);
    const isCompleted = st.isCompleted;
    const isActive = st.isActive;
    const isOnHold = !!st.name?.toLowerCase().includes('hold');
    const isNotStarted = !isCompleted && !isActive && !isOnHold;
    if (v === 'active') return isActive;
    if (v === 'completed') return isCompleted;
    if (v === 'onhold') return isOnHold;
    if (v === 'notstarted') return isNotStarted;
    return false;
  })) return false;

  // manager — project's manager must be one of the selected
  if (!checkType('manager', (v) => p.managerId === v)) return false;

  // client — project's client must be one of the selected
  if (!checkType('client', (v) => (p.client || '') === v)) return false;

  // hide_completed (single-value-style filter, kept for compat). Treated as
  // AND across whatever values exist (typically just 'projects').
  if (byType.hide_completed) {
    for (const v of byType.hide_completed) {
      if (v === 'projects') {
        const st = getStatus(p.statusId);
        if (st.isCompleted) return false;
      }
    }
  }

  // hide_all_milestones_complete — single behavior, just present-or-not
  if (byType.hide_all_milestones_complete) {
    const ms = p.milestones || [];
    if (ms.length > 0 && ms.every(m => (getStatus(m.statusId) || {}).isCompleted)) {
      return false;
    }
  }

  // engineer (Assignee) — at least one milestone or task assigned to ANY
  // of the selected engineers. With multiple engineers selected, this is
  // an OR: project shown if assigned to engineer A OR engineer B.
  if (!checkType('engineer', (v) => {
    for (const m of (p.milestones || [])) {
      if ((m.assigneeIds || []).includes(v)) return true;
      if ((m.tasks || []).some(t => t.assigneeId === v)) return true;
    }
    return false;
  })) return false;

  // search filter — applied on top of all type filters
  if (STATE.searchQuery) {
    const q = STATE.searchQuery.toLowerCase();
    const projectMatch = p.name.toLowerCase().includes(q) || (p.client || '').toLowerCase().includes(q) || (p.number || '').toLowerCase().includes(q);
    if (projectMatch) return true;
    let milestoneMatch = false;
    for (const m of (p.milestones || [])) {
      if (m.name.toLowerCase().includes(q)) { milestoneMatch = true; break; }
    }
    if (!milestoneMatch) return false;
  }
  return true;
}

// Visibility / privacy for milestones
//
// Each milestone has a `visibility` field with one of three values:
//   'shared'    — visible to everyone (default; only this kind syncs to Outlook)
//   'engineers' — visible only to users whose role is 'engineer' (engineers + managers)
//   'private'   — visible only to the milestone's owner (createdBy)
//
// A milestone with no visibility field is treated as 'shared' for backwards compatibility.
function canSeeMilestone(m) {
  const vis = m.visibility || 'shared';
  if (vis === 'shared') return true;
  const me = STATE.data.currentUserId;
  if (!me) return vis === 'shared'; // no logged-in user → only shared visible
  // Owner always sees their own
  if (m.createdBy === me) return true;
  if (vis === 'engineers') {
    const meEng = getEngineer(me);
    // 'engineer' role users (engineers + managers) can see; drafters can't
    return meEng && meEng.role === 'engineer';
  }
  // 'private' — only owner, already returned true above
  return false;
}

function milestonePassesFilters(m) {
  // Visibility check first — drafters never see private/engineer-only milestones
  if (!canSeeMilestone(m)) return false;

  // Group filters by type — same type = OR, different types = AND.
  const byType = {};
  for (const f of STATE.filters) {
    (byType[f.type] || (byType[f.type] = [])).push(f.value);
  }
  const checkType = (type, predicate) => {
    const values = byType[type];
    if (!values || values.length === 0) return true;
    return values.some(predicate);
  };

  if (!checkType('milestone_status', (v) => m.statusId === v)) return false;
  if (!checkType('category', (v) => m.categoryId === v)) return false;
  if (byType.hide_completed) {
    for (const v of byType.hide_completed) {
      if (v === 'milestones') {
        const st = getStatus(m.statusId);
        if (st.isCompleted) return false;
      }
    }
  }
  if (!checkType('engineer', (v) => {
    const inAssign = (m.assigneeIds || []).includes(v);
    const inTask = (m.tasks || []).some(t => t.assigneeId === v);
    return inAssign || inTask;
  })) return false;
  if (!checkType('visibility', (v) => (m.visibility || 'shared') === v)) return false;
  if (!checkType('due_range', (v) => {
    if (!m.dueDate) return false;
    const d = parseDate(m.dueDate);
    const t = today();
    const diff = daysBetween(t, d);
    if (v === 'overdue') return diff < 0;
    const days = parseInt(v);
    return diff >= 0 && diff <= days;
  })) return false;

  // search
  if (STATE.searchQuery) {
    const q = STATE.searchQuery.toLowerCase();
    if (m.name.toLowerCase().includes(q)) return true;
    return true;
  }
  return true;
}

// Task-level filter — used to hide individual tasks that don't match the
// current filter set. Today the only filter that propagates down to tasks
// is the engineer ("My Milestones") filter: when active, we hide tasks
// assigned to other people so the user only sees their own work, even if
// the parent milestone is shown because it happens to contain a task of
// theirs alongside others. With multiple engineers selected, OR semantics
// — the task is shown if assigned to any of them.
function taskPassesFilters(t) {
  const engValues = STATE.filters.filter(f => f.type === 'engineer').map(f => f.value);
  if (engValues.length === 0) return true;
  return engValues.includes(t.assigneeId);
}

function renderFilterBar() {
  const bar = $('#filterBar');
  bar.querySelectorAll('.filter-pill').forEach(el => el.remove());
  const addBtn = $('#addFilterBtn');
  const clearBtn = $('#clearFiltersBtn');
  const moreGroup = $('#filterGroupMore') || bar;

  STATE.filters.forEach((f, idx) => {
    const cfg = FILTER_TYPES[f.type];
    if (!cfg) return;
    const opts = cfg.getOptions();
    const opt = opts.find(o => o.value === f.value);
    const pill = document.createElement('span');
    pill.className = 'filter-pill active';
    pill.innerHTML = `<span style="font-weight:500;">${escapeHtml(cfg.label)}:</span> ${escapeHtml(opt ? opt.label : f.value)} <span class="x" data-idx="${idx}">×</span>`;
    pill.querySelector('.x').addEventListener('click', () => {
      STATE.filters.splice(idx, 1);
      persistUiState();
      renderAll();
    });
    if (addBtn && addBtn.parentElement === moreGroup) {
      moreGroup.insertBefore(pill, addBtn);
    } else {
      moreGroup.appendChild(pill);
    }
  });

  clearBtn.style.display = STATE.filters.length > 0 ? '' : 'none';

  // Reflect quick-filter active states
  const me = STATE.data.currentUserId;
  const isMineActive    = !!STATE.filters.find(f => f.type === 'manager' && f.value === me);
  const isMyWorkActive  = !!STATE.filters.find(f => f.type === 'engineer' && f.value === me);
  const isActiveActive  = !!STATE.filters.find(f => f.type === 'project_status' && f.value === 'active')
                       && !!STATE.filters.find(f => f.type === 'hide_completed' && f.value === 'milestones');
  const qfMine = $('#qfMine'); if (qfMine) {
    qfMine.classList.toggle('active', isMineActive);
    qfMine.disabled = !me;
    qfMine.title = me ? 'Projects I manage' : 'Set yourself in Settings → Who am I? first';
  }
  const qfMyWork = $('#qfMyWork'); if (qfMyWork) {
    qfMyWork.classList.toggle('active', isMyWorkActive);
    qfMyWork.disabled = !me;
    qfMyWork.title = me ? 'Milestones assigned to me' : 'Set yourself in Settings → Who am I? first';
  }
  const qfActive = $('#qfActive'); if (qfActive) qfActive.classList.toggle('active', isActiveActive);

  // Picker buttons: badge if a corresponding filter is set
  const setBadge = (btnId, type) => {
    const btn = $(btnId);
    if (!btn) return;
    const has = STATE.filters.some(f => f.type === type);
    btn.classList.toggle('active', has);
  };
  setBadge('#qfCategory', 'category');
  setBadge('#qfClient', 'client');
  setBadge('#qfManager', 'manager');
  setBadge('#qfVisibility', 'visibility');

  refreshSortButtonLabel();
  applyFilterBarLayout();
}

function applyFilterBarLayout() {
  const bar = $('#filterBar');
  if (!bar) return;
  const quickG = $('#filterGroupQuick');
  const moreG = $('#filterGroupMore');
  const sep = $('#filterSeparator');
  if (!quickG || !moreG || !sep) return;

  // Reorder groups based on layout state
  const layout = STATE.filterBarLayout;
  if (layout.quickFirst) {
    // Order: quick, separator, more
    if (bar.children[0] !== quickG) bar.insertBefore(quickG, bar.firstChild);
    if (quickG.nextSibling !== sep) bar.insertBefore(sep, quickG.nextSibling);
    if (sep.nextSibling !== moreG) bar.insertBefore(moreG, sep.nextSibling);
  } else {
    // Order: more, separator, quick
    if (bar.children[0] !== moreG) bar.insertBefore(moreG, bar.firstChild);
    if (moreG.nextSibling !== sep) bar.insertBefore(sep, moreG.nextSibling);
    if (sep.nextSibling !== quickG) bar.insertBefore(quickG, sep.nextSibling);
  }

  // Collapse state
  quickG.classList.toggle('collapsed', !!layout.quickCollapsed);
  sep.classList.toggle('collapsed', !!layout.quickCollapsed);
  sep.title = layout.quickCollapsed
    ? 'Click to show Quick filters · drag to swap groups'
    : 'Click to hide Quick filters · drag to swap groups';
}

// Toggle a "self" or "active" quick filter on/off
function toggleQuickFilter(kind) {
  const me = STATE.data.currentUserId;
  if (kind === 'manager_self') {
    if (!me) { toast('Set yourself in Settings → Who am I? first', 'error'); return; }
    const idx = STATE.filters.findIndex(f => f.type === 'manager' && f.value === me);
    if (idx >= 0) STATE.filters.splice(idx, 1);
    else {
      // Replace any existing manager filter
      STATE.filters = STATE.filters.filter(f => f.type !== 'manager');
      STATE.filters.push({ type: 'manager', value: me });
    }
  } else if (kind === 'engineer_self') {
    if (!me) { toast('Set yourself in Settings → Who am I? first', 'error'); return; }
    const idx = STATE.filters.findIndex(f => f.type === 'engineer' && f.value === me);
    if (idx >= 0) STATE.filters.splice(idx, 1);
    else {
      STATE.filters = STATE.filters.filter(f => f.type !== 'engineer');
      STATE.filters.push({ type: 'engineer', value: me });
    }
  } else if (kind === 'active_only') {
    // "Active only" = projects whose status is explicitly Active (in
    // progress / under review etc.) AND milestones that aren't completed.
    // Previously this used hide_completed which let On Hold projects slip
    // through — that contradicted the button's name.
    const hasProjActive = STATE.filters.find(f => f.type === 'project_status' && f.value === 'active');
    const hasMsHide = STATE.filters.find(f => f.type === 'hide_completed' && f.value === 'milestones');
    if (hasProjActive && hasMsHide) {
      // Toggle off
      STATE.filters = STATE.filters.filter(f =>
        !(f.type === 'project_status' && f.value === 'active') &&
        !(f.type === 'hide_completed' && f.value === 'milestones')
      );
    } else {
      // Toggle on — clear any prior project_status filters since "Active"
      // is the meaningful narrowing here, then add both rules.
      STATE.filters = STATE.filters.filter(f =>
        !(f.type === 'project_status' && f.value === 'active') &&
        !(f.type === 'hide_completed' && f.value === 'milestones')
      );
      STATE.filters.push({ type: 'project_status', value: 'active' });
      STATE.filters.push({ type: 'hide_completed', value: 'milestones' });
    }
  }
  persistUiState();
  renderAll();
}

// Quick-filter picker: anchored popup with options. Toggle behavior: click to add,
// click again to remove. Multiple options allowed (e.g., multiple categories).
function openQuickFilterPicker(anchor, type) {
  const cfg = FILTER_TYPES[type];
  if (!cfg) return;
  const opts = cfg.getOptions();
  if (opts.length === 0) {
    toast(`No ${cfg.label.toLowerCase()} options available`, 'error');
    return;
  }
  const renderItems = () => {
    const activeCount = STATE.filters.filter(f => f.type === type).length;
    let html = `<div style="padding:8px 12px; font-size:11px; color:var(--accent); border-bottom:1px solid var(--border); font-weight:600; text-transform:uppercase; letter-spacing:0.5px; background: rgba(212, 165, 116, 0.06);">
      ${escapeHtml(cfg.label)}${activeCount > 0 ? ` <span style="background:var(--accent); color:#1a1410; padding:1px 6px; border-radius:8px; font-size:9px; margin-left:4px;">${activeCount}</span>` : ''}
    </div>
    <div style="padding:4px 12px 6px 12px; font-size:10px; color:var(--text-faint);">Click to toggle. Multi-select supported.</div>`;
    for (const o of opts) {
      const active = STATE.filters.some(f => f.type === type && f.value === o.value);
      // Color hint for category and engineer/manager
      let dot = '';
      if (type === 'category') {
        const c = STATE.data.categories.find(x => x.id === o.value);
        if (c) dot = `<span class="eng-dot" style="background:${c.color}"></span>`;
      } else if (type === 'manager' || type === 'engineer') {
        const e = STATE.data.engineers.find(x => x.id === o.value);
        if (e) dot = `<span class="eng-dot" style="background:${getEngineerColor(e)}"></span>`;
      }
      html += `<div class="popup-menu-item ${active ? 'selected' : ''}" data-opt-value="${escapeHtml(o.value)}">
        <span class="popup-checkbox">${active ? '✓' : ''}</span>
        ${dot}
        <span>${escapeHtml(o.label)}</span>
      </div>`;
    }
    if (STATE.filters.some(f => f.type === type)) {
      html += `<div class="popup-menu-divider"></div>
        <div class="popup-menu-item" data-clear-type="${type}" style="color: var(--text-dim);">
          <span class="popup-checkbox"></span>
          <span>↺ Clear ${escapeHtml(cfg.label)} filter</span>
        </div>`;
    }
    return html;
  };
  const popup = showPopup(anchor, renderItems());
  const wireUp = () => {
    popup.querySelectorAll('[data-opt-value]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const value = item.dataset.optValue;
        const idx = STATE.filters.findIndex(f => f.type === type && f.value === value);
        if (idx >= 0) STATE.filters.splice(idx, 1);
        else STATE.filters.push({ type, value });
        persistUiState();
        renderAll();
        popup.innerHTML = renderItems();
        wireUp();
      });
    });
    popup.querySelectorAll('[data-clear-type]').forEach(item => {
      item.addEventListener('click', (e) => {
        e.stopPropagation();
        const t = item.dataset.clearType;
        STATE.filters = STATE.filters.filter(f => f.type !== t);
        persistUiState();
        renderAll();
        closePopup();
      });
    });
  };
  wireUp();
}

              <div style="max-height: 200px; overflow-y: auto; padding-right:2px;">
                ${opts.map(o => `
                  <label style="display:flex; align-items:center; gap:6px; padding:4px 6px; border-radius:3px; cursor:pointer; font-size:12px; ${activeForType.has(o.value) ? 'background: var(--accent-soft);' : ''}" data-filter-row>
                    <input type="checkbox" data-filter-type="${escapeHtml(key)}" data-filter-value="${escapeHtml(o.value)}" ${activeForType.has(o.value) ? 'checked' : ''} />
                    <span style="flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(o.label)}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
  showModal(html);

  // Toggle a filter when its checkbox changes
  $$('input[data-filter-type]').forEach(cb => {
    cb.addEventListener('change', () => {
      const type = cb.dataset.filterType;
      const value = cb.dataset.filterValue;
      const idx = STATE.filters.findIndex(f => f.type === type && f.value === value);
      if (cb.checked && idx < 0) {
        STATE.filters.push({ type, value });
      } else if (!cb.checked && idx >= 0) {
        STATE.filters.splice(idx, 1);
      }
      // Visual feedback on the row
      const row = cb.closest('[data-filter-row]');
      if (row) row.style.background = cb.checked ? 'var(--accent-soft)' : '';
      // Update active counts in the card header
      const card = cb.closest('.filter-card');
      if (card) {
        const checked = card.querySelectorAll('input[type="checkbox"]:checked').length;
        const headerCount = card.querySelector('[style*="--accent"]');
        // Simpler: just re-render counts on the headers
      }
      persistUiState();
      renderAll();
    });
  });

  // "Clear" button per category
  $$('button[data-filter-clear-type]').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.filterClearType;
      STATE.filters = STATE.filters.filter(f => f.type !== type);
      persistUiState();
      renderAll();
      // Re-render the panel to refresh counts/checkboxes
      closeModal();
      openFilterPanel();
    });
  });

  $('#filterPanelClearAll').addEventListener('click', () => {
    STATE.filters = [];
    persistUiState();
    renderAll();
    closeModal();
    openFilterPanel();
  });

  $('#filterPanelDone').addEventListener('click', () => {
    closeModal();
  });
}

function openAddFilterMenu() {
  const items = Object.entries(FILTER_TYPES).map(([key, cfg]) => `
    <div class="child-item" data-filter-type="${key}">
      <span class="child-item-name">${escapeHtml(cfg.label)}</span>
      <span style="color:var(--text-faint);">›</span>

  `).join('');
  $('#modalRoot').innerHTML = `
    <div class="modal-overlay" style="align-items: flex-start; padding-top: 80px;">

        <div class="modal-header">
          <div class="modal-title">Add Filter</div>
          <button class="detail-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="children-list" id="filterTypeList">${items}</div>
          <div id="filterValueArea"></div>

  $$('#filterTypeList .child-item').forEach(el => {
